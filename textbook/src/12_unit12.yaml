unit: 12
part: 4
part_title: AI에게 일 맡기기
title: 종합 프로젝트
glossary:
  - { term: 회고, en: retrospective, unit: 12, desc: "일을 마친 뒤 잘된 점과 바꿀 점을 돌아보고 다음에 쓸 템플릿으로 남기는 것." }
  - { term: 평가 기준표, en: rubric, unit: 12, desc: "프로젝트를 어떤 기준으로, 어느 수준이면 잘한 것인지 정리한 표." }
pages:
  - type: opener
    subtitle: 배운 것을 모두 써서, 내 문제를 에이전트와 함께 해결하기
    goals:
      - 배운 내용을 종합해 **실제 문제를 에이전트와 함께 해결**할 수 있다.
      - "프로젝트 전 과정(**목표 → 6문 → 권한 → 실행·감독 → 검수 → 회고**)을 기록할 수 있다."
      - "**평가 기준표와 최종 점검표**로 스스로의 AI 리터러시를 평가할 수 있다."
    why: |
      수학 문제집의 마지막 장이 '실전 모의고사'이듯, 이 단원은 **실전**입니다. 혼자서 처음부터 끝까지 해 보면, 앞으로 어떤 새 AI 서비스를 만나도 **같은 순서로** 쓸 수 있습니다.
    hook:
      q: 지금 내 생활이나 일에서, 에이전트에게 맡겨 보고 싶은 '조금 큰 일'은 무엇인가요?
      figure:
        kind: flow
        steps:
          - { title: 목표, desc: 완료 모습 }
          - { title: 6문, desc: 지시문 }
          - { title: 권한, desc: 최소로 }
          - { title: 실행·감독, desc: 기록 보기, hl: true }
          - { title: 검수, desc: 3단계 확인 }
          - { title: 회고, desc: 템플릿 저장 }
    keywords: [미션, 워크시트, 확인 지점, 검수, 회고, 평가 기준표]
    map: [미션 고르기, 6단계 워크시트, 모범 예시, 평가 기준표, 최종 점검]

  - type: concept
    sec: 12-1
    title: 미션 고르기
    blocks:
      - p: 아래 네 가지 미션 중 하나를 고르거나, **나만의 미션**을 정하세요. 좋은 미션은 **"혼자 하면 반나절, 맡기면 30분"**쯤 걸리는 일입니다. 너무 작으면 대화형 AI로 충분하고, 돈·계약이 걸린 일은 연습용으로 알맞지 않습니다.
      - figure:
          kind: cards
          label: 그림 12-1
          caption: 네 가지 미션 (등장인물의 상황). 나에게 맞게 바꿔도 된다.
          cols: 2
          items:
            - { key: A, title: 김정숙 · 독서 모임 문학 기행, desc: "회원 8명(70대 2명 포함)의 1박 2일 계획서: 후보 도시 2곳 비교, 이동·숙소·식당·문학관", ex: "확인 지점: 숙소를 고르기 전" }
            - { key: B, title: 박영호 · 10주년 이벤트 준비, desc: "안내문 시안 3종, 온라인 소개 문구, 준비물 체크리스트", ex: "확인 지점: 시안 고르기 전, 인쇄 주문 전" }
            - { key: C, title: 이수진 · 주민 설문 결과 보고서, desc: "개인정보를 지운 설문 결과로 보고서 초안(표·그래프·요약)", ex: "확인 지점: 숫자를 표로 만든 뒤" }
            - { key: D, title: 최민호 · 관심 직무 채용 동향, desc: "관심 기업 3곳의 채용 공고 비교와 출처가 달린 동향 정리", ex: "확인 지점: 조사할 기업을 정한 뒤" }
      - concept:
          title: 미션 고르는 기준
          body: "**시간을 많이 아끼고, 실수해도 되돌릴 수 있는 일**(8단원 위임 판단표의 왼쪽 위 칸)을 고른다. 결제·발송은 미션에 넣지 않는다."
    side:
      - note:
          kind: tip
          body: 유료 에이전트 기능이 없다면 대화형 AI로 **"계획을 먼저 보여 주고 단계별로 진행해 줘"**라고 해서 같은 순서로 연습하세요.

  - type: project
    title: 내 프로젝트 워크시트
    blocks:
      - p: 프로젝트를 진행하며 칸을 채우세요. 칸마다 괄호 안의 단원을 다시 보면 도움이 됩니다.
      - worksheet:
          tall: true
          title: "미션 이름: ________________________________"
          rows:
            - ["① 목표 <small>끝나면 무엇이 생기나? (9단원)</small>", ""]
            - ["② 심부름 6문 <small>배경·자료·완료 기준·하지 말 것·확인 시점 (9단원)</small>", ""]
            - ["③ 권한 <small>무엇을 연결하나, 최소 권한은? (10단원)</small>", ""]
            - ["④ 실행·감독 <small>작업 기록에서 바로잡은 것 (9단원)</small>", ""]
            - ["⑤ 검수 <small>확인한 숫자·출처, 고친 것 (6·9단원)</small>", ""]
            - ["⑥ 회고 <small>잘된 점, 바꿀 점, 템플릿 저장 (11단원)</small>", ""]

  - type: concept
    sec: 12-2
    title: "모범 예시 ① 미션 A — 계획하고 맡기기"
    blocks:
      - p: 김정숙 님이 미션 A를 진행한 과정입니다. 먼저 **목표**를 한 문장으로 정하고, **심부름 6문** 지시문을 썼습니다. 회원 명단이나 연락처는 넣지 않았습니다.
      - prompt:
          label: 김정숙 님의 지시문 (심부름 6문)
          text: |
            **[목표]** 독서 모임 1박 2일 문학 기행 계획서를 만들어 줘.
            **[배경]** 회원 8명, 그중 2명은 70대이고 무릎이 불편해. 다음 달 둘째 주말, 기차로 갈 수 있는 곳.
            **[자료]** 문학관이 있는 도시 중에서 후보 2곳을 골라 비교해 줘.
            **[완료 기준]** A4 2쪽. 이동·숙소·식당·문학관을 비교표로, 1인 예상 비용 포함.
            **[하지 말 것]** 예약·결제는 하지 마. 회원 개인정보는 묻지도 쓰지도 마.
            **[확인 시점]** 후보 도시 2곳을 고르면 먼저 보여 줘. 숙소는 엘리베이터 여부를 꼭 표시해.
      - table:
          label: 표 12-1
          caption: 김정숙 님이 정한 권한 (10단원 최소 권한 원칙)
          widths: [30%, 22%, 48%]
          head: [도구·연결, 권한, 이유]
          rows:
            - [웹 검색, 허용, "공개 정보만 찾는다. 메일·파일은 연결하지 않았다"]
            - [파일 만들기, 허용, 계획서를 만들어야 한다]
            - [메일·일정 연결, 연결 안 함, 이번 일에는 필요 없다]
            - [예약·결제, 하지 않음, 되돌리기 어렵다. 총무가 직접]
    side:
      - note:
          kind: tip
          body: 지시문의 **[하지 말 것]**과 **[확인 시점]**이 다음 쪽 작업 기록에서 어떻게 쓰였는지 찾아보세요.
      - note:
          kind: warn
          body: 회원 명단·연락처는 넣지 않았습니다. '70대 2명, 무릎 불편'처럼 **이름 없이 조건만** 쓰는 것은 괜찮습니다. 이름은 총무가 직접 넣습니다.

  - type: concept
    sec: 12-3
    title: "모범 예시 ② 미션 A — 감독하고 검수하기"
    blocks:
      - figure:
          kind: agentlog
          label: 그림 12-2
          caption: 미션 A의 작업 기록. 에이전트의 질문(확인 지점)에 총무가 답했다.
          goal: 독서 모임 1박 2일 문학 기행 계획서 (예약·결제 금지)
          plan:
            - { text: 후보 도시 2곳 고르기 → 총무 승인, state: done }
            - { text: 이동·숙소 비교, state: done }
            - { text: 식당·문학관 정보, state: doing }
            - { text: 계획서 2쪽 만들기 }
          log:
            - "기차 시간표·요금 검색… 2곳 비교 완료"
            - "숙소 B: 엘리베이터 없음 → 무릎 불편 회원 고려해 제외"
            - { text: "숙소 예약 페이지에서 '예약하기' 버튼 발견", hl: true }
          ask: 숙소 예약까지 진행할까요?  → 총무 "아니요, 예약은 제가 직접 할게요."
      - table:
          label: 표 12-2
          caption: 검수 결과 (6단원 3단계 확인 + 9단원 검수 체크리스트)
          widths: [34%, 66%]
          head: [확인한 것, 결과]
          rows:
            - [문학관 휴관일, "공식 홈페이지에서 확인 → 계획서와 같음 ✔"]
            - [숙소 1박 가격, "숙소 사이트 원문과 1만 원 차이 → 수정함"]
            - [엘리베이터 여부, "숙소에 전화로 확인 → 있음 ✔"]
            - [하지 말 것, "예약·결제·개인정보 없음 ✔"]
      - concept:
          label: 회고
          title: 잘된 점과 바꿀 점
          body: |
            - 잘된 점: 엘리베이터 조건을 미리 적어 둔 덕분에 숙소를 잘 걸러 냈다.
            - 바꿀 점: 가격은 자주 바뀌니 "확인 날짜도 함께 적어 줘"를 넣자.
            - 이 지시문을 **"모임 여행 계획 템플릿"**으로 저장했다.

  - type: concept
    sec: 12-4
    title: 평가 기준표
    blocks:
      - p: 프로젝트를 마치면 아래 기준표로 스스로 평가하거나, 강사·동료와 서로 평가해 보세요. 점수보다 **"다시"에 해당하는 칸이 어디인지** 찾는 것이 중요합니다. 그 칸의 단원으로 돌아가 복습하면 됩니다.
      - rubric:
          label: 표 12-3
          caption: 종합 프로젝트 평가 기준표
          widths: [16%, 30%, 30%, 24%]
          head: [기준, ◎ 잘함, ○ 보통, △ 다시 (복습 단원)]
          rows:
            - ["**목표**", 완료 모습이 한 문장으로 분명하다, 목표는 있으나 완료 모습이 흐리다, 막연하다 (9단원)]
            - ["**6문**", "6문이 모두 있고 '하지 말 것'이 구체적이다", 4~5개가 있다, 3개 이하다 (9단원)]
            - ["**권한**", 최소 권한이고 결제·발송을 사람이 한다, 권한이 조금 넓다, "'항상 허용'이 많다 (10단원)"]
            - ["**감독**", 작업 기록을 보고 필요한 때 바로잡았다, 결과만 확인했다, 진행을 보지 않았다 (9단원)]
            - ["**검수**", 숫자·출처를 1차 자료로 확인하고 고쳤다, 일부만 확인했다, 그대로 썼다 (6단원)]
            - ["**회고**", 바꿀 점을 템플릿에 반영해 저장했다, 잘된 점만 적었다, 하지 않았다 (11단원)]
      - concept:
          title: 평가의 목적은 '다음 번'
          body: 프로젝트는 한 번으로 끝나지 않는다. 회고에서 고친 템플릿으로 **다음 번은 더 빠르고 안전하게** 맡길 수 있다.
    side:
      - note:
          kind: tip
          body: 강사용 — 모둠별로 미션을 하나씩 맡아 **발표 + 서로 평가**하면 좋습니다.
      - note:
          kind: warn
          body: 서로 평가할 때도 **실제 개인정보가 담긴 화면은 보여 주지 않습니다.**

  - type: exercises
    title: 12단원을 확인해 봅시다
    blocks:
      - exercises:
          items:
            - no: 1
              level: 1
              kind: short
              q: "프로젝트 6단계의 빈칸을 채우세요. 목표 → (( 심부름 6문 )) → 권한 → (( 실행·감독 )) → 검수 → (( 회고 ))"
              answer: 심부름 6문, 실행·감독, 회고
            - no: 2
              level: 2
              kind: mc
              q: 그림 12-2에서 에이전트가 "숙소 예약까지 진행할까요?"라고 물었습니다. 총무의 대답으로 가장 알맞은 것은?
              choices: ["네, 알아서 해 주세요.", 카드 번호를 알려 줄게요., "아니요, 예약은 제가 직접 할게요.", 아무 대답도 하지 않는다.]
              answer: ③
              explain: 예약·결제는 되돌리기 어렵고 '하지 말 것'에 적어 둔 행동이다. 사람이 직접 한다.
            - no: 3
              level: 2
              kind: ox
              q: 맞으면 O, 틀리면 X에 표시하세요.
              statements:
                - 미션에는 결제·송금처럼 되돌리기 어려운 일을 넣어야 실력이 는다.
                - 검수에서 가격이 원문과 다르면 원문 기준으로 고친다.
                - 회고에서 바꿀 점을 템플릿에 반영해 두면 다음 번이 쉬워진다.
              answer: (ㄱ) X (ㄴ) O (ㄷ) O
            - no: 4
              level: 3
              kind: essay
              q: 내 프로젝트의 회고를 쓰세요. **잘된 점 1가지, 바꿀 점 1가지, 템플릿에 더할 문장 1줄**을 쓰면 됩니다.
              lines: 3
              answer: (예시) 잘된 점 – 확인 시점을 정해 두어 엉뚱한 방향을 일찍 바로잡았다. 바꿀 점 – 출처 날짜를 받지 않았다. 더할 문장 – "모든 숫자 옆에 출처와 확인 날짜를 적어 줘."
              explain: "채점 포인트: 구체적인 사실(무엇이 잘되고 무엇이 부족했는지)을 들었는가, 다음에 쓸 문장으로 바꿨는가"

  - type: summary
    title: 최종 역량 점검표
    blocks:
      - p: 12단원을 모두 마쳤습니다. 단원마다 하나씩, 열두 가지를 스스로 점검해 보세요. **"다시"에 표시한 단원**으로 돌아가 한 번 더 보면, 이 책을 끝까지 내 것으로 만들 수 있습니다.
      - checklist:
          title: 나는 이제 이렇게 할 수 있다
          items:
            - 01 생활 속 AI를 찾고, 규칙형과 학습형 AI의 차이를 말할 수 있다.
            - 02 생성형 AI가 '다음 말 예측'으로 답을 만들고, 그래서 틀릴 수 있음을 설명할 수 있다.
            - 03 대화형 AI를 시작하고, 이어서 묻고, 새 대화를 열 수 있다.
            - 04 4요소(역할·과제·맥락·형식)로 요청하고 고쳐 물을 수 있다.
            - 05 쓰기·요약·번역·사진으로 묻기를 생활과 일에 쓸 수 있다.
            - 06 신호등과 3단계 확인법으로 AI의 답을 확인할 수 있다.
            - 07 개인정보를 가명 처리하고, 딥보이스 사기에 대처할 수 있다.
            - 08 에이전트가 무엇인지 설명하고, 맡길 일을 고를 수 있다.
            - 09 심부름 6문으로 일을 맡기고, 작업 기록을 보며 검수할 수 있다.
            - 10 최소 권한을 정하고, 승인 요청을 판단할 수 있다.
            - 11 맞춤 지침·템플릿·예약 실행으로 나만의 루틴을 만들 수 있다.
            - 12 목표부터 회고까지 프로젝트 전 과정을 스스로 해낼 수 있다.
      - concept:
          label: 마치며
          title: AI는 도구이고, 마지막 판단과 책임은 사람에게 있습니다.
          body: 이 한 문장을 기억하면, 앞으로 어떤 새 AI가 나와도 **잘 묻고, 확인하고, 필요한 만큼만 맡기며** 쓸 수 있습니다.

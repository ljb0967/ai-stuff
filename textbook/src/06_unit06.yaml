unit: 6
part: 3
part_title: AI를 믿을 수 있게 쓰기
title: AI의 답 확인하기
glossary:
  - { term: 교차 확인, en: cross-check, unit: 6, desc: "한 가지 정보를 서로 다른 곳(공식 기관, 다른 자료, 전문가)과 맞춰 보는 것." }
  - { term: 출처, en: source, unit: 6, desc: "정보가 나온 곳. 기관 이름, 문서 제목, 날짜, 링크 등." }
  - { term: 1차 자료, en: primary source, unit: 6, desc: "기관이 직접 낸 원래 문서(법령 원문, 공식 통계, 공식 홈페이지 공지 등)." }
pages:
  - type: divider
    part: 3
    title: AI를 믿을 수 있게 쓰기
    subtitle: AI의 답을 확인하고, 개인정보·사기·저작권 위험을 피합니다.
    units: [[6, AI의 답 확인하기], [7, 안전하고 바르게 쓰기]]

  - type: opener
    subtitle: 그럴듯한 답과 사실인 답을 가려내는 법
    goals:
      - 환각이 실제로 어떤 문제를 일으켰는지 **사례로 설명할 수 있다.**
      - 질문의 위험도에 따라 **확인 수준(신호등)**을 정할 수 있다.
      - "**3단계 확인법**으로 AI의 답을 검증할 수 있다."
    why: |
      2단원에서 AI는 **"그럴듯한" 말을 고른다**고 배웠습니다. 그렇다면 어떤 답을 그냥 쓰고, 어떤 답을 확인해야 할까요? 이 단원은 4부에서 **에이전트의 결과물을 검수**할 때 그대로 쓰는 기술입니다.
    hook:
      q: AI에게 "방금 알려 준 내용 진짜 맞아?"라고 다시 물으면, 확인이 될까요?
      figure:
        kind: chat
        input: null
        messages:
          - { who: user, text: "방금 알려 준 판례, 진짜 있는 거 맞아?" }
          - { who: ai, text: "네, 실제 판례이며 법률 데이터베이스에서 찾으실 수 있습니다." }
          - { who: note, text: "↑ 2023년 미국에서 실제로 있었던 대화를 간추린 것입니다. 이 판례는 존재하지 않았습니다." }
    keywords: [환각 사례, 출처, 1차 자료, 위험도 신호등, 3단계 확인법, 교차 확인]
    map: [실제 사건, 잘 틀리는 것, 위험도 신호등, 3단계 확인법]

  - type: concept
    sec: 06-1
    title: "실제 사건: 존재하지 않는 판례"
    blocks:
      - p: 2023년 미국 뉴욕의 한 소송에서, 변호사가 대화형 AI(ChatGPT)가 알려 준 판례 여러 건을 법원에 낸 서면에 인용했습니다. 그런데 상대방 변호사도, 판사도 그 판례를 찾을 수 없었습니다. **모두 AI가 지어낸, 존재하지 않는 판례**였습니다.
      - figure:
          kind: timeline
          label: 그림 6-1
          caption: "Mata v. Avianca 사건(미국 뉴욕 남부연방지방법원, 2023)의 흐름"
          events:
            - { date: 2023년 3월, text: 변호사가 AI로 찾은 판례를 인용한 서면 제출 }
            - { date: 3~4월, text: 상대방과 법원이 판례를 찾지 못함 }
            - { date: 5월, text: 변호사가 AI를 썼다고 인정. AI에게 물었을 때 "진짜"라고 답했다고 진술, hl: true }
            - { date: 6월 22일, text: "법원이 변호사 2명과 법률사무소에 5,000달러 제재" }
      - p: 변호사는 AI에게 "이 판례가 진짜냐"고 다시 물었고, AI는 **"실제 판례이며 법률 데이터베이스에서 찾을 수 있다"**고 답했다고 합니다. 원문을 한 번만 찾아봤어도 막을 수 있었던 일입니다.
      - concept:
          title: AI에게 "맞아?"라고 묻는 것은 확인이 아니다
          body: 틀린 답을 만든 같은 원리로 "맞다"는 답도 만든다. 확인은 **AI 밖에서, 원래 문서(1차 자료)를 직접 보는 것**이다.
    side:
      - note:
          kind: fact
          body: 이 사건은 AI 환각의 위험을 보여 주는 대표 사례로 전 세계 법조계에 알려졌습니다.
      - note:
          kind: term
          title: 1차 자료
          body: 기관이 직접 낸 원래 문서. 법령 원문, 공식 통계, 공식 홈페이지 공지 등.

  - type: concept
    sec: 06-2
    title: AI가 특히 잘 틀리는 것
    blocks:
      - p: AI의 답 전체를 매번 의심할 필요는 없습니다. 하지만 아래 여섯 가지가 들어 있으면 **그 부분만큼은 반드시 확인**하세요. 공통점은 "그럴듯하게 지어내기 쉽고, 틀리면 피해가 큰" 정보라는 것입니다.
      - figure:
          kind: cards
          label: 그림 6-2
          caption: AI의 답에서 반드시 확인할 여섯 가지
          cols: 3
          items:
            - { key: "123", title: 숫자, desc: "통계, 금액, 비율, 날짜" }
            - { key: "👤", title: 사람·기관 이름, desc: "직함, 소속, 기관명(이름이 바뀐 기관 포함)" }
            - { key: "“ ”", title: 인용·출처, desc: "논문, 기사, 책, 판례, 누가 한 말" }
            - { key: "🆕", title: 최신 소식, desc: "지식 시점 이후의 일, 바뀐 제도" }
            - { key: "📍", title: 지역 정보, desc: "영업시간, 주소, 전화번호" }
            - { key: "⚖", title: 법·제도 세부, desc: "조항 번호, 신청 자격, 마감일" }
      - concept:
          title: 확인할 곳을 좁히면 확인이 쉬워진다
          body: AI의 답을 읽으며 **숫자·이름·출처·날짜에 밑줄**을 긋는다. 밑줄 친 부분만 확인하면 된다.
    side:
      - note:
          kind: tip
          body: '답을 받은 뒤 "이 답에서 확인이 필요한 사실을 목록으로 뽑아 줘"라고 하면, 밑줄 칠 곳을 AI가 먼저 정리해 줍니다. 확인 자체는 내가 합니다.'
      - note:
          kind: warn
          body: 기관 이름도 바뀝니다. 예를 들어 통계청은 2025년 10월 **국가데이터처**가 되었습니다.

  - type: concept
    sec: 06-3
    title: 위험도 신호등 — 얼마나 확인할까?
    blocks:
      - p: 모든 답을 똑같이 확인하면 지칩니다. **틀렸을 때 생기는 피해**를 기준으로 확인 수준을 정하세요. 생일 축하 문구가 조금 어색한 것과 약 복용법이 틀린 것은 무게가 다릅니다.
      - table:
          label: 표 6-1
          caption: 위험도 신호등과 확인 수준
          widths: [18%, 26%, 28%, 28%]
          head: ['신호', '틀리면?', '확인 수준', '예']
          rows:
            - ["[g] **초록**", 피해가 거의 없음, 그대로 써도 됨, "축하 문구, 요리 아이디어, 글 다듬기"]
            - ["[y] **노랑**", 불편하거나 창피함, 핵심 사실 1~2개 확인, "영업시간, 행사 날짜, 단체방 공지 내용"]
            - ["[r] **빨강**", 건강·돈·법·안전 피해, 공식 출처 + 전문가 확인 필수, "약 복용, 계약, 세금, 투자, 법적 절차"]
      - concept:
          title: 확인의 양은 '피해의 크기'로 정한다
          body: "**빨강**은 AI의 답을 출발점으로만 쓰고, 결정은 반드시 공식 출처와 전문가 확인을 거친다."
      - info:
          title: 4부와의 연결
          body: 에이전트에게 일을 맡길 때도 같은 신호등을 씁니다. 빨강에 해당하는 일은 에이전트가 **스스로 끝내지 못하게** 확인 지점을 둡니다. (8~10단원)
    side:
      - note:
          kind: tip
          body: 색이 헷갈리면 이렇게 물어보세요. **"이게 틀리면 누가, 얼마나 손해를 보나?"**

  - type: concept
    sec: 06-4
    title: 3단계 확인법
    blocks:
      - p: 노랑·빨강 정보는 다음 세 단계로 확인합니다. 순서대로 하면 대부분의 환각을 걸러 낼 수 있습니다.
      - figure:
          kind: flow
          dir: v
          label: 그림 6-3
          caption: 3단계 확인법
          steps:
            - { no: "1", title: 출처를 달라고 한다, desc: '"이 내용의 근거가 된 자료 이름과 링크를 알려 줘." 검색 기능이 있는 서비스가 유리하다.' }
            - { no: "2", title: 원문을 직접 연다, desc: "링크가 열리는지, 그 문서에 정말 그 내용이 있는지 내 눈으로 본다. 없는 링크·엉뚱한 내용이면 환각이다." }
            - { no: "3", title: 다른 곳과 맞춰 본다 (교차 확인), desc: "공식 홈페이지·기관, 다른 검색 결과, 전문가와 비교한다.", hl: true }
      - tip:
          title: 다른 AI에게 물어보는 것은 '실마리 찾기'까지만
          body: 다른 AI의 답과 비교하면 이상한 점을 찾는 데 도움이 됩니다. 하지만 **최종 확인은 원문과 공식 출처**로 합니다. AI끼리 같은 실수를 할 수 있기 때문입니다.
      - concept:
          title: 출처 요청 → 원문 확인 → 교차 확인
          body: 링크가 있다고 끝이 아니다. **열어 보고, 읽어 보고, 맞춰 본다.**
    side:
      - note:
          kind: term
          title: 교차 확인
          body: 같은 정보를 서로 다른 곳과 맞춰 보는 것.
      - note:
          kind: tip
          body: 질문할 때 미리 **"확실하지 않은 부분은 모른다고 말해 줘"**라고 덧붙이면 지어내는 일이 줄어듭니다. 완전히 막지는 못합니다.

  - type: example
    title: 확인하는 습관 들이기
    blocks:
      - example:
          no: 1
          title: 통계 숫자 확인하기
          level: 2
          q: |
            최민호 씨가 자기소개서에 쓰려고 AI에게 청년 고용 통계를 물었더니 **"2025년 청년 고용률은 46.1%입니다"**라는 답을 받았습니다. (이 숫자는 설명을 위한 **가상의 예**입니다.) 3단계 확인법으로 확인하는 과정을 쓰세요.
          steps:
            - '**출처 요청**: "이 숫자의 출처(기관, 자료 이름, 발표 날짜, 링크)를 알려 줘."'
            - "**원문 확인**: 알려 준 링크를 직접 열어 같은 숫자와 기준(연령 범위, 연도)이 있는지 봅니다."
            - "**교차 확인**: 국가통계포털(KOSIS) 같은 공식 통계 사이트에서 같은 항목을 찾아 비교합니다."
          answer: 출처 요청 → 원문 확인 → 공식 통계 사이트와 교차 확인
          memo: 숫자가 맞아도 **기준(몇 세부터 몇 세까지, 어느 달 기준)**이 다르면 다른 통계입니다.
      - example:
          no: 2
          title: 신호등 색 정하기
          level: 1
          q: 다음 질문의 신호등 색을 정하세요. (가) 손주 돌잔치 축하 문구 (나) 다음 주 동네 문화센터 강좌 시간 (다) 감기약과 혈압약을 같이 먹어도 되는지
          steps:
            - (가) 조금 어색해도 피해가 없습니다. → 초록
            - (나) 틀리면 헛걸음합니다. 시간만 확인하면 됩니다. → 노랑
            - (다) 건강에 직접 영향을 줍니다. → 빨강, 약사·의사 확인 필수
          answer: (가) 초록 (나) 노랑 (다) 빨강
      - similar:
          no: 1
          level: 2
          q: 김정숙 님이 AI에게 "이 약과 자몽주스를 같이 먹어도 돼?"라고 물었더니 "괜찮습니다"라는 답을 받았습니다. 신호등 색과 해야 할 일을 쓰세요.
          lines: 1
          answer: 빨강. 약사나 의사에게 직접 확인한다.
          explain: 자몽주스는 일부 약의 효과에 영향을 줄 수 있다고 알려져 있다. 약에 관한 질문은 AI 답과 관계없이 전문가에게 확인한다.

  - type: exercises
    title: 6단원을 확인해 봅시다
    blocks:
      - exercises:
          items:
            - no: 1
              level: 1
              kind: ox
              q: 맞으면 O, 틀리면 X에 표시하세요.
              statements:
                - AI에게 "방금 답이 맞아?"라고 다시 물어 "맞다"고 하면 확인이 끝난 것이다.
                - AI가 링크를 알려 주면 직접 열어서 내용을 확인해야 한다.
                - 생일 축하 문구처럼 틀려도 피해가 없는 내용은 그대로 써도 된다.
              answer: (ㄱ) X (ㄴ) O (ㄷ) O
              explain: AI는 틀린 답에도 "맞다"고 할 수 있다. 확인은 AI 밖의 원문으로 한다.
            - no: 2
              level: 1
              kind: short
              q: "3단계 확인법의 순서를 쓰세요. (( 출처 요청 )) → (( 원문 확인 )) → (( 교차 확인 ))"
              answer: 출처 요청 → 원문 확인 → 교차 확인
            - no: 3
              level: 2
              kind: mc
              q: 다음 AI의 답에서 **가장 먼저 확인해야 할 부분**은? "○○시 노인 일자리 사업은 만 65세 이상이 신청할 수 있고, 올해 접수는 3월 15일까지입니다. 많은 분이 보람을 느낀다고 합니다."
              cols: 2
              choices: [신청 자격(만 65세)과 마감일(3월 15일), 보람을 느낀다는 부분, 문장의 말투, 띄어쓰기]
              answer: ①
              explain: 신청 자격과 마감일은 법·제도 세부이자 날짜다. 틀리면 신청 기회를 놓칠 수 있다.
            - no: 4
              level: 2
              kind: match
              q: 질문과 신호등 색을 이으세요.
              pairs: [[송년회 건배사 아이디어, 빨강], [동네 병원 토요일 진료 시간, 초록], [전세 계약서 특약 문구, 노랑]]
              answer: "ㄱ-② 초록, ㄴ-③ 노랑, ㄷ-① 빨강"
            - no: 5
              level: 3
              kind: essay
              q: 최근에 AI(또는 인터넷)에서 받은 정보 하나를 골라, 신호등 색을 정하고 3단계 확인법으로 확인할 계획을 쓰세요.
              lines: 2
              answer: (예시) 기초연금 신청 자격 – 빨강. 출처 요청 → 보건복지부 누리집 원문 확인 → 주민센터에 전화로 교차 확인
              explain: "채점 포인트: 위험도에 맞는 색을 골랐는가, 1차 자료(공식 기관)를 확인 경로에 넣었는가"

  - type: summary
    title: 6단원 정리
    blocks:
      - summary:
          items:
            - 2023년 미국에서 변호사가 AI가 지어낸 **존재하지 않는 판례**를 인용해 제재를 받았다. AI에게 "맞아?"라고 묻는 것은 **확인이 아니다.**
            - "**숫자 · 이름 · 인용·출처 · 최신 소식 · 지역 정보 · 법·제도 세부**는 반드시 확인한다."
            - 확인의 양은 **위험도 신호등**(초록·노랑·빨강)으로 정한다. 빨강은 공식 출처와 전문가 확인이 필수다.
            - "**3단계 확인법**: 출처를 달라고 한다 → 원문을 직접 연다 → 다른 곳과 맞춰 본다."
      - myth:
          items:
            - { myth: 링크가 붙어 있으면 믿을 만하다., truth: 없는 링크나 엉뚱한 문서일 수 있다. 열어서 내용을 봐야 한다. }
            - { myth: 두 AI가 같은 답을 하면 사실이다., truth: AI끼리 같은 실수를 할 수 있다. 최종 확인은 원문과 공식 출처로 한다. }
      - checklist:
          items:
            - 환각으로 실제 피해가 생긴 사례를 설명할 수 있다.
            - 질문을 초록·노랑·빨강으로 나눌 수 있다.
            - 3단계 확인법으로 AI의 답을 확인해 보았다.

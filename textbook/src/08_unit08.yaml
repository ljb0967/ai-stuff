unit: 8
part: 4
part_title: AI에게 일 맡기기
title: 챗봇에서 에이전트로
glossary:
  - { term: 에이전트, en: AI agent, unit: 8, desc: "목표를 받으면 스스로 계획을 세우고, 도구를 써서 실행하고, 결과를 확인하며 여러 단계를 이어 가는 AI." }
  - { term: 에이전트 루프, en: agent loop, unit: 8, desc: "목표 이해 → 계획 → 실행 → 확인을 목표를 이룰 때까지 되풀이하는 에이전트의 일하는 방식." }
  - { term: 도구, en: tool, unit: 8, desc: "에이전트가 쓸 수 있는 기능. 웹 검색, 웹사이트 조작, 파일 읽기·만들기, 앱 연결 등." }
  - { term: 확인 지점, en: checkpoint, unit: 8, desc: "에이전트가 중요한 행동 전에 멈추고 사람의 승인을 받는 순간." }
pages:
  - type: divider
    part: 4
    title: AI에게 일 맡기기
    subtitle: 에이전트에게 일을 맡기고, 권한을 정하고, 감독·검수하는 루틴을 만듭니다.
    units: [[8, 챗봇에서 에이전트로], [9, "일 맡기는 글: 심부름 6문"], [10, 도구 연결과 권한 관리], [11, 나만의 AI 작업 루틴], [12, 종합 프로젝트]]

  - type: opener
    subtitle: 묻고 답하는 AI에서, 일을 해 주는 AI로
    goals:
      - 챗봇과 에이전트의 차이를 **"누가 다음 행동을 정하는가"**로 설명할 수 있다.
      - "**에이전트 루프**(목표 이해 → 계획 → 실행 → 확인)를 그림으로 설명할 수 있다."
      - 에이전트에게 **맡기기 좋은 일과 맡기면 안 되는 일**을 구별할 수 있다.
    why: |
      지금까지는 AI가 **답을 주면 사람이 옮겨 적고 실행**했습니다. 에이전트는 그 실행까지 맡습니다. 그만큼 편해지고, 그만큼 **맡기는 사람의 판단**이 중요해집니다.
    hook:
      q: 같은 부탁, 다른 결과. 무엇이 다를까요?
      figure:
        kind: compare
        left:
          title: "💬 대화형 AI (챗봇)"
          body: |
            "부산 1박 2일 숙소 추천해 줘" → 숙소 이름 5개를 **글로** 알려 준다.
            → 가격 확인, 비교, 정리는 **내가** 한다.
          verdict: 한 번 묻고 한 번 답한다
        right:
          title: "🤖 에이전트"
          body: |
            "부산 1박 2일 숙소 후보 3곳을 비교표로" → **스스로 검색하고**, 사이트를 열어 가격을 모으고, 표를 만든다.
            → 예약 직전에 **나에게 묻는다.**
          verdict: 목표까지 여러 단계를 스스로 이어 간다
    keywords: [에이전트, 에이전트 루프, 도구, 확인 지점, 위임, 되돌릴 수 있는가]
    map: [에이전트란, 발전 단계, 에이전트 루프, 도구, 맡길 일 고르기, 서비스 고르기]

  - type: concept
    sec: 08-1
    title: 에이전트란 무엇일까?
    blocks:
      - p: 에이전트(agent)는 **"대리인"**이라는 뜻입니다. AI 에이전트는 내가 준 **목표**를 이루기 위해 스스로 계획을 세우고, 검색·웹사이트·파일 같은 **도구를 써서 실행**하고, 결과를 확인하며 여러 단계를 이어 가는 AI입니다.
      - table:
          label: 표 8-1
          caption: 대화형 AI(챗봇)와 에이전트 비교
          widths: [24%, 38%, 38%]
          head: [구분, 대화형 AI (챗봇), 에이전트]
          rows:
            - ["**내가 주는 것**", 질문 하나, 이루고 싶은 목표]
            - ["**다음 행동은 누가?**", "**사람**이 정한다", "**AI가 스스로** 정한다"]
            - ["**실행**", 사람이 옮겨 적고 직접 한다, 검색·클릭·파일 작업을 AI가 한다]
            - ["**걸리는 시간**", 몇 초, "몇 분~몇십 분 (그동안 다른 일 가능)"]
            - ["**사람의 역할**", 질문하고 읽기, "목표 주기 · 중간 승인 · 결과 검수"]
      - concept:
          title: 핵심 차이는 "누가 다음 행동을 정하는가"
          body: 챗봇은 한 번 답하고 멈춘다. 에이전트는 목표를 이룰 때까지 **다음에 할 일을 스스로 정하며** 일을 이어 간다. 그래서 사람은 **목표·범위·확인 지점**을 정해 주어야 한다.
    side:
      - note:
          kind: term
          title: 에이전트 (agent)
          body: 대리인. 목표를 받아 계획·실행·확인을 스스로 이어 가는 AI.
      - note:
          kind: fact
          body: AI 회사들은 에이전트를 "언어 모델 + 도구 + 지시"로 설명합니다. 이 책에서는 이것을 **"똑똑한 두뇌 + 손발 + 일하는 규칙"**으로 바꿔 부릅니다.

  - type: concept
    sec: 08-2
    title: AI가 일하는 방식의 다섯 단계
    blocks:
      - p: AI가 사람 대신 할 수 있는 일은 단계적으로 넓어져 왔습니다. 계단 그림에서 **오른쪽으로 갈수록 AI가 스스로 하는 일이 많아지고**, 사람은 직접 하는 일 대신 **맡기고 감독하는 일**을 하게 됩니다.
      - figure:
          kind: stairs
          label: 그림 8-1
          caption: AI가 일하는 방식의 다섯 단계 (이 책의 4부는 3~4단계를 다룬다)
          highlight: 3
          steps:
            - { title: 규칙형 자동 응답, desc: "정해진 메뉴만 (ARS)" }
            - { title: 대화형 AI, desc: "묻고 답하기 (2부)" }
            - { title: 도구를 쓰는 AI, desc: "검색·파일을 참고해 답하기" }
            - { title: 에이전트, desc: "목표를 받아 여러 단계를 스스로 실행" }
            - { title: 정기 실행 에이전트, desc: "정한 때마다 스스로 일하고 보고 (11단원)" }
      - p: 단계가 높다고 늘 좋은 것은 아닙니다. 간단한 질문은 대화형 AI로 충분하고, **틀리면 큰일 나는 일**은 단계가 높을수록 더 꼼꼼히 감독해야 합니다.
      - concept:
          title: 가장 단순한 방법부터
          body: 일을 맡길 때는 **필요한 만큼만 높은 단계**를 쓴다. 대화형 AI로 되는 일을 굳이 에이전트에게 맡기지 않는다.
    side:
      - note:
          kind: fact
          body: '에이전트를 만드는 회사들도 "가장 단순한 방법부터 시작하고, 필요할 때만 복잡하게 하라"고 권합니다.'
      - note:
          kind: tip
          body: 2단계(도구를 쓰는 AI)는 이미 많은 대화형 AI에 들어 있습니다. 답 아래 **출처 링크**가 보이면 검색 도구를 쓴 것입니다.

  - type: concept
    sec: 08-3
    title: 에이전트 루프 — 에이전트가 일하는 순서
    blocks:
      - p: 에이전트는 네 단계를 **목표를 이룰 때까지 되풀이**합니다. 목표를 이해하고, 할 일 목록을 짜고, 도구로 실행하고, 결과가 목표에 맞는지 확인합니다. 모자라면 ①로 돌아가 목표와 비교하고, 계획을 고쳐 루프를 한 번 더 돕니다.
      - figure:
          kind: cycle
          label: 그림 8-2
          caption: 에이전트 루프. 중요한 행동 앞에서는 사람에게 확인받는다.
          center: "목표를 이룰 때까지\n반복"
          human: 👤 확인 지점 = 사람 승인
          steps:
            - { title: 목표 이해, desc: 무엇을 끝내야 하나 }
            - { title: 계획 세우기, desc: 할 일 목록 짜기 }
            - { title: 도구로 실행, desc: 검색·클릭·파일 }
            - { title: 결과 확인, desc: "목표에 맞나?" }
      - p: '예를 들어 "부산 숙소 후보 3곳 비교표"를 맡겼다고 합시다. 에이전트는 ① 조건을 정리하고 ② "숙소 검색 → 가격 확인 → 표 만들기" 계획을 세웁니다. 그다음 ③ 여러 사이트를 열어 정보를 모으고 ④ 빈칸이 있으면 다시 찾습니다.'
      - concept:
          title: 사람은 루프 바깥에서 '확인 지점'을 지킨다
          body: 에이전트가 스스로 돌더라도, **결제·발송·삭제 같은 중요한 행동** 앞에서는 멈추고 사람에게 묻게 한다.
    side:
      - note:
          kind: term
          title: 확인 지점
          body: 에이전트가 중요한 행동 전에 멈추고 사람의 승인을 받는 순간.
      - note:
          kind: tip
          body: 4단원의 **'단계 나누기'**가 기억나나요? 에이전트는 그 일을 스스로 합니다.

  - type: concept
    sec: 08-4
    title: 에이전트의 손발, 도구
    blocks:
      - p: 에이전트가 실제로 일을 할 수 있는 것은 **도구** 덕분입니다. 어떤 도구를 쓸 수 있는지에 따라 에이전트가 할 수 있는 일이 정해집니다. 서비스마다 갖춘 도구가 다릅니다.
      - figure:
          kind: cards
          label: 그림 8-3
          caption: 에이전트가 쓰는 대표 도구
          cols: 3
          items:
            - { key: "🔍", title: 웹 검색, desc: 최신 정보를 찾아 읽는다 }
            - { key: "🖱", title: 웹사이트 조작, desc: "사이트를 열고, 누르고, 칸을 채운다" }
            - { key: "📄", title: 파일 읽기·만들기, desc: "문서·표·발표 자료를 읽고 만든다" }
            - { key: "📅", title: 앱 연결, desc: "메일·일정·저장 공간과 연결 (10단원)" }
            - { key: "🧮", title: 계산·정리, desc: 복잡한 계산과 표 정리를 대신한다 }
            - { key: "🗂", title: 기억·작업 공간, desc: "자료와 지침을 모아 두고 쓴다 (11단원)" }
      - concept:
          label: 비유
          title: 에이전트는 '유능한 신입 비서'
          body: |
            빠르고 성실하지만, **우리 집·회사 사정을 모르고**, 가끔 **확신에 차서 실수**한다.
            그래서 ① 맡길 때 **배경과 완료 조건**을 알려 주고 ② 중요한 결정 전에는 **보고받고** ③ 끝나면 **검수**한다.
    side:
      - note:
          kind: term
          title: 도구 (tool)
          body: 에이전트가 쓸 수 있는 기능. 도구가 곧 할 수 있는 일의 범위다.
      - note:
          kind: warn
          body: 도구가 많을수록 할 수 있는 실수도 많아집니다. **필요한 도구만** 켜는 것이 안전합니다. (10단원)

  - type: concept
    sec: 08-5
    title: 무엇을 맡기고, 무엇을 직접 할까?
    blocks:
      - p: 맡길지 말지는 두 가지 질문으로 정합니다. **"맡기면 시간을 많이 아끼나?"** 그리고 **"AI가 실수하면 되돌릴 수 있나?"** 되돌리기 어렵거나 피해가 큰 일은 시간을 아끼더라도 사람이 확인해야 합니다.
      - figure:
          kind: matrix
          label: 그림 8-4
          caption: 위임 판단표. 오른쪽(되돌리기 어려움)으로 갈수록 사람의 확인이 많아진다.
          ylabel: 맡기면 아끼는 시간
          xlabel: AI가 실수하면?
          y: [많다, 적다]
          x: [되돌리기 쉽다, 되돌리기 어렵다·피해가 크다]
          cells:
            - - { tone: good, title: ✅ 적극 맡기기, desc: "자료 조사·정리, 초안 작성, 사진·파일 정리(복사본으로)" }
              - { tone: care, title: "⚠ 확인 지점 두고 맡기기", desc: "단체 메일은 초안까지만, 예약은 후보 비교까지만" }
            - - { tone: mid, title: 직접 또는 대화형 AI, desc: "문자 초안 한 통 쓰기, 간단한 질문" }
              - { tone: human, title: ✋ 사람이 직접, desc: "송금·결제, 계약 서명, 의료 결정, 개인정보 제출" }
      - concept:
          title: 핵심은 "되돌릴 수 있는가"
          body: 초안은 고치면 되지만, **보낸 메일·결제한 돈·지운 파일은 되돌리기 어렵다.** 되돌리기 어려운 행동은 반드시 사람이 마지막 버튼을 누른다.
    side:
      - note:
          kind: tip
          body: 6단원의 **신호등**과 함께 쓰세요. 빨강에 해당하는 일은 오른쪽 칸입니다.
      - note:
          kind: tip
          body: '"정리해 줘" 대신 **"복사본을 만들어 정리해 줘"**라고 하면 되돌리기 쉬운 일이 됩니다.'

  - type: concept
    sec: 08-6
    title: 에이전트 서비스 고르기
    blocks:
      - p: 에이전트 기능은 여러 회사가 경쟁적으로 내놓고 있고, 이름과 요금이 자주 바뀝니다. 서비스 이름보다 **아래 다섯 가지를 직접 확인**하고 고르세요. (2026년 11월 기준 현황은 부록에 있습니다.)
      - table:
          label: 표 8-2
          caption: 에이전트 서비스 고르는 다섯 가지 기준
          widths: [26%, 74%]
          head: [기준, 확인할 것]
          rows:
            - ["**① 할 수 있는 일**", "웹 검색, 웹사이트 조작, 파일 만들기, 앱 연결 중 **내가 맡길 일에 필요한 도구**가 있는가"]
            - ["**② 확인 절차**", "결제·발송 같은 중요한 행동 전에 **묻는가**, 진행 중 **멈추기** 버튼이 있는가"]
            - ["**③ 권한 관리**", "연결할 서비스와 권한 범위를 **고를 수 있고**, 쉽게 **연결 해제**할 수 있는가"]
            - ["**④ 비용·사용량**", "에이전트 작업은 사용량이 많다. 무료·유료 **한도**와 넘었을 때 요금은?"]
            - ["**⑤ 개인정보·보안**", "학습 사용 설정, 작업 기록 삭제, 2단계 인증을 지원하는가"]
      - tip:
          title: 유료 기능이 없어도 연습할 수 있어요.
          body: 대화형 AI에게 "계획을 먼저 세우고, 단계마다 결과를 보여 주며 진행해 줘"라고 하면 **에이전트의 일하는 방식**을 대화로 연습할 수 있습니다. 9단원의 '심부름 6문'은 어떤 AI에서나 쓸 수 있습니다.
    side:
      - note:
          kind: warn
          body: '"모든 걸 알아서 다 해 준다"는 광고는 조심하세요. 좋은 에이전트일수록 **중요한 순간에 묻습니다.**'

  - type: example
    title: 맡길 일 고르기
    blocks:
      - example:
          no: 1
          title: 챗봇과 에이전트, 무엇이 다를까
          level: 2
          q: 최민호 씨가 "관심 기업 5곳의 최근 채용 공고를 정리해 줘"라고 요청했습니다. 대화형 AI(검색 없음)와 에이전트는 각각 어떻게 처리할지 비교하고, 최민호 씨가 해야 할 일을 쓰세요.
          steps:
            - "**대화형 AI**: 배운 지식으로 답합니다. 지식 시점 이후의 공고는 모르거나 지어낼 수 있습니다."
            - "**에이전트**: 기업별로 채용 사이트를 검색해 열고, 공고 내용을 모아 표로 만듭니다."
            - "**최민호 씨가 할 일**: 표에 적힌 마감일·자격 요건을 공고 원문 링크로 확인합니다. (6단원 3단계 확인법)"
          answer: 대화형 AI는 아는 만큼 답하고, 에이전트는 직접 찾아 정리한다. 어느 쪽이든 마감일·자격은 원문으로 확인한다.
      - example:
          no: 2
          title: 위임 판단표에 배치하기
          level: 2
          q: "박영호 사장님의 일을 그림 8-4에 배치하세요. (가) 지난 1년 매출 파일을 월별 표로 정리 (나) 단골 300명에게 이벤트 문자 발송 (다) 밀가루 거래처에 대금 송금"
          steps:
            - (가) 시간을 많이 아끼고, 원본을 두고 복사본으로 하면 되돌리기 쉽다. → 적극 맡기기
            - (나) 시간을 아끼지만 한번 보내면 되돌릴 수 없다. → 초안까지만 맡기고 발송은 직접
            - (다) 돈이 오가고 되돌리기 어렵다. → 사람이 직접
          answer: (가) 적극 맡기기 (나) 확인 지점 두고 맡기기 (다) 사람이 직접
      - similar:
          no: 1
          level: 1
          q: 김정숙 님의 일 중 에이전트에게 **적극 맡기기 좋은 일**을 고르세요.
          choices: [독서 모임 회비를 회원 계좌로 돌려주기, 다음 모임 책 후보 5권의 줄거리와 분량 비교표 만들기, 회원들의 주민등록번호 모으기, 병원 예약 취소하기]
          answer: ②
          explain: 비교표 만들기는 시간을 아끼고 틀려도 고치면 된다. 송금·개인정보 수집·예약 취소는 되돌리기 어렵거나 피해가 크다.

  - type: exercises
    title: 8단원을 확인해 봅시다
    blocks:
      - exercises:
          items:
            - no: 1
              level: 1
              kind: ox
              q: 맞으면 O, 틀리면 X에 표시하세요.
              statements:
                - 에이전트는 목표를 받으면 다음에 할 일을 스스로 정하며 여러 단계를 진행한다.
                - 에이전트에게 맡기면 결과를 확인할 필요가 없다.
                - 결제·발송·삭제 같은 행동 앞에는 확인 지점을 두는 것이 좋다.
              answer: (ㄱ) O (ㄴ) X (ㄷ) O
            - no: 2
              level: 1
              kind: short
              q: "에이전트 루프의 빈칸을 채우세요. 목표 이해 → (( 계획 세우기 )) → 도구로 실행 → (( 결과 확인 ))"
              answer: 계획 세우기, 결과 확인
            - no: 3
              level: 2
              kind: mc
              q: 그림 8-4에서 **사람이 직접** 해야 하는 칸에 들어갈 일은?
              cols: 2
              choices: [여행지 후보 비교표 만들기, 회의 녹음 요약하기, 인터넷 쇼핑 결제하기, 사진 폴더 정리(복사본으로)]
              answer: ③
              explain: 결제는 되돌리기 어렵고 돈과 관련된 일이다.
            - no: 4
              level: 2
              kind: match
              q: 에이전트의 도구와 할 수 있는 일을 이으세요.
              pairs: [[웹 검색, 메일·일정 읽기], [웹사이트 조작, 최신 정보 찾기], [앱 연결, 사이트 칸 채우기]]
              answer: "ㄱ-② 최신 정보 찾기, ㄴ-③ 사이트 칸 채우기, ㄷ-① 메일·일정 읽기"
            - no: 5
              level: 3
              kind: essay
              q: 내 생활이나 일에서 에이전트에게 맡기고 싶은 일을 하나 쓰고, 그림 8-4의 어느 칸에 해당하는지와 그 이유를 쓰세요.
              lines: 2
              answer: (예시) 동네 병원 3곳의 토요일 진료 시간 비교 – 적극 맡기기. 시간을 아끼고, 틀려도 전화로 확인하면 된다.
              explain: "채점 포인트: '아끼는 시간'과 '되돌릴 수 있는가' 두 기준으로 설명했는가"

  - type: summary
    title: 8단원 정리
    blocks:
      - summary:
          items:
            - "**에이전트**는 목표를 받아 스스로 계획하고, 도구로 실행하고, 결과를 확인하며 일을 이어 가는 AI다. 핵심 차이는 **누가 다음 행동을 정하는가**다."
            - "**에이전트 루프**: 목표 이해 → 계획 → 실행 → 확인을 반복한다. 사람은 **확인 지점**에서 승인한다."
            - 에이전트의 능력은 **도구**(검색·웹사이트 조작·파일·앱 연결 등)에 달려 있다. 에이전트는 '유능한 신입 비서'처럼 다룬다.
            - 맡길지는 **아끼는 시간**과 **되돌릴 수 있는가**로 판단한다. 송금·계약·의료 결정은 사람이 직접 한다.
      - myth:
          items:
            - { myth: 에이전트에게 맡기면 알아서 다 해 준다., truth: 목표·범위·확인 지점을 사람이 정하고 결과를 검수해야 한다. }
            - { myth: 단계가 높은 AI일수록 무조건 좋다., truth: 필요한 만큼만 쓴다. 간단한 일은 대화형 AI로 충분하다. }
      - checklist:
          items:
            - 챗봇과 에이전트의 차이를 설명할 수 있다.
            - 에이전트 루프를 그림으로 그릴 수 있다.
            - 위임 판단표로 내 일을 나눌 수 있다.

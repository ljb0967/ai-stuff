unit: 2
part: 1
part_title: AI와 친해지기
title: 생성형 AI는 어떻게 말을 만들까
glossary:
  - { term: 대규모 언어 모델(LLM), en: Large Language Model, unit: 2, desc: "엄청난 양의 글을 읽고 어떤 말 다음에 어떤 말이 오는지 패턴을 배운 프로그램. 대화형 AI의 '두뇌'." }
  - { term: 토큰, en: token, unit: 2, desc: "AI가 글을 나누어 처리하는 작은 조각. 한국어는 대략 글자 1~2개가 1토큰. 이용량을 토큰으로 세기도 한다." }
  - { term: 환각, en: hallucination, unit: 2, desc: "AI가 그럴듯하지만 사실이 아닌 내용을 자신 있게 말하는 현상." }
  - { term: 지식 시점, en: knowledge cutoff, unit: 2, desc: "AI가 학습한 자료의 마지막 시점. 그 뒤의 일은 모르거나 틀릴 수 있다." }
  - { term: 맥락 창, en: context window, unit: 2, desc: "AI가 한 대화에서 한 번에 볼 수 있는 글의 양. 넘치면 앞부분을 놓칠 수 있다." }
pages:
  - type: opener
    subtitle: 그럴듯한 다음 말을 고르는 기계, 그래서 생기는 장점과 한계
    goals:
      - 생성형 AI가 **"다음에 올 말을 예측"**해 문장을 만든다는 것을 설명할 수 있다.
      - 같은 질문에도 답이 **매번 조금씩 다른 이유**를 말할 수 있다.
      - 생성형 AI의 **한계 세 가지**(환각, 지식 시점, 대화 기억 한계)를 예를 들어 설명할 수 있다.
    why: |
      AI가 어떻게 답을 만드는지 알면, **언제 믿고 언제 확인해야 하는지**가 저절로 보입니다. 원리를 아는 사람이 도구를 가장 안전하게 씁니다.
    hook:
      q: "다음 빈칸에 들어갈 말은 무엇일까요?  “동해물과 백두산이 ____”"
      figure:
        kind: chat
        input: null
        messages:
          - { who: user, text: "동해물과 백두산이" }
          - { who: ai, text: "마르고 닳도록, 하느님이 보우하사 우리나라 만세…" }
    keywords: [대규모 언어 모델(LLM), 토큰, 확률, 환각, 지식 시점, 맥락 창]
    map: [다음 말 맞히기, 학습에서 대화까지, 답이 달라지는 이유, 꼭 알아야 할 한계]

  - type: concept
    sec: 02-1
    title: 다음 말 맞히기 게임
    blocks:
      - p: 여러분은 "동해물과 백두산이" 다음에 어떤 말이 올지 바로 압니다. 그 노래를 **수없이 들었기 때문**입니다. 생성형 AI도 이와 비슷한 방식으로 말을 만듭니다.
      - p: 생성형 AI의 바탕에는 **대규모 언어 모델(LLM)**이 있습니다. 책·기사·웹 문서처럼 엄청난 양의 글을 읽고, 어떤 말 다음에 어떤 말이 자주 오는지를 익힌 프로그램입니다.
      - figure:
          kind: bar
          label: 그래프 2-1
          caption: "“오늘 날씨가 정말 ___” 다음에 올 말의 확률 (설명을 위한 가상의 값)"
          unit: "%"
          highlight: 좋네요
          items: [[좋네요, 52], [덥네요, 21], [춥네요, 15], [이상하네요, 7], [기타, 5]]
      - p: AI는 앞 문장을 보고 다음 말 후보마다 **확률**을 매깁니다. 그중 하나를 골라 붙이고, 다시 다음 말을 고르는 일을 수백 번 되풀이해 긴 답을 완성합니다.
      - concept:
          title: 생성형 AI가 글을 만드는 방법
          body: |
            앞의 글을 보고 → **다음에 올 말을 예측**하고 → 하나를 골라 붙이기를 **반복**한다.
            AI는 "사실인지"가 아니라 **"그럴듯한지"**를 기준으로 말을 고른다.
    side:
      - note:
          kind: term
          title: 대규모 언어 모델 (LLM)
          body: Large Language Model. 아주 많은 글로 배운 언어 모델. 대화형 AI의 '두뇌'에 해당한다.
      - note:
          kind: term
          title: 토큰 (token)
          body: AI가 글을 나누어 처리하는 작은 조각. 한국어는 대략 글자 1~2개가 1토큰이다.
      - note:
          kind: tip
          body: 휴대폰 자판의 **추천 단어** 기능을 떠올려 보세요. LLM은 그 기능을 엄청나게 키우고 다듬은 것과 비슷합니다.

  - type: concept
    sec: 02-2
    title: 배우고, 다듬고, 대화하기
    blocks:
      - p: 대화형 AI는 하루아침에 만들어지지 않습니다. 먼저 엄청난 양의 글로 **다음 말 맞히기**를 배우고, 그다음 사람들의 평가를 받으며 **도움이 되고 안전하게 답하는 법**을 다듬습니다. 그 뒤에야 우리와 대화합니다.
      - figure:
          kind: flow
          label: 그림 2-1
          caption: 대화형 AI가 만들어지고 쓰이는 3단계
          steps:
            - { title: 사전 학습, desc: "책·기사·웹 문서로<br>다음 말 예측 연습" }
            - { title: 다듬기, desc: "사람이 답을 평가하며<br>도움 되고 안전한 답 연습" }
            - { title: 대화, desc: "우리가 쓴 질문을 보고<br>답을 만들어 냄", hl: true }
      - p: 중요한 점은 AI가 읽은 글을 **통째로 외워 두었다가 꺼내는 것이 아니라는** 사실입니다. 글에서 배운 **패턴**으로 그때그때 새 문장을 만들어 냅니다. 그래서 처음 보는 질문에도 답할 수 있지만, 배운 적 없는 내용을 그럴듯하게 지어내기도 합니다.
      - concept:
          title: AI의 답은 '찾아온 것'이 아니라 '만들어 낸 것'
          body: 생성형 AI는 기억 속 문서를 찾아 보여 주는 검색창과 다르다. 배운 패턴으로 **새로 만든 문장**이므로, 사실인지는 따로 확인해야 한다.
    side:
      - note:
          kind: fact
          title: 검색 기능이 켜져 있다면?
          body: 일부 서비스는 답하기 전에 인터넷을 검색해 참고합니다. 그래도 찾은 내용을 잘못 요약할 수 있어요. (6단원)
      - note:
          kind: tip
          body: 'AI가 "제가 찾아보니"라고 말해도, 실제로 검색했는지는 화면의 **출처 표시**로 확인하세요.'

  - type: concept
    sec: 02-3
    title: 같은 질문, 다른 답 — 고장일까?
    blocks:
      - p: 같은 질문을 두 번 하면 AI의 답 표현이 조금씩 달라집니다. 고장이 아닙니다. 늘 확률 1등인 말만 고르면 답이 딱딱하고 반복적이 되기 때문에, **확률에 따라 다른 후보도 고르도록** 만들어져 있습니다.
      - figure:
          kind: tokens
          label: 그림 2-2
          caption: 낱말을 하나씩 붙여 가며 문장을 만드는 과정. 주황색이 새로 고른 말이고, 마지막 칸은 다음에 고를 차례다.
          rows:
            - [오늘]
            - [오늘, 날씨가]
            - [오늘, 날씨가, 정말]
          next: "좋네요? 덥네요?"
      - p: 주사위를 다시 던지듯, 고르는 말이 하나만 달라져도 그 뒤 문장 전체가 달라집니다. 그래서 마음에 들지 않는 답은 **다시 받아 보는 것**도 좋은 방법입니다.
      - concept:
          title: 답이 매번 다른 이유
          body: AI는 확률에 따라 다음 말을 **조금씩 다르게 고른다.** 표현이 달라지는 것은 정상이다. 다만 **사실(숫자·날짜)이 답마다 다르면** 그 내용은 믿기 어렵다는 신호다.
    side:
      - note:
          kind: tip
          title: 다시 받기 버튼
          body: 대부분의 서비스에는 답 아래에 **↻(다시 생성)** 버튼이 있습니다. 여러 번 받아 보고 마음에 드는 것을 고르세요.
      - note:
          kind: warn
          body: 같은 질문에 날짜나 금액이 매번 다르게 나온다면, 그 숫자는 **지어낸 것일 가능성**이 큽니다.

  - type: concept
    sec: 02-4
    title: 꼭 알아야 할 한계 세 가지
    blocks:
      - p: 생성형 AI는 놀랍도록 말을 잘하지만, 원리상 피할 수 없는 약점이 있습니다. 이 세 가지만 알아도 AI에게 속을 일이 크게 줄어듭니다.
      - table:
          label: 표 2-1
          caption: 생성형 AI의 세 가지 한계와 대처법
          widths: [22%, 40%, 38%]
          head: ['한계', '무슨 뜻인가요?', '이렇게 대처해요']
          rows:
            - - "**① 환각**<br>(hallucination)"
              - 그럴듯하지만 **사실이 아닌 내용**을 자신 있게 말한다. "그럴듯함"으로 말을 고르기 때문이다.
              - 숫자·이름·출처는 **직접 확인**한다. (6단원)
            - - "**② 지식 시점**<br>(knowledge cutoff)"
              - 학습한 시점 **이후의 일은 모르거나** 틀린다. 바뀐 제도·가격·영업시간이 대표적이다.
              - '"언제 기준이야?"라고 묻고, 최신 정보는 공식 홈페이지에서 본다.'
            - - "**③ 대화 기억 한계**<br>(맥락 창)"
              - 한 대화에서 볼 수 있는 글의 양에 **한도**가 있다. 아주 길어지면 앞 내용을 놓친다. 새 대화는 이전 대화를 모른다.
              - 중요한 조건은 **다시 알려 주고**, 주제가 바뀌면 새 대화를 연다.
      - warn:
          title: 말투가 자신 있다고 사실은 아닙니다.
          body: AI는 틀린 내용도 **똑같이 친절하고 자신 있는 말투**로 말합니다. 말투가 아니라 **근거**를 보고 판단하세요.
    side:
      - note:
          kind: term
          title: 환각
          body: 사실이 아닌 것을 그럴듯하게 지어내는 현상. "모르는 길도 자신 있게 알려 주는 친절한 행인"과 비슷하다.
      - note:
          kind: term
          title: 맥락 창
          body: AI가 한 번에 볼 수 있는 글의 양. 넘치면 앞부분이 흐려진다.

  - type: example
    title: 답을 그대로 믿어도 될까?
    blocks:
      - example:
          no: 1
          title: 도서관 휴관일 묻기
          level: 1
          q: |
            김정숙 님이 AI에게 "우리 동네 ○○도서관 오늘 문 열어?"라고 물었더니, AI가 **"네, 매주 월요일만 휴관합니다"**라고 답했습니다. 이 답을 그대로 믿으면 안 되는 이유 두 가지를 쓰고, 확인 방법을 말해 보세요.
          steps:
            - "**지식 시점**: AI는 배운 시점 이후의 변화(임시 휴관, 운영 시간 변경)를 모를 수 있습니다."
            - "**환각 가능성**: 많은 도서관이 월요일에 쉰다는 '흔한 패턴'으로 그럴듯하게 답했을 수 있습니다."
            - "**확인**: 도서관 공식 홈페이지나 전화로 오늘 운영 여부를 직접 확인합니다."
          answer: 지식 시점과 환각 때문에 틀릴 수 있다. 공식 홈페이지·전화로 확인한다.
          memo: 지역 정보(영업시간·주소·전화번호)는 AI가 특히 자주 틀리는 영역입니다.
      - similar:
          no: 1
          level: 1
          q: 같은 질문을 두 번 했더니 AI의 답 표현이 조금 달랐습니다. AI가 고장 난 것일까요? 이유와 함께 한 문장으로 답해 보세요.
          lines: 1
          answer: 고장이 아니다.
          explain: 확률에 따라 후보 중 하나를 고르도록 만들어져 있어, 할 때마다 표현이 조금씩 달라질 수 있다.
      - similar:
          no: 2
          level: 2
          q: |
            박영호 사장님이 한 대화창에서 두 시간 동안 메뉴판·가격표·안내문을 계속 만들었더니, AI가 처음에 알려 준 "할인은 최대 20%" 조건을 잊고 30% 할인 안내문을 만들었습니다. 2-4의 세 가지 한계 중 무엇에 해당하고, 어떻게 하면 좋을까요?
          lines: 2
          answer: ③ 대화 기억 한계(맥락 창)
          explain: 대화가 아주 길어지면 앞부분 조건을 놓칠 수 있다. 중요한 조건은 다시 알려 주거나, 조건을 정리해 새 대화를 시작한다.

  - type: exercises
    title: 2단원을 확인해 봅시다
    blocks:
      - exercises:
          items:
            - no: 1
              level: 1
              kind: short
              q: 빈칸에 알맞은 말을 쓰세요. "대규모 언어 모델은 앞의 글을 보고 다음에 올 (( 말 ))을 예측하여 문장을 만든다."
              answer: 말(낱말)
            - no: 2
              level: 1
              kind: mc
              q: '"환각(hallucination)"에 대한 설명으로 가장 알맞은 것은?'
              cols: 2
              choices:
                - AI가 사람처럼 꿈을 꾸는 현상
                - 사실이 아닌 내용을 그럴듯하게 말하는 현상
                - AI가 답을 거부하는 현상
                - 인터넷이 끊겨 답이 늦는 현상
              answer: ②
              explain: AI는 "그럴듯한" 말을 고르기 때문에, 사실이 아닌 내용도 자연스럽게 만들어 낼 수 있다.
            - no: 3
              level: 2
              kind: ox
              q: 다음 설명이 맞으면 O, 틀리면 X에 표시하세요.
              statements:
                - AI는 학습한 시점 이후에 생긴 일도 항상 정확히 알고 있다.
                - AI의 답은 읽은 문서를 통째로 꺼내 보여 주는 것이다.
                - AI가 자신 있게 말하면 사실이라고 믿어도 된다.
              answer: (ㄱ) X (ㄴ) X (ㄷ) X
              explain: 지식 시점 이후는 모를 수 있고, 답은 배운 패턴으로 새로 만든 것이며, 말투와 사실 여부는 관계가 없다.
            - no: 4
              level: 2
              kind: match
              q: 상황과 관계있는 한계를 이으세요.
              pairs:
                - [바뀐 버스 요금을 옛 요금으로 알려 줌, 환각]
                - [있지도 않은 책 제목을 알려 줌, 대화 기억 한계]
                - [긴 대화 끝에 처음 말한 조건을 잊음, 지식 시점]
              answer: "ㄱ-③ 지식 시점, ㄴ-① 환각, ㄷ-② 대화 기억 한계"
            - no: 5
              level: 3
              kind: essay
              q: 그래프 2-1을 보고, AI가 "좋네요"를 고를 가능성이 가장 높은 이유를 **학습**이라는 낱말을 넣어 설명하세요.
              lines: 2
              answer: (예시) 학습한 글에서 "오늘 날씨가 정말" 다음에 "좋네요"가 가장 자주 나왔기 때문에 확률이 가장 높다.
              explain: "채점 포인트: '학습한 글(데이터)'과 '자주 나온 말 = 높은 확률'을 연결했는가"

  - type: summary
    title: 2단원 정리
    blocks:
      - summary:
          items:
            - 생성형 AI의 바탕은 **대규모 언어 모델(LLM)**이다. 앞의 글을 보고 **다음에 올 말을 예측**해 하나씩 붙여 문장을 만든다.
            - AI는 **사전 학습 → 다듬기 → 대화** 순서로 만들어지며, 답은 찾아온 것이 아니라 **새로 만든 것**이다.
            - 확률에 따라 고르므로 **답 표현은 매번 다를 수 있다.** 하지만 숫자·날짜가 매번 다르면 의심한다.
            - 꼭 알아야 할 한계 세 가지는 **환각 · 지식 시점 · 대화 기억 한계**다.
      - myth:
          items:
            - { myth: AI가 답을 바꾸는 건 고장이다., truth: 일부러 다양하게 고르도록 만든 것이다. 다시 받아 보는 것도 방법이다. }
            - { myth: AI는 인터넷의 최신 정보를 다 안다., truth: "학습 시점 이후는 모를 수 있고, 검색 기능이 있어도 잘못 요약할 수 있다." }
            - { myth: 자신 있게 말하면 맞는 말이다., truth: 틀린 말도 같은 말투로 한다. 말투가 아니라 근거를 본다. }
      - checklist:
          items:
            - '"다음 말 예측"으로 AI가 글을 만드는 원리를 설명할 수 있다.'
            - 같은 질문에 답이 달라지는 이유를 말할 수 있다.
            - 환각·지식 시점·대화 기억 한계를 예를 들어 설명할 수 있다.

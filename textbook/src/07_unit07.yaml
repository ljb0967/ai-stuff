unit: 7
part: 3
part_title: AI를 믿을 수 있게 쓰기
title: 안전하고 바르게 쓰기
glossary:
  - { term: 가명 처리, en: pseudonymization, unit: 7, desc: "이름·연락처 등 누구인지 알 수 있는 정보를 'A 고객', '김○○'처럼 바꾸거나 지우는 것." }
  - { term: 딥페이크, en: deepfake, unit: 7, desc: "AI로 만든 가짜 얼굴 사진·영상." }
  - { term: 딥보이스, en: deep voice, unit: 7, desc: "AI로 특정 사람의 목소리를 흉내 내 만든 가짜 목소리." }
  - { term: 인공지능 기본법, en: AI Basic Act, unit: 7, desc: "2026년 1월 22일 시행된 우리나라의 AI 법. 생성형 AI 서비스임을 알리고 결과물에 AI 표시를 하도록 한다." }
  - { term: 편향, en: bias, unit: 7, desc: "AI가 배운 자료에 담긴 치우친 생각(성별·나이·지역 등)을 따라 하는 것." }
pages:
  - type: opener
    subtitle: 내 정보, 가족, 돈을 지키며 AI 쓰기
    goals:
      - AI에 입력하면 안 되는 정보를 **구별하고, 가명 처리해** 입력할 수 있다.
      - 딥페이크·딥보이스 사기에 대처하는 **3원칙**을 말할 수 있다.
      - 저작권·AI 표시와 관련해 지켜야 할 **사용 습관**을 설명할 수 있다.
    why: |
      AI는 편리한 만큼 **나쁜 사람에게도 편리한 도구**입니다. 가짜 목소리로 가족을 흉내 내는 사기까지 나왔습니다. 지키는 법을 알면 두려워할 필요가 없습니다.
    hook:
      q: 울먹이는 딸의 목소리로 "엄마, 급해. 지금 돈 좀 보내 줘"라는 전화가 왔습니다. 가장 먼저 무엇을 해야 할까요?
      figure:
        kind: chat
        title: 전화 통화
        input: null
        messages:
          - { who: ai, name: "모르는 번호 📞", text: "엄마… 나 사고 났어. 합의금 보내야 한대. 지금 바로 보내 줘…" }
          - { who: note, text: "실제 딸의 목소리와 똑같았습니다. AI로 흉내 낸 가짜였습니다. (2025년 보도된 사례를 바탕으로 구성)" }
    keywords: [입력 금지 정보, 가명 처리, 딥페이크, 딥보이스, 인공지능 기본법, 저작권, 편향]
    map: [입력하면 안 되는 정보, 가명 처리, 딥보이스 대처, 이런 것도 조심, AI 표시와 저작권]

  - type: concept
    sec: 07-1
    title: 입력하면 안 되는 정보
    blocks:
      - p: AI에 입력한 내용은 서비스 회사의 서버에 저장되고, 설정에 따라 **AI를 개선하는 데 쓰일 수** 있습니다. 한번 보낸 정보는 되돌리기 어렵습니다. 그래서 입력 전에 신호등처럼 세 가지로 나누어 생각합니다.
      - table:
          label: 표 7-1
          caption: 입력 정보 신호등
          widths: [22%, 78%]
          head: [구분, 정보]
          rows:
            - ["[r] **절대 금지**", "주민등록번호, 계좌·카드번호, 비밀번호, 인증번호, 신분증·통장 사진"]
            - ["[y] **가려서**", "남의 실명·전화번호·주소, 진료 기록, 회사 내부 자료, 계약서 → 가명 처리 후 입력 (07-2)"]
            - ["[g] **괜찮음**", "일반적인 질문, 이미 공개된 정보, 민감한 내용이 없는 내 글"]
      - figure:
          kind: flow
          label: 그림 7-1
          caption: 설정에서 한 번 확인해 둘 세 가지 (메뉴 이름은 서비스마다 다르다)
          steps:
            - { title: 학습 사용 끄기, desc: '"내 대화를 AI 개선에 사용" 같은 항목' }
            - { title: 기록 정리, desc: "필요 없는 대화는 삭제" }
            - { title: 2단계 인증, desc: "계정 보안 강화" }
      - concept:
          title: 회사 자료는 회사가 허락한 AI에서만
          body: 업무 자료를 개인 AI 계정에 넣으면 **회사 규정 위반**이 될 수 있다. 일터에서는 **허용된 서비스와 규칙**부터 확인한다.
    side:
      - note:
          kind: fact
          body: 개인정보보호위원회는 2025년 8월 「생성형 AI 개발·활용을 위한 개인정보 처리 안내서」를 내고, 입력 정보가 그대로 출력되는 등의 위험을 짚었습니다.
      - note:
          kind: warn
          body: 학습 사용을 꺼도 **금지 정보는 여전히 입력하지 않습니다.**

  - type: concept
    sec: 07-2
    title: 가명 처리 — 가리고 바꿔서 쓰기
    blocks:
      - p: 남의 정보가 들어간 일을 AI에게 맡겨야 할 때가 있습니다. 민원 정리, 고객 응대, 가족 일정처럼요. 이때는 **누구인지 알 수 있는 정보를 지우거나 바꿔서** 입력합니다. 이것을 가명 처리라고 합니다.
      - figure:
          kind: redact
          label: 그림 7-2
          caption: 가명 처리 전과 후. AI가 일을 하는 데 필요한 내용(무엇이 문제인지)은 그대로 남는다.
          before: |
            **김철수**(010-1234-5678) 님이 **○○구 △△로 12, 301호** 앞 불법 주차 차량(**12가 3456**) 때문에 3일째 출근을 못 했다고 민원을 냈습니다.
          after: |
            **A 주민**이 **자택** 앞 불법 주차 차량 때문에 3일째 출근을 못 했다고 민원을 냈습니다.
      - steps:
          title: 가명 처리 3단계
          items:
            - "**찾기**: 이름·연락처·주소·차량 번호·주민번호처럼 '누구인지' 알 수 있는 것에 표시한다."
            - "**바꾸기**: 'A 주민', '김○○', '고객 1'처럼 바꾼다."
            - "**빼기**: 일에 필요 없는 날짜·금액·번호는 아예 지운다."
      - concept:
          title: AI에게는 '사정'만, '신원'은 빼고
          body: AI가 일을 하는 데는 **무슨 일인지(사정)**만 있으면 된다. **누구인지(신원)**는 필요 없다.
    side:
      - note:
          kind: term
          title: 가명 처리
          body: 누구인지 알 수 있는 정보를 바꾸거나 지우는 것.
      - note:
          kind: tip
          body: AI가 만든 결과물에 실제 이름을 다시 넣는 일은 **AI 밖에서, 내가 직접** 합니다.

  - type: concept
    sec: 07-3
    title: 딥보이스·딥페이크 사기 대처 3원칙
    blocks:
      - p: AI로 남의 얼굴(딥페이크)이나 목소리(딥보이스)를 흉내 내는 기술이 쉬워졌습니다. 짧은 통화 녹음만으로도 목소리 흉내가 가능하다는 시연이 보도되었습니다. 가족 목소리로 급하게 돈을 요구하는 사기가 실제로 일어나고 있습니다.
      - figure:
          kind: flow
          dir: v
          label: 그림 7-3
          caption: 가족 목소리로 돈을 요구하는 전화를 받았을 때
          steps:
            - { no: "1", title: "끊고, 내가 다시 건다", desc: "저장된 번호로 직접 전화해 본인에게 확인한다. 걸려 온 번호로 다시 걸지 않는다." }
            - { no: "2", title: 가족 암호를 묻는다, desc: "우리 가족만 아는 질문·암호를 미리 정해 둔다. 예) \"우리 집 강아지 첫 이름은?\"" }
            - { no: "3", title: 돈 얘기가 나오면 멈춘다, desc: "급하다며 송금·앱 설치·개인정보를 요구하면 사기를 먼저 의심한다.", hl: true }
      - warn:
          title: 이미 송금했다면 바로 신고하세요.
          body: "**112**(경찰) 또는 **1332**(금융감독원)에 신고하고, 은행에 **지급 정지**를 요청합니다. 빠를수록 돌려받을 가능성이 커집니다."
    side:
      - note:
          kind: term
          title: 딥페이크 · 딥보이스
          body: AI로 만든 가짜 얼굴·영상(딥페이크)과 가짜 목소리(딥보이스).
      - note:
          kind: fact
          body: 경찰청 자료를 인용한 보도에 따르면 2024년 보이스피싱 피해액은 약 8,545억 원입니다. 이 중 딥보이스가 쓰인 건수는 **따로 집계되지 않습니다.**
      - note:
          kind: tip
          body: 가족의 목소리·얼굴 영상을 SNS에 **전체 공개**로 올리는 것을 줄이세요.

  - type: concept
    sec: 07-4
    title: 이런 것도 조심하세요
    blocks:
      - p: 딥보이스 말고도 AI를 이용한 위험은 다양합니다. 피해를 입는 쪽만이 아니라, **모르고 가해자가 되는 일**도 조심해야 합니다.
      - table:
          label: 표 7-2
          caption: AI를 이용한 위험과 대처
          widths: [24%, 42%, 34%]
          head: [위험, 이런 모습, 이렇게 대처]
          rows:
            - - "**유명인 사칭 투자 광고**"
              - 유명인의 얼굴·목소리를 AI로 흉내 내 "고수익 보장" 투자를 권하는 광고·영상
              - '"보장 수익"은 사기 신호. 투자는 등록된 금융회사인지 금융감독원에서 확인'
            - - "**가짜 AI 앱·사이트**"
              - 유명 AI 서비스를 흉내 낸 앱, 결제·카드 정보를 먼저 요구하는 사이트
              - 공식 앱 장터, 개발사 이름 확인 (3단원)
            - - "**남의 사진으로 합성물 만들기**"
              - 지인·연예인·아이의 사진으로 성적인 합성물이나 놀림거리를 만들어 공유
              - '**만들기·퍼뜨리기는 범죄.** 2024년 10월부터 이런 허위 영상물은 **갖고 있거나 보기만 해도** 처벌된다'
            - - "**AI에게 마음 기대기**"
              - 외로울 때 AI와 대화가 길어져 사람과의 만남을 피하게 됨
              - AI는 친구를 대신하지 못한다. 힘들면 가족·이웃·상담 전화(109 등)와 이야기
      - concept:
          title: 수상하면 멈추고, 묻고, 확인한다
          body: AI가 만든 가짜는 점점 진짜 같아진다. 그래서 **"급하다, 비밀이다, 돈이다"**가 나오면 일단 멈추고 다른 경로로 확인한다.
    side:
      - note:
          kind: fact
          body: 자살예방 상담전화는 **109**입니다. 24시간 받을 수 있습니다.

  - type: concept
    sec: 07-5
    title: AI 표시, 저작권, 편향
    blocks:
      - p: 우리나라는 **2026년 1월 22일 「인공지능 기본법」**을 시행했습니다. 생성형 AI 서비스는 AI로 운영된다는 사실을 이용자에게 **미리 알리고**, 실제와 구분하기 어려운 결과물(딥페이크 등)에는 **AI로 만들었다는 표시**를 해야 합니다.
      - table:
          label: 표 7-3
          caption: 바르게 쓰는 세 가지 습관
          widths: [20%, 80%]
          head: [주제, 지킬 습관]
          rows:
            - - "**AI 표시**"
              - '표시 의무는 사업자에게 있다. 사기범은 표시하지 않는다. → **"표시가 없다고 진짜는 아니다."**'
            - - "**저작권**"
              - '문화체육관광부·한국저작권위원회 안내서(2025.6)에 따르면 **사람의 창작적 기여가 있는 부분만** 저작권 등록이 된다. → 남의 작품을 넣어 "똑같이" 만들지 않고, AI로 만든 것을 공개할 때는 **AI 활용 사실을 밝힌다.**'
            - - "**편향**"
              - AI는 배운 글의 치우친 생각(성별·나이·지역)을 따라 할 수 있다. → 사람을 **평가·선발하는 일**에 AI 판단을 그대로 쓰지 않는다.
      - concept:
          title: 내가 만든 것처럼 속이지 않기
          body: AI의 도움을 받은 글·그림을 내보낼 때는 **AI 활용 사실을 밝히는 것**이 기본 예의다. 상업적으로 쓸 때는 서비스 약관도 확인한다.
    side:
      - note:
          kind: term
          title: 인공지능 기본법
          body: 2026.1.22 시행. 정부는 시행 초기 과태료를 바로 물리지 않는 계도기간을 두기로 했다.
      - note:
          kind: term
          title: 편향
          body: AI가 배운 자료의 치우친 생각을 따라 하는 것.

  - type: example
    title: 안전하게 쓰는 연습
    blocks:
      - example:
          no: 1
          title: 민원 요약 요청 가명 처리하기
          level: 2
          q: |
            이수진 주무관이 다음 민원을 요약하려 합니다. AI에 넣기 전에 가명 처리해 보세요.
            "**박○민(010-9876-5432)** 씨가 **△△동 15-3번지** 앞 가로등이 2주째 꺼져 있어 밤에 넘어질 뻔했다고 합니다."
          steps:
            - "**찾기**: 이름, 전화번호, 번지 주소"
            - "**바꾸기**: 이름 → 'B 주민', 주소 → '주택가 골목'"
            - "**빼기**: 전화번호는 요약에 필요 없으므로 지운다."
          answer: B 주민이 주택가 골목 가로등이 2주째 꺼져 있어 밤에 넘어질 뻔했다고 민원을 냈습니다.
      - example:
          no: 2
          title: 수상한 전화 대처
          level: 1
          q: 김정숙 님에게 손주 목소리로 "할머니, 폰이 고장 나서 친구 폰으로 걸었어. 문화상품권 사서 번호 좀 보내 줘"라는 전화가 왔습니다. 3원칙에 따라 할 일을 쓰세요.
          steps:
            - "**끊고 다시 건다**: 저장된 손주 번호나 딸에게 직접 전화한다."
            - "**가족 암호**: 확인이 안 되면 미리 정한 가족 질문을 한다."
            - "**돈 얘기 = 멈춤**: 상품권 번호도 돈이다. 확인 전에는 절대 보내지 않는다."
          answer: 끊고 저장된 번호로 확인 → 가족 암호 → 확인 전 송금·상품권 금지
      - similar:
          no: 1
          level: 2
          q: 박영호 사장님이 AI로 만든 **10주년 이벤트 포스터**를 가게에 붙이려 합니다. 붙이기 전에 확인할 점을 두 가지 쓰세요.
          lines: 2
          answer: (예시) ① 날짜·가격·할인율이 맞는지 ② 남의 캐릭터·로고를 흉내 낸 부분이 없는지
          explain: 포스터 내용은 내 이름으로 나가므로 사실을 확인하고, 다른 사람의 작품을 베낀 부분이 없는지 본다. 필요하면 'AI로 제작' 표시를 한다.

  - type: exercises
    title: 7단원을 확인해 봅시다
    blocks:
      - exercises:
          items:
            - no: 1
              level: 1
              kind: mc
              q: AI에 **절대 입력하면 안 되는** 정보는?
              cols: 2
              choices: [김치찌개 레시피, 휴대폰 인증번호, 이미 공개된 축제 일정, 내가 쓴 일기(민감 내용 없음)]
              answer: ②
            - no: 2
              level: 2
              kind: short

  - type: summary
    title: 7단원 정리
    blocks:
      - summary:
          items:
            - "**절대 금지**(주민번호·계좌·카드·비밀번호·인증번호), **가려서**(남의 정보·진료 기록·회사 자료), **괜찮음**으로 나누어 입력한다."
            - "**가명 처리**: 찾기 → 바꾸기 → 빼기. AI에게는 사정만, 신원은 뺀다."
            - "딥보이스 대처 3원칙: **끊고 내가 다시 건다 · 가족 암호 · 돈 얘기 = 멈춤.** 송금했다면 112·1332·지급 정지."
            - 남의 사진으로 합성물을 만들거나 퍼뜨리는 것은 범죄다. AI로 만든 것은 **AI 활용 사실을 밝힌다.**
      - myth:
          items:
            - { myth: 학습 사용을 끄면 무엇이든 입력해도 된다., truth: 금지 정보는 설정과 관계없이 입력하지 않는다. }
            - { myth: 목소리가 똑같으면 진짜 가족이다., truth: 짧은 녹음으로도 목소리를 흉내 낼 수 있다. 끊고 다시 걸어 확인한다. }
            - { myth: AI 표시가 없으면 진짜다., truth: "표시 의무는 사업자에게 있고, 사기범은 표시하지 않는다." }
      - checklist:
          items:
            - 입력 정보를 금지·가려서·괜찮음으로 나눌 수 있다.
            - 남의 정보가 든 글을 가명 처리할 수 있다.
            - 딥보이스 대처 3원칙을 말하고, 가족 암호를 정했다.

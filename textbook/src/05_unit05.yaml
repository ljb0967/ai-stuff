unit: 5
part: 2
part_title: AI와 대화하기
title: 생활과 일에 AI 쓰기
glossary:
  - { term: 요약, en: summary, unit: 5, desc: "긴 글에서 핵심만 짧게 추려 내는 것. '내가 할 일만'처럼 기준을 주면 더 쓸모 있다." }
  - { term: 첨부, en: attachment, unit: 5, desc: "사진·문서 파일을 질문과 함께 올려 보내는 것." }
  - { term: 위치 정보, en: location data, unit: 5, desc: "사진 파일 안에 함께 저장될 수 있는 찍은 장소 정보." }
pages:
  - type: opener
    subtitle: 쓰기·요약·번역·사진으로 묻기·계획 세우기
    goals:
      - 생성형 AI의 **대표 활용 5가지**를 해 볼 수 있다.
      - 사진·파일을 **안전하게 첨부해** 질문할 수 있다.
      - 건강·법률·돈 문제에서 AI를 쓸 때의 **한계**를 말할 수 있다.
    why: |
      AI는 배운 만큼만 쓸모 있습니다. 매일 하는 **문자 쓰기, 긴 글 읽기, 계획 세우기**에 써 보면 하루에 몇십 분이 생깁니다.
    hook:
      q: 아파트 관리사무소에서 온 두 장짜리 공지문, 나에게 필요한 내용은 몇 줄일까요?
      figure:
        kind: chat
        input: null
        messages:
          - { who: user, text: "📄 (공지문 사진) 이 공지에서 **내가 해야 할 일**만 뽑아 줘." }
          - { who: ai, text: "해야 할 일은 두 가지예요.\n1. 11월 20일까지 베란다 물건 치우기\n2. 21일 오전 9시~12시 물 사용 자제" }
    keywords: [쓰기, 요약, 번역, 첨부, 위치 정보, 참고용]
    map: [활용 5가지, 쓰기와 요약, 사진·파일로 묻기, 참고와 결정 구분하기]

  - type: concept
    sec: 05-1
    title: 대표 활용 다섯 가지
    blocks:
      - p: 생성형 AI가 생활과 일에서 가장 쓸모 있는 곳은 크게 다섯 가지입니다. 표의 **요청 공식**에 내 상황을 넣어 쓰면, 4단원의 4요소가 자연스럽게 들어갑니다.
      - table:
          label: 표 5-1
          caption: 대표 활용 다섯 가지와 요청 공식
          widths: [15%, 47%, 38%]
          head: [활용, 요청 공식, 이런 장면에]
          rows:
            - - '**쓰기**'
              - '"[누구]에게 보낼 [무엇]을 [어떻게] 써 줘"'
              - '단체방 공지, 경조사 문자, 가게 안내문'
            - - '**요약**'
              - '"핵심 3줄로" / "내가 할 일만 뽑아서"'
              - '긴 공문, 가전 설명서, 뉴스 기사'
            - - '**번역**'
              - '"[상황]에서 쓸 자연스러운 [언어]로"'
              - '해외여행, 외국인 손님 응대'
            - - '**사진으로 묻기**'
              - '(사진 첨부) "이게 무슨 뜻이야?"'
              - '메뉴판, 가전 경고등, 식물 이름'
            - - '**계획·정리**'
              - '"[조건]에 맞게 [기간] 계획을 표로"'
              - '여행·운동 계획, 장보기 목록'
      - concept:
          title: 요청 공식 = 4요소의 지름길
          body: 빈칸에 **누구·무엇·어떻게(맥락·과제·형식)**만 채우면 좋은 요청이 된다. 익숙해지면 공식 없이도 쓸 수 있다.
    side:
      - note:
          kind: tip
          body: 번역은 **"여행지 식당에서 쓸 말투로"**처럼 상황을 알려 주면 훨씬 자연스럽습니다.
      - note:
          kind: tip
          body: 요약은 **"내가 할 일만"**, **"날짜와 금액만"**처럼 기준을 주면 더 쓸모 있습니다.

  - type: concept
    sec: 05-2
    title: 가장 자주 쓰는 쓰기와 요약
    blocks:
      - p: 쓰기를 맡길 때는 **받는 사람과 목적**을 꼭 알려 줍니다. 같은 내용도 손주에게 보내는 문자와 거래처에 보내는 메일은 말투가 다르기 때문입니다.
      - prompt:
          label: 쓰기 요청의 예
          text: 단골손님들에게 보낼 **임시 휴무 안내 문자**를 써 줘. 가게 내부 공사로 다음 주 월~수요일 쉬고, 목요일부터 정상 영업해. 따뜻한 인사로 시작하고 4줄 이내로.
      - p: 요약은 긴 글을 붙여 넣거나 파일·사진을 첨부한 뒤 **무엇을 기준으로 줄일지** 말해 줍니다. "핵심 3줄", "내가 할 일만", "날짜·금액·장소만"이 대표적입니다.
      - figure:
          kind: chat
          label: 그림 5-1
          caption: 요약 요청의 예. 줄이는 기준(할 일만, 마감일 먼저)을 함께 말한다.
          input: null
          messages:
            - { who: user, text: "📄 (공문 파일) 이 공문에서 **우리 가게가 해야 할 일**만 체크리스트로 정리해 줘. 마감일은 맨 앞에." }
            - { who: ai, text: "☐ (11/28까지) 위생 교육 이수증 제출\n☐ 냉장고 온도 기록표 비치\n☐ 종사자 건강진단 결과 확인" }
      - concept:
          title: 결과는 내 이름으로 나간다
          body: AI가 쓴 글도 **보내기 전에 한 번 소리 내어 읽고** 날짜·금액·이름을 확인한다. 요약은 중요한 내용이 빠졌는지 **원문과 대조**한다.
    side:
      - note:
          kind: term
          title: 요약
          body: 긴 글에서 핵심만 추려 짧게 만드는 것. 기준을 주면 더 정확하다.
      - note:
          kind: warn
          body: 요약은 **빠뜨리는 실수**가 잦습니다. 마감일·금액처럼 중요한 내용은 원문에서 다시 찾아보세요.

  - type: concept
    sec: 05-3
    title: 사진·파일로 묻기
    blocks:
      - p: 글로 설명하기 어려운 것은 **사진을 찍어 첨부**하면 됩니다. 입력창 옆의 **＋(첨부)** 버튼을 누르고 사진을 고른 뒤, 무엇이 궁금한지 함께 씁니다. 사진은 밝고 정면으로, 필요한 부분만 찍을수록 정확합니다.
      - figure:
          kind: chat
          label: 그림 5-2
          caption: 사진으로 묻기의 예. 사진과 함께 궁금한 점을 구체적으로 쓴다.
          input: null
          messages:
            - { who: user, text: "📷 (사진: 세탁기 화면에 깜박이는 'dE' 표시)\n이 표시가 무슨 뜻이야? 어떻게 하면 돼?" }
            - { who: ai, text: "'dE'는 대부분의 세탁기에서 **문이 제대로 닫히지 않았다**는 표시예요. 문을 다시 꼭 닫아 보세요. 계속되면 설명서의 고객센터에 문의하세요." }
      - figure:
          kind: cards
          label: 그림 5-3
          caption: 사진을 첨부하기 전 확인할 세 가지
          cols: 3
          items:
            - { key: "1", title: 가리기, desc: "이름·주민번호·주소·얼굴이 찍혔으면 잘라 내거나 가린다" }
            - { key: "2", title: 위치 정보, desc: "사진에 찍은 장소가 저장될 수 있다. 공유 전 위치 정보를 끈다" }
            - { key: "3", title: 필요한 부분만, desc: "궁금한 부분만 확대해 찍으면 더 정확하다" }
    side:
      - note:
          kind: term
          title: 위치 정보
          body: 사진 파일에 함께 저장될 수 있는 '찍은 장소' 정보. 휴대폰 카메라 설정이나 공유 화면에서 끌 수 있다.
      - note:
          kind: tip
          body: PDF·문서 파일도 같은 방법으로 첨부해 "요약해 줘"라고 할 수 있습니다.

  - type: concept
    sec: 05-4
    title: 참고용과 결정을 구분하기
    blocks:
      - p: AI는 건강·법률·돈 문제를 **이해하고 준비하는 데**는 큰 도움이 됩니다. 하지만 진단, 약 변경, 계약, 투자 같은 **결정은 전문가와 공식 기관**의 몫입니다. AI는 틀릴 수 있고, 그 결과는 내가 책임지기 때문입니다.
      - figure:
          kind: ladder
          label: 그림 5-4
          caption: 위험이 클수록 AI는 '참고'로만 쓴다
          steps:
            - { title: 마음껏 써도 돼요, desc: "문자·안내문 쓰기, 요리법, 여행 아이디어" }
            - { title: 핵심만 확인해요, desc: "영업시간, 교통편, 행사 날짜" }
            - { title: 준비용으로 써요, desc: "진료 때 물어볼 질문, 서류 목록, 용어 뜻 알기" }
            - { title: 결정은 전문가와, desc: "약 끊기·바꾸기, 계약, 세금 신고, 투자" }
            - { title: 응급은 바로 119, desc: "가슴 통증, 갑자기 말이 어눌해짐, 심한 출혈 → AI에게 묻지 말고 바로 전화" }
          axis: "아래로 갈수록 위험이 커집니다 ▼"
      - warn:
          title: 응급 상황에서는 AI에게 묻지 마세요.
          body: 가슴 통증, 갑작스러운 마비·말 어눌함, 심한 출혈 같은 증상은 **바로 119**에 전화합니다. AI에게 묻는 동안 시간이 지나갑니다.
      - concept:
          title: AI는 '준비'를, 사람은 '결정'을
          body: 좋은 활용은 "약 바꿔도 돼?"가 아니라 **"의사 선생님께 물어볼 질문을 정리해 줘"**다.

  - type: example
    title: 생활 속 문제를 AI와 함께
    blocks:
      - example:
          no: 1
          title: 긴 공문을 체크리스트로
          level: 1
          q: 박영호 사장님이 구청에서 **4쪽짜리 위생 점검 안내 공문**을 받았습니다. AI로 할 일만 빨리 파악하려면 어떻게 요청하면 좋을까요?
          steps:
            - 공문을 사진으로 찍거나 파일로 **첨부**합니다. (가게 사업자번호 등은 가려도 됩니다.)
            - '"우리 가게가 해야 할 일만 체크리스트로, 마감 날짜를 맨 앞에" 처럼 **기준**을 줍니다.'
            - 결과를 받은 뒤, 마감 날짜와 제출 서류는 **원문에서 다시 확인**합니다.
          answer: 첨부 + 요약 기준("할 일만, 마감일 먼저") + 원문 대조
      - example:
          no: 2
          title: 건강검진 결과로 질문 목록 만들기
          level: 2
          q: 김정숙 님이 건강검진에서 **"공복혈당 경계"** 판정을 받았습니다. 다음 진료 때 의사에게 물어볼 질문을 AI와 준비하려고 합니다. 안전하게 요청하는 방법은?
          steps:
            - 결과지 사진을 통째로 올리지 않고, **이름·주민번호·병원명 없이** 필요한 수치만 입력합니다. 예) "공복혈당 112, 경계 판정"
            - '"이 결과를 쉬운 말로 설명하고, 진료 때 의사에게 물어볼 질문 5개를 정리해 줘"라고 **준비용**으로 요청합니다.'
            - 식단·약에 대한 결정은 진료 때 **의사와 상의**합니다.
          answer: 개인정보 없이 수치만 입력하고, 질문 목록 준비에만 쓴다.
      - similar:
          no: 1
          level: 1
          q: 최민호 씨가 영어로 된 해외 기업 채용 공고를 받았습니다. 지원 자격과 마감일을 빨리 알고 싶을 때 쓸 요청 글을 한 줄로 쓰세요.
          lines: 1
          answer: (예시) 이 채용 공고를 한국어로 번역하되, 지원 자격과 마감일만 먼저 뽑아 줘.
          explain: "채점 포인트: 번역 + 요약 기준(지원 자격, 마감일)을 함께 주었는가"

  - type: exercises
    title: 5단원을 확인해 봅시다
    blocks:
      - exercises:
          items:
            - no: 1
              level: 1
              kind: match
              q: 상황과 가장 알맞은 활용을 이으세요.
              pairs: [[세탁기 표시등 사진의 뜻을 알고 싶다, 계획·정리], [붙여 넣은 긴 공지 글에서 할 일만 알고 싶다, 쓰기], [단체방에 보낼 송년회 공지가 필요하다, 사진으로 묻기], [다음 주 운동 일정을 짜고 싶다, 요약]]
              answer: "ㄱ-③ 사진으로 묻기, ㄴ-④ 요약, ㄷ-② 쓰기, ㄹ-① 계획·정리"
            - no: 2
              level: 2
              kind: mc
              q: 사진을 첨부하기 전에 확인할 일로 **알맞지 않은** 것은?
              choices:
                - 주민번호·주소가 찍혔으면 가린다.
                - 사진에 위치 정보가 저장되는지 확인한다.
                - 궁금한 부분만 확대해 찍는다.
                - 신분증은 정확한 답을 위해 앞뒤 모두 찍어 올린다.
              answer: ④
              explain: 신분증 사진은 어떤 AI에도 올리지 않는다.
            - no: 3
              level: 2
              kind: ox
              q: 맞으면 O, 틀리면 X에 표시하세요.
              statements:
                - AI가 괜찮다고 하면 먹던 혈압약을 끊어도 된다.
                - 진료 때 의사에게 물어볼 질문 목록을 AI로 준비하는 것은 좋은 활용이다.
                - 가슴 통증이 갑자기 생기면 먼저 AI에게 증상을 물어본다.
              answer: (ㄱ) X (ㄴ) O (ㄷ) X
              explain: 약 변경은 의사·약사와 결정하고, 응급 증상은 바로 119에 전화한다.
            - no: 4
              level: 3
              kind: practice
              q: 집에 있는 가전제품 설명서나 공지문 하나를 골라 **사진으로 첨부**하고, "내가 할 일만 3줄로" 요약을 요청해 보세요. 결과에서 원문과 다른 점이 있었는지 쓰세요.
              lines: 2
              answer: (예시) 필터 청소 주기는 맞았지만, 원문에 있던 '전원 끄고 청소' 주의 사항이 빠져 있었다.
              explain: "채점 포인트: 개인정보 없이 첨부했는가, 원문과 대조해 빠진 점을 찾았는가"

  - type: summary
    title: 5단원 정리
    blocks:
      - summary:
          items:
            - 대표 활용은 **쓰기 · 요약 · 번역 · 사진으로 묻기 · 계획·정리**이며, 요청 공식에 내 상황을 채우면 된다.
            - 쓰기는 **받는 사람과 목적**을, 요약은 **줄이는 기준**을 알려 준다. 결과는 보내기 전 확인한다.
            - 사진 첨부 전에는 **가리기 · 위치 정보 · 필요한 부분만** 세 가지를 확인한다.
            - 건강·법률·돈은 **준비용**으로만 쓰고 결정은 전문가와 한다. **응급은 바로 119.**
      - myth:
          items:
            - { myth: AI가 의사보다 정확할 때도 있으니 진단을 맡겨도 된다., truth: AI는 나를 진찰하지 않았고 틀릴 수 있다. 질문 준비에만 쓴다. }
            - { myth: 요약은 원문을 대신할 수 있다., truth: 요약은 빠뜨리는 실수가 잦다. 중요한 날짜·금액은 원문에서 확인한다. }
      - checklist:
          items:
            - 대표 활용 5가지 중 3가지 이상을 직접 해 보았다.
            - 사진을 첨부하기 전 확인할 세 가지를 말할 수 있다.
            - AI를 '참고용'으로만 써야 하는 일을 예로 들 수 있다.

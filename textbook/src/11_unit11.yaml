unit: 11
part: 4
part_title: AI에게 일 맡기기
title: 나만의 AI 작업 루틴
glossary:
  - { term: 맞춤 지침, en: custom instructions, unit: 11, desc: "모든 대화에 적용되도록 미리 적어 두는 나에 대한 설명과 원하는 말투·형식." }
  - { term: 프로젝트, en: project, unit: 11, desc: "한 주제의 자료·지침·대화를 한곳에 모아 두는 작업 공간." }
  - { term: 기억 기능, en: memory, unit: 11, desc: "대화 중 알게 된 내 정보를 다음 대화에서도 기억하는 기능." }
  - { term: 예약 실행, en: scheduled task, unit: 11, desc: "정해 둔 시간마다 에이전트가 스스로 일을 하고 결과를 알려 주는 기능." }
  - { term: 루틴, en: routine, unit: 11, desc: "정해진 때마다 되풀이하는 일의 순서. 여기서는 AI와 함께 하는 반복 업무의 틀." }
pages:
  - type: opener
    subtitle: 매번 처음부터 설명하지 않게, 반복되는 일은 틀로
    goals:
      - "**맞춤 지침 · 프로젝트 · 기억 기능**의 쓰임을 구별할 수 있다."
      - 반복하는 일을 **템플릿과 예약 실행**으로 루틴화할 수 있다.
      - "**루틴 설계표**로 나만의 주간 AI 루틴을 설계할 수 있다."
    why: |
      AI를 오래 쓰는 사람과 금방 그만두는 사람의 차이는 **루틴**입니다. 매주 하는 일을 한 번 잘 짜 두면, 그다음부터는 **빈칸만 바꿔** 맡기면 됩니다.
    hook:
      q: 매주 월요일 아침마다 같은 설명을 반복하고 있지는 않나요?
      figure:
        kind: chat
        input: null
        messages:
          - { who: user, name: 이수진, text: "저는 구청 생활민원팀이고요, 쉬운 말로, 표는 3칸으로… (매주 같은 설명)" }
          - { who: note, text: "↓ 맞춤 지침과 템플릿을 한 번 만들어 두면" }
          - { who: user, name: 이수진, text: "이번 주 민원 요약, 늘 하던 형식으로." }
    keywords: [맞춤 지침, 프로젝트, 기억 기능, 템플릿, 예약 실행, 루틴]
    map: [매번 설명하지 않는 3가지, 템플릿, 예약 실행, 루틴 설계표, 계속 배우는 법]

  - type: concept
    sec: 11-1
    title: 매번 설명하지 않게 하는 세 가지 기능
    blocks:
      - p: 많은 AI 서비스에는 **나를 미리 알려 두는 기능**이 있습니다. 이름은 서비스마다 다르지만 대개 다음 세 가지입니다. 한 번 설정해 두면 매번 같은 설명을 반복하지 않아도 됩니다.
      - table:
          label: 표 11-1
          caption: 매번 설명하지 않게 하는 세 가지 기능 (이름은 서비스마다 다르다)
          widths: [20%, 40%, 40%]
          head: [기능, 하는 일, 예]
          rows:
            - ["**맞춤 지침**", 모든 대화에 적용할 나에 대한 설명·말투·형식, "\"저는 60대예요. 쉬운 말로, 짧게, 중요한 건 굵게 답해 주세요.\""]
            - ["**프로젝트**", "한 주제의 자료·지침·대화를 한곳에 모음", "'빵집 운영' 공간에 메뉴판·가격표·안내문 넣어 두기"]
            - ["**기억 기능**", 대화 중 알게 된 내 정보를 다음에도 기억, "손주 이름, 좋아하는 여행 스타일"]
      - warn:
          title: 기억시키지 말아야 할 것
          body: 건강 상태, 돈 사정, 가족의 개인정보 같은 민감한 내용은 **기억시키지 않습니다.** 설정에서 **기억 목록을 열어 보고**, 원하지 않는 것은 지웁니다.
      - concept:
          title: 지침은 짧고 분명하게
          body: 맞춤 지침에는 **나는 누구인지, 어떻게 답하면 좋은지**만 3~5줄로 쓴다. 너무 길면 오히려 중요한 것이 흐려진다.
    side:
      - note:
          kind: term
          title: 맞춤 지침
          body: 모든 대화에 적용되도록 미리 적어 두는 나에 대한 설명.
      - note:
          kind: tip
          body: 기억 기능이 언제 무엇을 기억했는지 **알림이 뜨는 서비스**도 있습니다. 알림을 무시하지 말고 확인하세요.

  - type: concept
    sec: 11-2
    title: 템플릿 — 잘된 지시문을 다시 쓰기
    blocks:
      - p: 4단원에서 결과가 좋았던 요청 글은 저장해 두라고 했습니다. 9단원의 **심부름 6문** 지시문도 마찬가지입니다. 바뀌는 부분만 **[빈칸]**으로 남겨 두면, 다음부터는 빈칸만 채워 맡기면 됩니다. 이것이 템플릿입니다.
      - prompt:
          label: 템플릿의 예 — 이수진 주무관의 '주간 민원 요약'
          text: |
            **[목표]** [ 날짜 ] 주간 민원 요약 초안을 만들어 줘.
            **[자료]** 첨부한 민원 목록(개인정보 지운 것)
            **[완료 기준]** 1쪽, 유형별 건수 표 + 주요 사례 3개
            **[하지 말 것]** 개인정보 넣지 않기, 없는 숫자 만들지 않기
            **[확인 시점]** 표를 만든 뒤 숫자를 먼저 보여 줘
      - figure:
          kind: flow
          label: 그림 11-1
          caption: 템플릿이 만들어지는 과정
          steps:
            - { title: 처음 맡기기, desc: 6문으로 지시문 쓰기 }
            - { title: 고쳐 묻기, desc: 결과를 보며 다듬기 }
            - { title: 저장, desc: "바뀌는 곳을<br>[빈칸]으로", hl: true }
            - { title: 다시 쓰기, desc: 빈칸만 채워 맡기기 }
      - concept:
          title: 한 번 잘 짜서, 여러 번 쓴다
          body: 템플릿은 **메모장·프로젝트·맞춤 지침** 중 편한 곳에 둔다. 쓸 때마다 조금씩 고치면 점점 좋아진다.
    side:
      - note:
          kind: tip
          body: 템플릿 이름은 **"주간 민원 요약 v2"**처럼 번호를 붙이면 어느 것이 최신인지 헷갈리지 않습니다.

  - type: concept
    sec: 11-3
    title: 예약 실행 — 정해진 때에 스스로 일하기
    blocks:
      - p: 일부 에이전트는 **정해 둔 시간마다 스스로 일하고** 결과를 알려 줍니다. 8단원 계단 그림의 맨 윗단입니다. 매일 아침 날씨와 일정 정리, 매월 1일 지난달 매출 요약처럼 **정기적으로 같은 일**을 할 때 편리합니다.
      - figure:
          kind: timeline
          label: 그림 11-2
          caption: 예약 실행으로 만든 일주일 루틴의 예 (박영호 사장님)
          events:
            - { date: 월 7:00, text: "이번 주 날씨와 행사 일정 요약 → 나에게 알림" }
            - { date: 수 21:00, text: "새 리뷰 모아 답글 초안 → 내가 고쳐서 올림", hl: true }
            - { date: 금 18:00, text: "다음 주 재료 주문 목록 초안 → 내가 확인 후 주문" }
            - { date: 매월 1일, text: "지난달 매출 표 요약 → 나에게만 보고" }
      - warn:
          title: 예약 실행에는 '보기'와 '보고'만
          body: 사람이 지켜보지 않는 시간에 돌아가므로 **보기 권한 위주**로, 결과는 **나에게만 보고**하게 합니다. 보내기·지우기·결제가 들어간 일은 예약 실행하지 않습니다.
      - concept:
          title: 자동화할수록 확인 지점은 '결과 보고'로
          body: 예약 실행의 결과물은 모두 **초안**이다. 실제로 올리고, 보내고, 주문하는 것은 사람이 한다.
    side:
      - note:
          kind: term
          title: 예약 실행
          body: 정해 둔 시간마다 에이전트가 스스로 일하고 결과를 알려 주는 기능.
      - note:
          kind: tip
          body: 처음 만든 예약 작업은 **첫 2~3번 결과를 꼼꼼히 검수**한 뒤 믿고 맡기세요.

  - type: concept
    sec: 11-4
    title: 루틴 설계표 — 나만의 AI 루틴 만들기
    blocks:
      - p: 지금까지 배운 것을 한 장의 표로 모으면 나만의 루틴이 됩니다. **언제, 무슨 일을, 어떤 기능으로, 어떤 권한으로, 내가 무엇을 확인할지**를 칸마다 채웁니다.
      - table:
          label: 표 11-2
          caption: 루틴 설계표 — 이수진 주무관의 예
          widths: [13%, 25%, 21%, 17%, 24%]
          head: [언제, 무슨 일, 어떤 기능, 권한, 내가 확인할 것]
          rows:
            - [월 9시, 지난주 민원 메일 요약, "예약 실행 + 템플릿", 메일 보기, 유형별 건수가 맞는지]
            - [수 오후, 회의 녹음 정리, 프로젝트(회의 자료), 파일 보기·만들기, "결정 사항·담당자·마감일"]
            - [금 16시, 주간 보고서 초안, "템플릿(심부름 6문)", 파일 만들기, "숫자 원본 대조, 개인정보 없음"]
      - concept:
          title: 처음엔 하나만, 작게
          body: 루틴은 **한 가지 일부터** 시작한다. 2주 동안 잘 돌아가면 하나씩 늘린다.
      - tip:
          title: 비용과 사용량도 챙기세요.
          body: 에이전트 작업은 대화보다 **사용량이 훨씬 많이** 듭니다. 유료 요금제의 한도를 확인하고, 꼭 필요한 루틴만 남기세요.
    side:
      - note:
          kind: term
          title: 루틴
          body: 정해진 때마다 되풀이하는 일의 순서.

  - type: concept
    sec: 11-5
    title: 계속 배우는 법
    blocks:
      - p: AI 서비스는 몇 달마다 새 기능이 나오고 이름이 바뀝니다. 다 따라갈 필요는 없습니다. 새 기능을 만나면 **아래 네 가지 질문**을 던지고, **작게 시험해 본 뒤** 쓸지 정하면 됩니다.
      - figure:
          kind: cards
          label: 그림 11-3
          caption: 새 기능을 만났을 때 던지는 네 가지 질문 (AI에게 직접 물어봐도 된다)
          cols: 2
          items:
            - { key: "①", title: "무엇을 할 수 있나?", desc: "이 기능으로 내 일 중 무엇이 쉬워지나" }
            - { key: "②", title: "어떤 권한이 필요한가?", desc: "무엇을 연결하고 어디까지 허락하나" }
            - { key: "③", title: "실수하면 어떻게 되나?", desc: "되돌릴 수 있나, 피해는 누구에게" }
            - { key: "④", title: "멈추고 끄는 방법은?", desc: "정지·연결 해제·삭제는 어디서 하나" }
      - concept:
          title: 작게 시험하고, 검수하고, 늘린다
          body: 새 기능은 **중요하지 않은 일로 먼저** 시험한다. 이 책에서 배운 원리(확인·최소 권한·검수)는 기능이 바뀌어도 그대로다.
    side:
      - note:
          kind: warn
          body: AI와의 대화가 편하다고 **사람과의 만남을 줄이지 마세요.** 외롭거나 힘들 때는 가족·이웃, 상담 전화(109)와 이야기하세요.
      - note:
          kind: tip
          body: 동네 도서관·복지관의 **디지털 배움터** 수업에서 함께 배우면 오래 갑니다.

  - type: example
    title: 루틴 만들기
    blocks:
      - example:
          no: 1
          title: 맞춤 지침 쓰기
          level: 1
          q: 김정숙 님이 대화형 AI에 **맞춤 지침**을 적으려 합니다. 표 11-1을 참고해 3~5줄로 써 보세요.
          steps:
            - "**나는 누구**: 60대 은퇴 교사, 독서 모임 총무"
            - "**어떻게 답할지**: 쉬운 말로, 짧게, 중요한 건 굵게, 표가 필요하면 표로"
            - "**넣지 않을 것**: 주소·건강 정보·가족 실명은 적지 않는다."
          answer: '"저는 60대 은퇴 교사이고 독서 모임 총무예요. 쉬운 말로 짧게 답해 주세요. 중요한 내용은 굵게, 비교할 때는 표로 보여 주세요."'
      - example:
          no: 2
          title: 위험한 예약 작업 고치기
          level: 2
          q: 박영호 사장님이 "매주 수요일 밤, 새 리뷰에 답글을 써서 **바로 올려 줘**"라는 예약 작업을 만들려 합니다. 무엇이 문제이고, 어떻게 바꾸면 좋을까요?
          steps:
            - 사람이 보지 않는 시간에 **올리기(공개 게시)**까지 하게 되어 되돌리기 어렵습니다.
            - 화난 손님의 리뷰에 엉뚱한 답글이 올라가면 가게 평판에 피해가 갑니다.
          answer: '"답글 **초안**을 만들어 나에게 보내 줘"로 바꾸고, 올리기는 사장님이 확인 후 직접 한다.'
      - similar:
          no: 1
          level: 2
          q: 최민호 씨가 매일 아침 받고 싶은 정보가 있습니다. 표 11-2 형식으로 **한 줄짜리 루틴**(언제·무슨 일·기능·권한·확인할 것)을 만들어 보세요.
          lines: 2
          answer: (예시) 매일 8시 / 관심 직무 새 채용 공고 모아 보기 / 예약 실행 + 웹 검색 / 보기만 / 마감일·자격을 공고 원문으로 확인
          explain: "채점 포인트: 다섯 칸을 모두 채웠는가, 권한이 보기 위주인가, 확인할 것이 구체적인가"

  - type: exercises
    title: 11단원을 확인해 봅시다
    blocks:
      - exercises:
          items:
            - no: 1
              level: 1
              kind: match
              q: 기능과 쓰임을 이으세요.
              pairs: [[맞춤 지침, 한 주제의 자료·대화를 한곳에], [프로젝트, 대화 중 알게 된 정보를 다음에도], [기억 기능, 모든 대화에 적용할 나에 대한 설명]]
              answer: "ㄱ-③, ㄴ-①, ㄷ-②"
            - no: 2
              level: 2
              kind: mc
              q: 예약 실행으로 맡기기에 **가장 알맞은** 일은?
              choices: [매일 아침 단골 전체에게 홍보 문자 발송, 매주 월요일 이번 주 일정 요약을 나에게 보고, 매월 1일 거래처에 자동 송금, 매일 밤 오래된 파일 자동 삭제]
              answer: ②
              explain: 보기 권한으로 정보를 모아 나에게만 보고하는 일이 예약 실행에 알맞다. 발송·송금·삭제는 사람이 확인해야 한다.
            - no: 3
              level: 2
              kind: ox
              q: 맞으면 O, 틀리면 X에 표시하세요.
              statements:
                - 기억 기능에는 건강 상태와 통장 잔액도 기억시켜 두면 편리하다.
                - 잘된 지시문은 바뀌는 부분을 빈칸으로 두어 템플릿으로 저장한다.
                - 새 기능은 중요하지 않은 일로 먼저 시험해 본다.
              answer: (ㄱ) X (ㄴ) O (ㄷ) O
            - no: 4
              level: 3
              kind: practice
              q: 표 11-2 형식으로 **나만의 루틴 설계표**를 공책에 만들어 보세요. (최소 2줄, 각 줄에 '내가 확인할 것'을 꼭 쓰기)
              answer: (예시) 월 8시 – 이번 주 병원·모임 일정 정리 – 예약 실행 – 일정 보기 – 날짜·시간 / 목 저녁 – 독서 모임 안내 문자 초안 – 템플릿 – 없음 – 날짜·장소
              explain: "채점 포인트: 권한이 최소인가, 확인할 것이 구체적인가, 발송·결제를 자동으로 맡기지 않았는가"

  - type: summary
    title: 11단원 정리
    blocks:
      - summary:
          items:
            - "**맞춤 지침**(나에 대한 설명), **프로젝트**(주제별 작업 공간), **기억 기능**(다음에도 기억)으로 매번 설명하지 않아도 된다. 민감한 내용은 기억시키지 않는다."
            - 잘된 지시문은 바뀌는 곳을 [빈칸]으로 두어 **템플릿**으로 다시 쓴다.
            - "**예약 실행**은 보기 권한 위주로, 결과는 나에게만 보고하게 한다. 결과물은 모두 초안이다."
            - "**루틴 설계표**(언제·무슨 일·기능·권한·확인할 것)로 하나씩 작게 시작하고, 새 기능은 네 가지 질문으로 따져 본다."
      - myth:
          items:
            - { myth: 자동으로 돌아가면 신경 쓸 필요가 없다., truth: "첫 몇 번은 꼼꼼히 검수하고, 이후에도 결과 보고는 확인한다." }
            - { myth: 새 기능은 나오는 대로 다 써 봐야 뒤처지지 않는다., truth: 필요한 것만 작게 시험한다. 원리는 바뀌지 않는다. }
      - checklist:
          items:
            - 맞춤 지침·프로젝트·기억 기능을 구별할 수 있다.
            - 잘된 지시문을 템플릿으로 만들 수 있다.
            - 나만의 루틴 설계표를 만들었다.

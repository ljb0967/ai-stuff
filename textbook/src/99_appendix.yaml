# 부록: 템플릿 카드 · 안전 수칙과 도움받을 곳 · 서비스 현황 · 용어 사전 · 정답 및 해설
title: 부록
pages:
  - type: front
    title: 부록 A. 한눈에 보는 템플릿 카드
    subtitle: 오려 두거나 사진으로 찍어 두고, 필요할 때 꺼내 쓰세요.
    toc_entry: A. 한눈에 보는 템플릿 카드
    blocks:
      - figure:
          kind: cards
          cols: 2
          items:
            - { key: "4요소", title: 좋은 요청 (4단원), desc: "역할 · 과제 · 맥락 · 형식", ex: '"[역할]로서 [맥락]인 나에게 맞게 [과제]를 [형식]으로 해 줘"' }
            - { key: "6문", title: 일 맡기기 (9단원), desc: "목표 · 배경 · 자료 · 완료 기준 · 하지 말 것 · 확인 시점", ex: "이름표 [목표] [배경]…를 붙여 쓰기" }
            - { key: "3단계", title: 답 확인하기 (6단원), desc: "출처를 달라고 한다 → 원문을 직접 연다 → 다른 곳과 맞춰 본다", ex: "빨강(건강·돈·법)은 전문가 확인까지" }
            - { key: "가명", title: 가명 처리 (7단원), desc: "찾기 → 바꾸기 → 빼기", ex: "'김철수(010-…)' → 'A 고객'" }
            - { key: "승인", title: 승인 전 세 가지 (10단원), desc: "무엇을 · 어디에 · 내가 시킨 일인가", ex: "모르겠으면 거절하고 묻는다" }
            - { key: "실수", title: 실수했을 때 (9단원), desc: "멈추기 → 되돌리기 → 알리기", ex: "원본은 따로, 발송·결제는 사람이" }
            - { key: "검수", title: 결과 검수 (9단원), desc: "다 했나 · 사정에 맞나 · 완료 기준 · 하지 말 것 · 사실 확인 · 내 이름으로 괜찮나" }
            - { key: "새 기능", title: 새 기능 네 가지 질문 (11단원), desc: "무엇을 할 수 있나 · 어떤 권한 · 실수하면 · 멈추는 법" }

  - type: front
    title: 부록 B. 안전 수칙과 도움받을 곳
    toc_entry: B. 안전 수칙과 도움받을 곳
    blocks:
      - table:
          label: 표 B-1
          caption: 도움받을 곳 (2026년 11월 기준. 번호는 바뀔 수 있으니 각 기관 누리집에서 확인)
          widths: [18%, 34%, 48%]
          head: [번호, 기관, 이럴 때]
          rows:
            - ["**112**", 경찰, "보이스피싱·딥보이스 사기 신고, 송금 직후 지급 정지 요청"]
            - ["**1332**", 금융감독원, "금융 사기 상담·신고, 피해 구제 안내"]
            - ["**118**", 한국인터넷진흥원, "개인정보 침해, 해킹, 스팸·악성 문자 상담"]
            - ["**119**", 소방(응급), "가슴 통증·마비·심한 출혈 등 응급 상황 — AI에게 묻지 말고 바로"]
            - ["**02-735-8994**", 디지털성범죄피해자지원센터, "딥페이크 등 디지털 성범죄 피해 상담·삭제 지원"]
            - ["**1577-0199**", 정신건강 상담전화, "마음이 힘들거나 외로울 때 상담"]
            - ["**109**", 자살예방 상담전화, "극단적인 생각이 들 때 24시간 상담"]
      - checklist:
          title: AI 안전 수칙 8가지 — 나는 지키고 있다
          items:
            - 주민번호·계좌·카드·비밀번호·인증번호는 어떤 AI에도 입력하지 않는다.
            - 남의 정보는 가명 처리해서 입력한다.
            - 설정에서 학습 사용·기억 목록·2단계 인증을 확인했다.
            - 숫자·출처는 원문으로 확인하고, 건강·돈·법은 전문가와 결정한다.
            - 가족 목소리로 돈을 요구하면 끊고 내가 다시 건다. 가족 암호를 정해 두었다.
            - 에이전트에게는 최소 권한만 주고, 다 쓴 연결은 해제한다.
            - 승인 요청은 무엇을·어디에·내가 시킨 일인지 보고, 결제·발송은 내가 누른다.
            - AI로 만든 것을 공개할 때는 AI 활용 사실을 밝힌다.

  - type: front
    title: 부록 C. 에이전트 서비스 현황 (2026년 11월 기준)
    toc_entry: C. 에이전트 서비스 현황
    blocks:
      - warn:
          title: 이 표는 금방 낡습니다.
          body: 2026년 11월까지의 보도와 조사를 바탕으로 정리했습니다. 서비스 이름·기능·요금은 **몇 달마다 바뀝니다.** 고를 때는 **8-6의 다섯 가지 기준**으로 직접 확인하세요. 이 책은 특정 서비스를 추천하지 않습니다.
      - table:
          label: 표 C-1
          caption: 주요 대화형 AI·에이전트 서비스 (2026년 11월 기준 공개 정보. 이용자 수는 같은 조사·같은 달 기준)
          widths: [24%, 46%, 30%]
          head: ['서비스 (회사)', '대표적인 에이전트·작업 기능', '국내 월 이용자 (2026.4, 와이즈앱·리테일 앱 조사)']
          rows:
            - ["**ChatGPT** (OpenAI)", "웹 검색, 웹사이트를 대신 조작하는 작업 대행 기능", "약 2,345만 명"]
            - ["**Gemini** (Google)", "구글 메일·문서·일정 연동, 작업 대행 기능", 약 845만 명]
            - ["**Claude** (Anthropic)", "파일·문서 작업 에이전트(Cowork), MCP 커넥터", 약 241만 명]
            - ["**Copilot** (Microsoft)", "문서·표·메일 프로그램과 연동되는 업무용 기능", 이 조사에 없음]
            - ["**국내 서비스** (네이버·카카오·뤼튼 등)", "한국어와 국내 서비스(지도·쇼핑·메신저) 연동", 이 조사에 없음]
            - ["**에이전트 전문 서비스** (여러 회사)", "여러 하위 에이전트를 함께 돌려 보고서·자료를 완성", 이 조사에 없음]
      - info:
          title: 고르는 순서
          body: |
            1. 내가 맡길 일을 먼저 정한다. (8단원 위임 판단표)
            2. 그 일에 필요한 도구가 있는 서비스를 2~3개 고른다.
            3. 무료로 같은 일을 시켜 보고, 확인 절차·권한 관리·사용량을 비교한다.


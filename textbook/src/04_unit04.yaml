unit: 4
part: 2
part_title: AI와 대화하기
title: "잘 묻는 법: 프롬프트 기본기"
glossary:
  - { term: 프롬프트, en: prompt, unit: 4, desc: "AI에게 하는 요청 글. 질문·지시·참고 자료를 모두 포함한다." }
  - { term: 고쳐 묻기, en: iteration, unit: 4, desc: "결과에서 마음에 들지 않는 점을 짚어 말해 주며 대화로 결과를 다듬는 방법." }
  - { term: 맥락, en: context, unit: 4, desc: "AI가 모르는 나의 사정·배경 정보. 맥락이 많을수록 원하는 답에 가까워진다." }
pages:
  - type: opener
    subtitle: 같은 AI라도 묻는 방법에 따라 결과가 달라집니다
    goals:
      - 좋은 요청의 **4요소**(역할·과제·맥락·형식)를 말할 수 있다.
      - 막연한 질문을 4요소를 넣어 **구체적인 요청으로 바꿀 수 있다.**
      - 결과가 마음에 들지 않을 때 **고쳐 묻는 방법 3가지**를 쓸 수 있다.
    why: |
      AI는 **내 사정을 모릅니다.** 알려 준 만큼만 맞춰 줍니다. 잘 묻는 법은 4부에서 에이전트에게 일을 맡길 때도 그대로 쓰는 **가장 중요한 기본기**입니다.
    hook:
      q: 두 사람이 같은 AI에게 여행 계획을 물었습니다. 누가 더 쓸모 있는 답을 받았을까요?
      figure:
        kind: compare
        left:
          title: "A의 질문"
          body: "“제주도 여행 계획 짜 줘.”"
          verdict: → 누구에게나 맞는 평범한 일정
        right:
          title: "B의 질문"
          body: "“60대 부부, 무릎이 안 좋아요. 11월 제주 3박 4일, 하루 이동 2시간 이내로 날짜별 표로 짜 줘.”"
          verdict: → 우리 부부에게 딱 맞는 일정
    keywords: [프롬프트, 역할, 과제, 맥락, 형식, 고쳐 묻기]
    map: [4요소, 막연한 질문 vs 구체적인 질문, 더 잘 묻는 기술, 고쳐 묻기]

  - type: concept
    sec: 04-1
    title: 좋은 요청의 4요소
    blocks:
      - p: AI에게 하는 요청 글을 **프롬프트**라고 합니다. 좋은 프롬프트에는 대개 네 가지가 들어 있습니다. 어떤 입장으로 답할지(**역할**), 무엇을 해 달라는지(**과제**), AI가 모르는 내 사정(**맥락**), 결과의 모양(**형식**)입니다.
      - figure:
          kind: decompose
          label: 그림 4-1
          caption: 한 문장의 요청을 4요소로 나누어 본 모습
          segments:
            - { tag: role, text: "여행 전문가로서" }
            - { tag: ctx, text: " 무릎이 안 좋은 60대 부부가 11월에 가는" }
            - { tag: task, text: " 제주 3박 4일 일정을 짜 주세요." }
            - { tag: fmt, text: " 날짜별 표로, 하루 이동은 2시간 이내로 해 주세요." }
          legend: [[role, 역할], [task, 과제], [ctx, 맥락], [fmt, 형식]]
      - table:
          label: 표 4-1
          caption: 좋은 요청의 4요소
          widths: [16%, 42%, 42%]
          head: ['요소', '묻는 것', '예']
          rows:
            - - '**역할**'
              - '누구의 입장에서 답할까?'
              - '여행 전문가로서 / 친절한 도서관 사서처럼'
            - - '**과제**'
              - '무엇을 해 줄까? (동사로)'
              - '일정을 짜 줘 / 요약해 줘 / 고쳐 줘'
            - - '**맥락**'
              - 'AI가 모르는 내 사정은?'
              - '60대 부부, 무릎이 안 좋음, 11월'
            - - '**형식**'
              - '결과는 어떤 모양으로?'
              - '날짜별 표, 5줄 이내, 존댓말'
      - concept:
          title: 네 가지를 다 넣지 않아도 됩니다
          body: 과제만 있는 질문에 **맥락과 형식만 더해도** 결과가 크게 달라진다. 역할은 필요할 때 더한다.
    side:
      - note:
          kind: term
          title: 프롬프트 (prompt)
          body: AI에게 하는 요청 글. '재촉하다, 일깨우다'라는 뜻의 영어에서 왔다.
      - note:
          kind: tip
          body: 맥락은 **"AI는 나를 처음 만난 사람"**이라고 생각하고 쓰면 쉽습니다.

  - type: concept
    sec: 04-2
    title: 막연한 질문 vs 구체적인 질문
    blocks:
      - p: 막연하게 물으면 AI는 **가장 흔하고 평범한 답**을 내놓습니다. 2단원에서 배운 것처럼, AI는 "그럴듯한" 말을 고르기 때문입니다. 내 사정을 알려 주면 그때부터 **나에게 맞는 답**이 나옵니다.
      - figure:
          kind: compare
          label: 그림 4-2
          caption: 같은 일, 다른 질문. 맥락과 형식을 더하면 바로 쓸 수 있는 결과가 나온다.
          left:
            title: 막연한 질문
            chat:
              - { who: user, text: "리뷰 답글 써 줘." }
              - { who: ai, text: "소중한 리뷰 감사합니다! 앞으로도 더 좋은 서비스로 보답하겠습니다…" }
            verdict: 어느 가게에나 붙일 수 있는 답글
          right:
            title: 구체적인 질문
            chat:
              - { who: user, text: "동네 빵집 사장으로서, 소금빵이 짜다는 별 3개 리뷰에 답글을 써 줘. 사과하고, 다음 주부터 덜 짜게 바꾼다고 알려 줘. 3문장, 다정하게." }
              - { who: ai, text: "솔직한 말씀 감사합니다. 소금빵이 짜게 느껴지셨다니 죄송해요. 다음 주부터 소금을 줄여 굽겠습니다…" }
            verdict: 바로 올릴 수 있는 답글
      - concept:
          title: AI는 알려 준 만큼만 맞춰 준다
          body: 결과가 평범하다면 AI 탓이 아니라 **맥락이 부족한 것**일 때가 많다. "누가, 왜, 어디에 쓸 것인지"를 한 줄 더한다.
    side:
      - note:
          kind: tip
          body: 질문을 쓰고 보내기 전에 **"이 글만 보고 처음 만난 사람이 내 사정을 알까?"** 하고 스스로 물어보세요.
      - note:
          kind: warn
          body: 맥락을 줄 때도 **남의 실명·연락처는 빼고** 씁니다. "단골손님 A"처럼 바꿔 쓰세요.

  - type: concept
    sec: 04-3
    title: 더 잘 묻는 기술 네 가지
    blocks:
      - p: 4요소에 익숙해지면, 다음 네 가지 기술을 더해 보세요. 특히 **④ 되묻게 하기**는 무엇을 알려 줘야 할지 모를 때 큰 도움이 됩니다.
      - figure:
          kind: cards
          label: 그림 4-3
          caption: 더 잘 묻는 기술 네 가지
          cols: 2
          items:
            - { key: "①", title: 구체적으로, desc: '"좋은 글" 대신 기준을 숫자·대상으로', ex: '"초등 3학년이 알아듣게, 5문장으로"' }
            - { key: "②", title: 예시 보여 주기, desc: 원하는 느낌의 예를 붙여 준다, ex: '"이런 말투로 써 줘: (작년 안내문 붙여 넣기)"' }
            - { key: "③", title: 단계 나누기, desc: 큰 일은 한 번에 시키지 않는다, ex: '"먼저 목차만 → 마음에 들면 1장"' }
            - { key: "④", title: 되묻게 하기, desc: 필요한 정보를 AI가 먼저 묻게 한다, ex: '"더 좋은 답을 위해 필요한 것이 있으면 먼저 질문해 줘"' }
      - concept:
          title: 모르겠으면 AI에게 물어보게 하세요
          body: "**\"시작하기 전에 나에게 필요한 질문을 3개 해 줘\"** 한 줄만 붙여도, AI가 맥락을 스스로 모은다."
    side:
      - note:
          kind: tip
          body: 예시를 붙일 때는 **내가 쓴 글**이나 공개된 글만 씁니다. 남의 글을 통째로 넣어 베끼게 하지 마세요. (7단원)
      - note:
          kind: fact
          body: 단계 나누기는 4부에서 에이전트가 일하는 방식(계획 → 실행)과 같습니다.

  - type: concept
    sec: 04-4
    title: 고쳐 묻기 — 대화로 다듬기
    blocks:
      - p: 첫 답이 마음에 들지 않아도 처음부터 다시 쓸 필요가 없습니다. **무엇이 마음에 들지 않는지 짚어 말해 주면** AI가 고쳐 줍니다. 사람에게 심부름을 시키고 "이건 이렇게 바꿔 줘요" 하는 것과 같습니다.
      - table:
          label: 표 4-2
          caption: 상황별 고쳐 묻기 표현
          widths: [30%, 70%]
          head: [이럴 때, 이렇게 말해요]
          rows:
            - - '너무 길다'
              - '"절반 길이로 줄여 줘" / "3줄로 요약해 줘"'
            - - '말투가 딱딱하다'
              - '"친구에게 말하듯 다정하게" / "존댓말은 유지하고 부드럽게"'
            - - '어려운 말이 많다'
              - '"중학생도 알아듣게 쉬운 말로"'
            - - '일부만 바꾸고 싶다'
              - '"두 번째 문단만 다시 써 줘. 나머지는 그대로"'
            - - '방향이 틀렸다'
              - '"내가 원한 건 ○○이야. ○○ 중심으로 다시"'
      - tip:
          title: 나만의 프롬프트 노트를 만드세요.
          body: 결과가 좋았던 요청 글은 휴대폰 메모장에 **복사해 두고** 다음에 빈칸만 바꿔 다시 씁니다. 11단원에서 배우는 '루틴'의 출발점입니다.
      - concept:
          title: 고쳐 묻기가 기본 사용법
          body: 한 번에 완벽한 답을 받는 사람은 드물다. **두세 번 고쳐 묻는 것이 정상**이며, 그 과정에서 원하는 결과에 가까워진다.
    side:
      - note:
          kind: term
          title: 고쳐 묻기
          body: 결과에서 고칠 점을 짚어 말하며 대화로 다듬는 방법.
      - note:
          kind: warn
          body: 다듬다가 대화가 아주 길어지면 앞 조건을 놓칠 수 있습니다. 조건을 정리해 **새 대화**를 여세요. (2단원)

  - type: example
    title: 4요소로 바꾸고, 고쳐 묻기
    blocks:
      - example:
          no: 1
          title: 막연한 질문을 4요소로
          level: 2
          q: 김정숙 님은 독서 모임 회원 8명에게 보낼 **12월 모임 안내 문자**를 만들고 싶습니다. "모임 안내 문자 써 줘"를 4요소가 들어간 요청으로 바꿔 보세요.
          steps:
            - "**역할**: 친절한 모임 총무로서"
            - "**과제**: 12월 독서 모임 안내 문자를 써 주세요."
            - "**맥락**: 회원은 60~70대 8명, 12월 12일(토) 오후 2시, ○○도서관 2층, 책은 『작별하지 않는다』"
            - "**형식**: 휴대폰 문자로 5줄 이내, 날짜·장소는 줄을 바꿔 눈에 띄게"
          answer: 친절한 모임 총무로서, 60~70대 회원 8명에게 보낼 12월 12일(토) 오후 2시 ○○도서관 2층 독서 모임 안내 문자를 5줄 이내로 써 주세요. 날짜와 장소는 줄을 바꿔 눈에 띄게 해 주세요.
      - example:
          no: 2
          title: 고쳐 묻기 두 번
          level: 2
          q: 박영호 사장님이 받은 리뷰 답글 초안이 **너무 길고 딱딱했습니다.** 어떻게 고쳐 물으면 좋을까요? 두 번에 나누어 써 보세요.
          steps:
            - '1차: "절반 길이로 줄여 주세요."'
            - '2차: "존댓말은 유지하되, 동네 단골에게 말하듯 따뜻하게 바꿔 주세요."'
          answer: 길이와 말투를 하나씩 짚어 고쳐 묻는다.
          memo: 한 번에 여러 가지를 고치기보다 **하나씩** 고치면 원하는 방향을 잡기 쉽습니다.
      - similar:
          no: 1
          level: 2
          q: 이수진 주무관의 요청 "회의록 정리해 줘"에 빠진 요소를 두 가지 이상 채워 다시 써 보세요.
          lines: 2
          answer: (예시) 구청 행정직원으로서, 아래 회의 메모를 결정 사항·담당자·마감일 세 칸짜리 표로 정리해 줘.
          explain: "채점 포인트: 맥락(어떤 회의 메모인지), 형식(표, 칸 구성) 중 두 가지 이상이 들어갔는가"

  - type: exercises
    title: 4단원을 확인해 봅시다
    blocks:
      - exercises:
          items:
            - no: 1
              level: 1
              kind: match
              q: 요청 글의 부분과 요소를 이으세요.
              pairs: [["\"여행 안내원처럼\"", 형식], ["\"표로 정리해 줘\"", 맥락], ["\"무릎이 안 좋은 부모님과 가요\"", 역할], ["\"1박 2일 일정을 짜 줘\"", 과제]]
              answer: "ㄱ-③ 역할, ㄴ-① 형식, ㄷ-② 맥락, ㄹ-④ 과제"
            - no: 2
              level: 2
              kind: mc
              q: '"손주 생일 선물 추천해 줘"에 **맥락**을 더한 것으로 알맞은 것은?'
              cols: 2
              choices:
                - 선물 전문가로서 추천해 줘.
                - 표로 정리해 줘.
                - 공룡 좋아하는 8살, 예산 3만 원이야.
                - 빨리 알려 줘.
              answer: ③
              explain: ①은 역할, ②는 형식이다. 맥락은 AI가 모르는 내 사정(나이, 취향, 예산)이다.
            - no: 3
              level: 2
              kind: ox
              q: 맞으면 O, 틀리면 X에 표시하세요.
              statements:
                - 좋은 프롬프트에는 반드시 4요소가 모두 들어가야 한다.
                - 결과가 마음에 들지 않으면 무엇이 별로인지 짚어 말해 주는 것이 좋다.
                - 무엇을 알려 줘야 할지 모르겠으면 AI에게 먼저 질문해 달라고 할 수 있다.
              answer: (ㄱ) X (ㄴ) O (ㄷ) O
              explain: 4요소가 모두 필요하지는 않다. 맥락과 형식만 더해도 결과가 크게 좋아진다.
            - no: 4
              level: 3
              kind: essay
              q: 최민호 씨가 받은 자기소개서 첨삭 결과에 **어려운 한자어가 너무 많았습니다.** 고쳐 묻는 문장을 한 줄로 쓰세요.
              lines: 1
              answer: (예시) 내용은 그대로 두고, 어려운 한자어를 쉬운 우리말로 바꿔 다시 써 줘.
              explain: "채점 포인트: 고칠 점(어려운 말)과 유지할 점(내용)을 함께 짚었는가"
            - no: 5
              level: 3
              kind: practice
              q: 내 관심사(취미·건강·일) 하나를 골라 **4요소가 모두 들어간 요청 글**을 공책에 쓰고, AI에게 실제로 보내 보세요.
              answer: (예시) 운동 코치로서, 무릎이 약한 60대가 집에서 할 수 있는 10분 운동을 요일별 표로 짜 주세요.
              explain: "채점 포인트: 역할·과제·맥락·형식이 모두 들어갔는가, 실제로 보내 결과를 받았는가"

  - type: summary
    title: 4단원 정리
    blocks:
      - summary:
          items:
            - AI에게 하는 요청 글을 **프롬프트**라고 하며, 좋은 프롬프트의 4요소는 **역할 · 과제 · 맥락 · 형식**이다.
            - AI는 내 사정을 모르므로 **맥락과 형식**만 더해도 결과가 크게 달라진다.
            - 더 잘 묻는 기술은 **구체적으로 · 예시 보여 주기 · 단계 나누기 · 되묻게 하기**다.
            - 결과가 별로면 **무엇이 별로인지 짚어** 고쳐 묻는다. 좋은 요청 글은 저장해 다시 쓴다.
      - myth:
          items:
            - { myth: 질문은 짧을수록 좋다., truth: 맥락이 많을수록 원하는 답에 가깝다. }
            - { myth: 특별한 주문(마법의 문장)을 외워야 잘 쓴다., truth: 사람에게 부탁하듯 사정과 원하는 모양을 알려 주면 된다. }
            - { myth: 첫 답이 별로면 그 AI는 쓸모없다., truth: 두세 번 고쳐 묻는 것이 정상적인 사용법이다. }
      - checklist:
          items:
            - 좋은 요청의 4요소를 말할 수 있다.
            - 막연한 질문을 4요소를 넣어 바꿔 쓸 수 있다.
            - 결과가 마음에 들지 않을 때 고쳐 묻는 표현을 3가지 쓸 수 있다.

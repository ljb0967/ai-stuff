  - type: summary
    title: 9단원 정리
    blocks:
      - summary:
          items:
            - "**심부름 6문**: 목표 · 배경 · 자료 · 완료 기준 · 하지 말 것 · 확인 시점. 이름표를 붙여 쓰면 빠진 것이 보인다."
            - 막연한 지시는 에이전트가 빈칸을 **짐작**으로 채우게 한다. 좋은 지시는 짐작을 줄인다.
            - "**작업 기록**을 지켜보고, 이상하면 **멈추기 → 되돌리기 → 알리기.** 원본은 따로, 발송·결제는 사람이."
            - 결과는 **검수 체크리스트**로 점검한다. 내보내는 순간 **책임은 맡긴 사람**에게 있다.
      - myth:
          items:
            - { myth: 지시는 짧을수록 에이전트가 알아서 잘한다., truth: 짧을수록 짐작이 늘어난다. 6문으로 범위를 정해 준다. }
            - { myth: 에이전트가 일하는 동안 지켜볼 필요가 없다., truth: 처음에는 작업 기록을 지켜보며 일하는 방식을 익힌다. }
      - checklist:
          items:
            - 심부름 6문을 넣어 지시문을 쓸 수 있다.
            - 작업 기록에서 문제를 찾아 멈추고 바로잡을 수 있다.
            - 검수 체크리스트로 결과를 점검할 수 있다.

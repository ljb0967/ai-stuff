unit: 9
part: 4
part_title: AI에게 일 맡기기
title: "일 맡기는 글: 심부름 6문"
glossary:
  - { term: 심부름 6문, en: delegation brief, unit: 9, desc: "에이전트에게 일을 맡길 때 알려 줄 여섯 가지: 목표·배경·자료·완료 기준·하지 말 것·확인 시점." }
  - { term: 작업 기록, en: activity log, unit: 9, desc: "에이전트가 무엇을 했는지 순서대로 보여 주는 진행 기록." }
  - { term: 검수, en: review, unit: 9, desc: "맡긴 일의 결과가 목표·조건에 맞는지, 사실이 맞는지 점검하는 것." }
pages:
  - type: opener
    subtitle: 심부름을 잘 시키는 사람이 에이전트도 잘 쓴다
    goals:
      - "**심부름 6문**(목표·배경·자료·완료 기준·하지 말 것·확인 시점)을 넣어 지시문을 쓸 수 있다."
      - 에이전트의 **작업 기록**을 읽고, 중간에 **멈추고 바로잡을 수** 있다.
      - "**검수 체크리스트**로 결과물을 점검할 수 있다."
    why: |
      에이전트는 내가 써 준 지시문을 **설명서 삼아** 혼자 여러 단계를 진행합니다. 지시문이 엉성하면 엉뚱한 방향으로 한참을 가 버립니다. **잘 맡기는 글**이 곧 에이전트 활용의 실력입니다.
    hook:
      q: 아이에게 처음 심부름을 보낼 때, 무엇을 알려 주나요?
      figure:
        kind: chat
        title: 심부름 보내기
        input: null
        messages:
          - { who: user, name: 엄마, text: "두부 한 모 사 와. **찌개용**으로. 동네 마트에서 **3천 원 안쪽**으로. **없으면 전화**하고, 과자는 사지 마!" }
          - { who: note, text: "무엇을 · 왜 · 어디서 · 얼마까지 · 하지 말 것 · 언제 연락할지 — 에이전트에게도 똑같이 알려 주면 됩니다." }
    keywords: [심부름 6문, 완료 기준, 하지 말 것, 확인 시점, 작업 기록, 검수]
    map: [심부름 6문, 나쁜 지시 vs 좋은 지시, 진행 지켜보기, 멈추고 되돌리기, 검수]

  - type: concept
    sec: 09-1
    title: 4요소에서 심부름 6문으로
    blocks:
      - p: 4단원의 4요소(역할·과제·맥락·형식)는 **한 번의 답**을 잘 받는 방법이었습니다. 에이전트는 혼자 여러 단계를 진행하므로, 여기에 **어디까지 하면 끝인지, 하지 말 것, 언제 나에게 물을지**를 더해야 합니다.
      - figure:
          kind: cards
          label: 그림 9-1
          caption: "심부름 6문. 박영호 사장님의 10주년 이벤트 안내문을 예로 들었다."
          cols: 3
          items:
            - { key: "1 목표", title: "무엇을 끝내 주길?", desc: 결과물이 무엇인지, ex: 10주년 이벤트 안내문 시안 3종 }
            - { key: "2 배경", title: "AI가 모르는 사정은?", desc: 누구를 위해 왜 하는지, ex: "동네 빵집, 단골은 50~60대" }
            - { key: "3 자료", title: "무엇을 참고할까?", desc: 파일·사진·링크, ex: "작년 안내문, 메뉴판 사진" }
            - { key: "4 완료 기준", title: "언제 '다 됐다'?", desc: 분량·모양·수준, ex: "A4 한 장, 큰 글씨, 가격표 포함" }
            - { key: "5 하지 말 것", title: "넘으면 안 되는 선은?", desc: 금지 행동·한도, ex: "할인 최대 20%, 개인정보 금지" }
            - { key: "6 확인 시점", title: "언제 나에게 물을까?", desc: 승인받을 순간, ex: "시안 고르기 전, 인쇄 주문 전" }
      - concept:
          title: 심부름 6문
          body: "**목표 · 배경 · 자료 · 완료 기준 · 하지 말 것 · 확인 시점.** 앞의 셋은 '무엇을', 뒤의 셋은 '어디까지·어떻게 안전하게'를 정한다."
    side:
      - note:
          kind: term
          title: 완료 기준
          body: 어떤 상태가 되면 일이 끝난 것인지 정한 기준. 에이전트가 멈출 곳을 알려 준다.
      - note:
          kind: tip
          body: 6가지를 다 못 채워도 괜찮습니다. 그럴 땐 **"시작 전에 빠진 정보를 나에게 물어봐 줘"**라고 덧붙이세요.

  - type: concept
    sec: 09-2
    title: 나쁜 지시 vs 좋은 지시
    blocks:
      - p: 막연한 지시를 받은 에이전트는 빈칸을 **스스로 채웁니다.** 그 빈칸을 그럴듯하게 채운 결과가 엉뚱한 일일 수 있습니다. 6문을 채운 지시는 에이전트가 길을 잃지 않게 해 줍니다.
      - figure:
          kind: compare
          label: 그림 9-2
          caption: 같은 일, 다른 지시. 왼쪽은 에이전트가 무엇을, 어디에, 얼마나 할지 마음대로 정하게 된다.
          left:
            title: "❌ 나쁜 지시"
            body: |
              "가게 홍보 좀 해 줘."
            items: ['어디에? (전단지? 온라인?)', '얼마나? 언제까지?', '할인은 몇 %까지?', '올리기 전에 물어볼까?']
            verdict: → 엉뚱한 할인율로 게시글을 올릴 수도
          right:
            title: "✅ 좋은 지시"
            body: |
              "**[목표]** 10주년 이벤트 안내문 시안 3종을 만들어 줘. **[배경]** 동네 빵집이고 단골은 50~60대야. **[자료]** 첨부한 작년 안내문과 메뉴판을 참고해. **[완료 기준]** A4 한 장, 큰 글씨, 가격표 포함. **[하지 말 것]** 할인은 최대 20%, 고객 이름·연락처는 넣지 마. **[확인 시점]** 시안 3개가 나오면 나에게 먼저 보여 줘."
            verdict: → 내가 고르고, 내가 인쇄한다
      - concept:
          title: 에이전트는 빈칸을 스스로 채운다
          body: 지시가 막연할수록 에이전트의 '짐작'이 많아진다. **짐작을 줄이는 것**이 좋은 지시다.
    side:
      - note:
          kind: tip
          body: 좋은 지시문은 **[목표] [배경]…처럼 이름표를 붙여** 쓰면 빠진 것이 잘 보입니다.
      - note:
          kind: warn
          body: '**"알아서 다 해 줘"**는 위험한 말입니다. 돈·발송·삭제가 걸린 일에는 반드시 **하지 말 것**과 **확인 시점**을 적습니다.'

  - type: concept
    sec: 09-3
    title: 진행 지켜보기 — 작업 기록 읽기
    blocks:
      - p: 에이전트 화면에는 보통 **할 일 목록**(계획)과 **진행 기록**(지금 하는 일)이 보입니다. 에이전트가 일하는 동안 다른 일을 해도 되지만, 처음 몇 번은 **기록을 지켜보며** 에이전트의 일하는 방식을 익히세요.
      - figure:
          kind: agentlog
          label: 그림 9-3
          caption: 에이전트 작업 화면의 예(여러 서비스의 공통 모양을 정리한 그림). 빨간 줄은 '하지 말 것'을 어긴 기록이다.
          goal: 10주년 이벤트 안내문 시안 3종 (할인 최대 20%)
          plan:
            - { text: 작년 안내문·메뉴판 읽기, state: done }
            - { text: 시안 1 만들기, state: done }
            - { text: 시안 2 만들기, state: doing }
            - { text: 시안 3 만들기 }
            - { text: 사장님께 보여 드리기 }
          log:
            - "첨부 파일 2개 읽는 중… 완료"
            - "시안 1: '10년의 감사' 문구로 작성"
            - { text: "시안 2: '전 품목 30% 할인' 문구로 작성 중", hl: true }
          ask: 시안 2의 제목을 '10주년 감사 축제'로 해도 될까요?
      - p: 이상한 기록이 보이면 **■ 멈추기**를 누르고 바로잡습니다. "할인은 20%를 넘으면 안 돼요. 시안 2를 다시 만들어 주세요." 에이전트가 질문하면 성실히 답해 주세요. 특히 결제·발송·삭제 같은 **중요한 행동 전에 묻는 질문이 확인 지점**입니다.
    side:
      - note:
          kind: term
          title: 작업 기록
          body: 에이전트가 한 일을 순서대로 보여 주는 기록. '진행 상황', '활동' 등으로 표시된다.
      - note:
          kind: tip
          body: 기록에서 **숫자·이름·보내기·결제** 같은 낱말이 보이면 특히 주의 깊게 보세요.

  - type: concept
    sec: 09-4
    title: 멈추기 · 되돌리기 · 알리기
    blocks:
      - p: 에이전트도 실수합니다. 중요한 것은 실수했을 때 **피해를 작게 막는 순서**를 아는 것입니다. 당황하지 말고 다음 세 단계를 따르세요.
      - figure:
          kind: flow
          label: 그림 9-4
          caption: 에이전트가 실수했을 때의 3단계
          steps:
            - { title: ■ 멈추기, desc: "정지 버튼을 눌러<br>더 진행하지 않게" }
            - { title: ↺ 되돌리기, desc: "보낸 메일 취소, 원본 복구,<br>예약 취소 시도", hl: true }
            - { title: 📢 알리기, desc: "피해가 남에게 갔다면<br>받은 사람·회사에 알림" }
      - table:
          label: 표 9-1
          caption: 실수 유형별 되돌리기 방법
          widths: [30%, 70%]
          head: [이런 실수, 이렇게 되돌려요]
          rows:
            - [잘못된 메일·문자 발송, "메일의 '보내기 취소'는 보낸 직후 짧은 시간 안에만 된다. 문자는 대부분 취소가 안 되므로 정정 문자를 보낸다"]
            - [파일을 지우거나 덮어씀, "휴지통·'이전 버전'에서 복구한다. 그래서 **원본은 따로 두고 복사본으로** 맡긴다"]
            - [잘못된 예약·주문, "업체 고객센터에 바로 연락한다. 결제는 처음부터 사람이 한다"]
            - [개인정보가 새어 나감, "비밀번호 변경, 연결 해제(10단원), 필요하면 118(한국인터넷진흥원) 상담"]
      - concept:
          title: 미리 막는 것이 최고의 되돌리기
          body: "**원본은 따로 두고, 발송·결제는 사람이** 하면 대부분의 실수는 되돌릴 수 있다."

  - type: concept
    sec: 09-5
    title: 결과 검수 — 맡긴 사람의 마지막 일
    blocks:
      - p: 에이전트가 "완료했습니다"라고 해도 일은 끝나지 않았습니다. 결과물이 **내 이름으로 나가기 전에** 맡긴 사람이 검수해야 합니다. 아래 체크리스트를 쓰면 빠뜨리는 것이 없습니다.
      - table:
          label: 표 9-2
          caption: 검수 체크리스트 (6문과 짝을 이룬다)
          widths: [8%, 62%, 30%]
          head: ['✔', '확인할 것', '짝이 되는 것']
          rows:
            - ['☐', '맡긴 일을 **다** 했는가? (3종 모두?)', '목표']
            - ['☐', '내 사정(대상·목적)에 맞는가?', '배경']
            - ['☐', '준 자료를 빠뜨리거나 바꾸지 않았는가?', '자료']
            - ['☐', '완료 기준(분량·모양)을 지켰는가?', '완료 기준']
            - ['☐', '하지 말 것을 어기지 않았는가?', '하지 말 것']
            - ['☐', '정한 때에 나에게 물었는가?', '확인 시점']
            - ['☐', '숫자·날짜·이름·출처가 맞는가?', '6단원 3단계 확인']
            - ['☐', '내 이름으로 내보내도 부끄럽지 않은가?', '최종 책임']
      - concept:
          title: 최종 책임은 맡긴 사람에게
          body: 에이전트가 만든 결과라도 **보내고, 올리고, 제출하는 순간 내 것**이 된다. 검수는 건너뛸 수 없는 단계다.
    side:
      - note:
          kind: term
          title: 검수
          body: 결과가 목표·조건에 맞는지, 사실이 맞는지 점검하는 일.
      - note:
          kind: tip
          body: '검수할 때 에이전트에게 **"내 지시의 6문과 결과를 비교해 지키지 못한 점을 알려 줘"**라고 해 보세요. 최종 판단은 내가 합니다.'

  - type: example
    title: 잘 맡기고, 잘 지켜보기
    blocks:
      - example:
          no: 1
          title: 막연한 지시를 6문으로
          level: 2
          q: 이수진 주무관이 에이전트에게 "주간 보고서 좀 써 줘"라고 하려다 멈췄습니다. 심부름 6문을 채운 지시문으로 바꿔 보세요.
          steps:
            - "**목표**: 이번 주 민원 처리 현황 주간 보고서 초안"
            - "**배경**: 구청 생활민원팀, 월요일 팀 회의에서 보고"
            - "**자료**: 첨부한 민원 목록 표(이름·연락처 지운 것)"
            - "**완료 기준**: 1쪽, 유형별 건수 표 + 주요 사례 3개 요약"
            - "**하지 말 것**: 민원인 개인정보 넣지 않기, 없는 숫자 만들지 않기"
            - "**확인 시점**: 표를 만든 뒤 숫자를 먼저 보여 주기"
          answer: 위 6가지를 이름표를 붙여 한 지시문으로 쓴다.
      - example:
          no: 2
          title: 작업 기록에서 문제 찾기
          level: 2
          q: 그림 9-3의 작업 기록에서 문제가 있는 줄을 찾고, 어떻게 해야 하는지 쓰세요.
          steps:
            - "'전 품목 30% 할인'은 **하지 말 것(최대 20%)**을 어긴 내용입니다."
            - "■ 멈추기를 누르고 '할인은 20%를 넘으면 안 돼요. 시안 2를 다시 만들어 주세요'라고 바로잡습니다."
          answer: 시안 2의 30% 할인 줄. 멈추고 조건을 다시 알려 준다.
      - similar:
          no: 1
          level: 2
          q: 최민호 씨가 에이전트에게 "관심 기업 채용 동향 조사"를 맡기려 합니다. 6문 중 **하지 말 것**과 **확인 시점**을 하나씩 써 보세요.
          lines: 2
          answer: (예시) 하지 말 것 – 출처 없는 숫자를 쓰지 않기, 지원서를 대신 제출하지 않기 / 확인 시점 – 조사할 기업 목록을 정한 뒤
          explain: "채점 포인트: 하지 말 것은 넘으면 안 되는 선, 확인 시점은 에이전트가 멈추고 물어야 할 순간으로 썼는가"

  - type: exercises
    title: 9단원을 확인해 봅시다
    blocks:
      - exercises:
          items:
            - no: 1
              level: 1
              kind: short
              q: "심부름 6문을 쓰세요. 목표 · (( 배경 )) · 자료 · (( 완료 기준 )) · 하지 말 것 · (( 확인 시점 ))"
              answer: 배경, 완료 기준, 확인 시점
            - no: 2
              level: 2
              kind: match
              q: 지시문의 부분과 6문을 이으세요.
              pairs: [["\"표를 만든 뒤 나에게 먼저 보여 줘\"", 하지 말 것], ["\"할인은 최대 20%\"", 완료 기준], ["\"A4 한 장, 큰 글씨\"", 확인 시점]]

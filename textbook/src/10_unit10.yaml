  - type: summary
    title: 10단원 정리
    blocks:
      - summary:
          items:
            - "**커넥터**는 AI와 서비스를 잇는 다리, **MCP**는 그 연결 방식을 하나로 맞춘 공통 규격이다. 연결하면 AI의 손이 그 정보에 닿는다."
            - "**권한 사다리**: 보기 → 만들기 → 보내기·공유 → 지우기·바꾸기 → 결제·송금. 아래로 갈수록 위험하다. 보기도 정보가 넘어가는 일이다."
            - "**최소 권한 원칙**: 필요한 만큼만, 필요한 동안만. 비밀번호·인증번호·카드 정보는 주지 않고, 다 쓴 연결은 해제한다."
            - 승인 화면에서는 **무엇을 · 어디에 · 내가 시킨 일인가**를 확인한다. 숨은 지시(**프롬프트 인젝션**)에 대비해 중요한 계정에는 에이전트를 들이지 않는다.
      - myth:
          items:
            - { myth: 권한을 많이 줄수록 에이전트가 일을 잘한다., truth: 실수와 공격의 피해 범위만 커진다. 필요한 만큼만 준다. }
            - { myth: "'허용'을 자주 누르면 귀찮지 않아서 좋다.", truth: 습관적인 허용은 확인 지점을 없애는 것과 같다. 매번 세 가지를 확인한다. }
      - checklist:
          items:
            - 커넥터와 MCP를 비유로 설명할 수 있다.
            - 맡길 일에 맞는 최소 권한을 고를 수 있다.
            - 승인 요청 화면을 읽고 허용·거절을 판단할 수 있다.

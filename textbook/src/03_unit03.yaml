unit: 3
part: 2
part_title: AI와 대화하기
title: 첫 대화 시작하기
glossary:
  - { term: 대화형 AI, en: chatbot, unit: 3, desc: "글이나 말로 묻고 답하는 AI 서비스. 흔히 '챗봇'이라고도 한다." }
  - { term: 2단계 인증, en: two-step verification, unit: 3, desc: "비밀번호에 더해 휴대폰 인증번호 등으로 한 번 더 본인임을 확인하는 보안 방법." }
  - { term: 새 대화, en: new chat, unit: 3, desc: "앞의 대화 내용과 섞이지 않게 처음부터 다시 시작하는 대화창." }
pages:
  - type: divider
    part: 2
    title: AI와 대화하기
    subtitle: AI 서비스를 시작하고, 원하는 결과가 나오도록 요청하고 다듬습니다.
    units: [[3, 첫 대화 시작하기], [4, "잘 묻는 법: 프롬프트 기본기"], [5, 생활과 일에 AI 쓰기]]

  - type: opener
    subtitle: 서비스 고르기부터 첫 질문, 이어서 묻기까지
    goals:
      - 대화형 AI 서비스를 고를 때 따져 볼 점 **3가지**를 말할 수 있다.
      - 채팅 화면의 주요 부분(입력창, 보내기, 새 대화, 대화 목록, 첨부, 음성)을 **찾을 수 있다.**
      - 질문하기 → 이어서 묻기 → 새 대화 열기를 **직접 해 볼 수 있다.**
    why: |
      처음이 가장 어렵습니다. 한 번 화면에 익숙해지면, 그다음부터는 **평소 말하듯 물어보기만 하면** 됩니다.
    hook:
      q: 처음 만난 AI에게 무엇이라고 말을 걸어 볼까요?
      figure:
        kind: chat
        input: 여기에 질문을 입력하세요
        messages:
          - { who: user, text: "안녕하세요. 저는 60대이고 AI를 처음 써 봐요. 어떤 걸 물어보면 좋을까요?" }
          - { who: ai, text: "반갑습니다! 예를 들어 ① 문자나 안내문 대신 써 주기 ② 긴 글을 짧게 요약하기 ③ 여행 계획 세우기 같은 걸 도와드릴 수 있어요." }
    keywords: [대화형 AI, 무료·유료, 2단계 인증, 입력창, 새 대화, 이어서 묻기]
    map: [서비스 고르기, 처음부터 지킬 3가지, 화면 익히기, 대화의 기본 동작]

  - type: concept
    sec: 03-1
    title: 나에게 맞는 서비스 고르기
    blocks:
      - p: 대화형 AI 서비스는 여러 회사에서 내놓고 있고, 이름과 기능은 자주 바뀝니다. 어느 것을 고르든 다음 세 가지를 따져 보면 실패가 적습니다.
      - table:
          label: 표 3-1
          caption: 서비스 고르기 3가지 기준
          widths: [26%, 74%]
          head: [기준, 이렇게 확인해요]
          rows:
            - - "**① 쓰기 편한가**"
              - 한국어로 자연스럽게 답하는지, 글씨 크기·음성 입력처럼 내게 필요한 기능이 있는지 직접 몇 번 물어봅니다.
            - - "**② 무료로 어디까지 되나**"
              - 무료는 하루 사용 횟수나 기능에 제한이 있습니다. 유료는 **월 구독**입니다. 무료로 충분히 써 본 뒤 결정합니다.
            - - "**③ 내 정보를 어떻게 다루나**"
              - 설정에서 **대화 내용을 AI 학습에 쓰는지**, 끌 수 있는지, 대화 기록을 지울 수 있는지 확인합니다.
      - warn:
          title: 가짜 앱을 조심하세요.
          body: 앱 장터에는 유명 서비스와 이름·그림이 비슷한 **가짜 앱**이 있습니다. 내려받기 전에 **개발사 이름**과 내려받은 사람 수를 확인하고, 설치하자마자 결제를 요구하면 지웁니다.
      - concept:
          title: 처음엔 무료로, 하나만 깊게
          body: 여러 서비스를 옮겨 다니기보다 **하나를 골라 2~3주 꾸준히** 써 보세요. 이 책에서 배우는 원리는 어느 서비스에서나 통합니다.
    side:
      - note:
          kind: term
          title: 대화형 AI (챗봇)
          body: 글이나 말로 묻고 답하는 AI 서비스. 'chat(수다)'과 'bot(로봇)'을 합친 말.
      - note:
          kind: tip
          title: 어떤 서비스가 있나요?
          body: 주요 서비스와 만든 회사는 **부록 C**에 있습니다. 앱 장터에서 검색한 뒤 **개발사 이름이 부록 C의 회사와 같은지** 확인하고 내려받으세요.
      - note:
          kind: tip
          body: 휴대폰 앱과 컴퓨터 웹사이트는 같은 계정으로 이어집니다. 휴대폰에서 시작한 대화를 컴퓨터에서 이어 볼 수 있어요.

  - type: concept
    sec: 03-2
    title: 시작하기 전에 꼭 지킬 3가지
    blocks:
      - p: 가입은 이메일이나 기존 계정(포털·메신저 계정 등)으로 할 수 있습니다. 간단하지만, **처음부터 지켜야 할 습관**이 있습니다. 나중에 7단원에서 더 자세히 배우지만, 실습 전에 이 세 가지는 꼭 기억하세요.
      - figure:
          kind: cards
          label: 그림 3-1
          caption: 첫날부터 지키는 안전 습관 3가지
          cols: 3
          items:
            - { key: "1", title: 이것만은 입력 금지, desc: "주민등록번호·계좌번호·카드번호·비밀번호·인증번호", ex: "→ AI 대화창에는 어떤 이유로도" }
            - { key: "2", title: 남의 정보는 가리기, desc: "가족·고객의 이름·전화번호·주소·진료 기록", ex: "→ 'A 고객', '김○○'처럼 바꿔서" }
            - { key: "3", title: 설정 한 번 확인, desc: "대화를 학습에 쓰는 설정, 2단계 인증", ex: "→ 가입한 날 바로 확인" }
      - p: 비밀번호는 다른 사이트와 **다르게** 정하고, 가능하면 **2단계 인증**을 켭니다. 비밀번호가 새어 나가도 휴대폰 인증이 한 번 더 막아 줍니다.
      - concept:
          title: 첫날의 약속
          body: |
            AI에게는 **"남에게 보여 줘도 괜찮은 내용"만** 입력한다.
            헷갈리면 넣지 않는다.
    side:
      - note:
          kind: term
          title: 2단계 인증
          body: 비밀번호 + 휴대폰 인증번호처럼 두 번 확인하는 방법. '2차 인증'이라고도 한다.
      - note:
          kind: warn
          body: '"AI 이용료 환불", "계정 정지"를 핑계로 **인증번호를 묻는 문자**는 사기입니다.'

  - type: concept
    sec: 03-3
    title: 채팅 화면 익히기
    blocks:
      - p: 서비스마다 모양은 조금씩 다르지만, 대화형 AI 화면은 대체로 아래 그림처럼 생겼습니다. 번호를 따라 내 화면에서 같은 버튼을 찾아보세요.
      - figure:
          kind: chatui
          label: 그림 3-2
          caption: 대화형 AI 화면의 주요 부분 (여러 서비스의 공통 모양을 정리한 그림)
          legend:
            - "**지난 대화** 목록 — 예전 대화를 다시 열기"
            - "**새 대화** — 새 주제를 시작할 때"
            - "**대화 창** — 내 말(오른쪽)과 AI 답(왼쪽)"
            - "**입력창** — 질문을 쓰는 곳"
            - "**첨부(＋)** — 사진·파일 올리기"
            - "**음성(🎤)** — 말로 입력하기"
            - "**보내기(↑)** — 질문 보내기"
            - "**설정(⚙)** — 계정·개인정보 설정"
      - tip:
          title: 휴대폰에서는 1·2·8번이 숨어 있어요.
          body: 휴대폰 화면에서는 지난 대화·새 대화·설정이 왼쪽 위 **☰(줄 세 개)** 메뉴나 내 사진(프로필) 안에 들어 있는 경우가 많습니다.
      - concept:
          title: 기억할 버튼은 세 개면 충분
          body: "**입력창**에 쓰고 → **보내기**를 누르고 → 주제가 바뀌면 **새 대화**. 나머지는 필요할 때 하나씩 익힌다."

  - type: concept
    sec: 03-4
    title: 대화의 기본 동작 세 가지
    blocks:
      - p: AI와의 대화는 사람과의 대화와 비슷합니다. 평소 말하듯 묻고, 부족하면 **이어서 묻고**, 주제가 바뀌면 **새로 시작**합니다. 맞춤법이 조금 틀려도 대부분 알아듣습니다.
      - figure:
          kind: flow
          label: 그림 3-3
          caption: 대화의 기본 동작 세 가지
          steps:
            - { title: 질문하기, desc: "평소 말하듯<br>문장으로 묻기" }
            - { title: 이어서 묻기, desc: '"더 짧게", "두 번째 것<br>자세히"', hl: true }
            - { title: 새 대화 열기, desc: "주제가 바뀌면<br>새로 시작" }
      - figure:
          kind: chat
          label: 그림 3-4
          caption: 이어서 묻기의 예. 같은 대화 안에서는 AI가 앞의 내용을 기억한다.
          input: null
          messages:
            - { who: user, text: "손주 생일 축하 문자 써 줘. 초등학교 2학년 남자아이야." }
            - { who: ai, text: "민준아, 생일 축하해! 🎂 씩씩하게 자라 줘서 할머니는 늘 고마워…" }
            - { who: user, text: "좋아. 조금 더 짧게, 공룡 이야기도 넣어 줘." }
      - p: 같은 대화 안에서는 "그거", "두 번째 것"이라고만 해도 AI가 앞의 내용을 기억해 알아듣습니다. 하지만 **새 대화는 기본적으로 이전 대화를 이어받지 않습니다.** (일부 정보를 기억하는 '기억 기능'은 11단원에서 배웁니다.)
    side:
      - note:
          kind: term
          title: 새 대화
          body: 앞 대화와 섞이지 않게 처음부터 시작하는 창. 앞 대화의 조건이 엉뚱하게 끼어드는 것을 막는다.
      - note:
          kind: tip
          body: 마이크(🎤)를 누르고 말로 해도 됩니다. 타자가 불편할 때 편리해요. 다만 **공공장소에서는 개인정보를 말하지 않습니다.**

  - type: practice
    title: 첫 대화를 해 봅시다
    blocks:
      - steps:
          items:
            - text: 대화형 AI 앱을 설치하고(부록 C 참고) 가입한 뒤 **새 대화**를 누릅니다. 설치가 어려우면 가족이나 강사에게 도움을 청하세요.
            - text: 입력창에 아래 문장을 그대로 쓰고 **보내기**를 누릅니다.
              prompt: 안녕하세요. 저는 AI를 처음 써 봐요. 제가 일상에서 AI에게 도움받을 수 있는 일 5가지를 쉬운 말로 알려 주세요.
            - text: 답이 오면 마음에 드는 번호를 골라 **이어서 묻습니다.**
              prompt: 그중 세 번째를 제 상황에 맞게 예를 들어 설명해 주세요.
            - text: 어려운 낱말이 나오면 이렇게 고쳐 묻습니다.
              prompt: 조금 더 쉬운 말로, 세 문장으로 다시 설명해 주세요.
            - text: 이제 **새 대화**를 열고 전혀 다른 주제(오늘 저녁 메뉴 추천)를 물어봅니다.
      - example:
          no: 1
          title: 이어서 물을까, 새로 시작할까?
          level: 1
          q: 김정숙 님이 손주 생일 문자를 만들던 대화창에서, 갑자기 **혈압약 복용 시간**이 궁금해졌습니다. 같은 대화에 이어서 물을까요, 새 대화를 열까요?
          steps:
            - 생일 문자와 혈압약은 **주제가 전혀 다릅니다.**
            - 같은 대화에 이어서 물으면 앞의 내용(생일, 손주)이 섞여 답이 엉뚱해질 수 있습니다.
          answer: 새 대화를 연다.
          memo: 건강 질문의 답은 참고만 하고, 복용 시간은 꼭 약사·의사에게 확인하세요. (5단원)

  - type: exercises
    title: 3단원을 확인해 봅시다
    blocks:
      - exercises:
          items:
            - no: 1
              level: 1
              kind: match
              q: 그림 3-2의 버튼과 하는 일을 알맞게 이으세요.
              pairs: [[새 대화 버튼, 사진·파일 올리기], [첨부(＋) 버튼, 새 주제 시작하기], [음성(🎤) 버튼, 계정·개인정보 설정], [설정(⚙) 버튼, 말로 입력하기]]
              answer: "ㄱ-②, ㄴ-①, ㄷ-④, ㄹ-③"
            - no: 2
              level: 1
              kind: mc
              q: AI에 입력해도 **괜찮은** 것은?
              cols: 2
              choices: [내 계좌번호, 휴대폰 인증번호, 김치찌개 끓이는 순서, 친구의 주민등록번호]
              answer: ③
              explain: 계좌번호·인증번호·주민등록번호는 AI 대화창에 입력하지 않는다.
            - no: 3
              level: 2
              kind: ox
              q: 맞으면 O, 틀리면 X에 표시하세요.
              statements:
                - 새 대화를 열면 바로 앞 대화에서 주고받은 글 전체가 그대로 이어진다.
                - 같은 대화 안에서는 "두 번째 것 자세히"처럼 짧게 이어서 물어도 된다.
                - 설치하자마자 결제를 요구하는 AI 앱은 일단 의심한다.
              answer: (ㄱ) X (ㄴ) O (ㄷ) O
              explain: 새 대화는 기본적으로 앞 대화를 이어받지 않는다(기억 기능이 있어도 일부 정보만 기억한다). 이름이 비슷한 가짜 앱이 결제를 유도하는 경우가 있다.
            - no: 4
              level: 2
              kind: short
              q: 서비스를 고를 때 따져 볼 3가지 기준을 쓰세요.
              lines: 1
              answer: 쓰기 편한가 / 무료로 어디까지 되나 / 내 정보를 어떻게 다루나
            - no: 5
              level: 3
              kind: practice
              q: 따라 해 보기의 순서대로 첫 대화를 하고, AI가 알려 준 도움받을 수 있는 일 5가지 중 **내가 가장 해 보고 싶은 것** 하나를 쓰세요.
              lines: 1
              answer: (예시) 긴 안내문을 짧게 요약하기
              explain: "채점 포인트: 실제로 대화를 해 보고, 그 결과에서 하나를 골랐는가"

  - type: summary
    title: 3단원 정리
    blocks:
      - summary:
          items:
            - 서비스는 **쓰기 편한가 · 무료 범위 · 개인정보 처리**로 고르고, 처음엔 무료로 하나를 꾸준히 쓴다.
            - 첫날부터 **입력 금지 정보**(주민번호·계좌·카드·비밀번호·인증번호)를 지키고, 남의 정보는 가린다.
            - 화면에서 꼭 알아야 할 버튼은 **입력창 · 보내기 · 새 대화** 세 가지다.
            - 대화의 기본은 **질문하기 → 이어서 묻기 → (주제가 바뀌면) 새 대화**다.
      - myth:
          items:
            - { myth: 질문은 맞춤법을 정확히 지켜야 한다., truth: 평소 말하듯 써도 대부분 알아듣는다. }

unit: 1
part: 1
part_title: AI와 친해지기
title: AI, 이미 우리 곁에
glossary:
  - { term: 인공지능(AI), en: Artificial Intelligence, unit: 1, desc: "사람이 하던 인식·예측·추천·생성 같은 지적인 일을 컴퓨터가 하도록 만든 기술." }
  - { term: 머신러닝, en: Machine Learning, unit: 1, desc: "사람이 규칙을 일일이 쓰는 대신, 많은 예시(데이터)를 보여 주면 컴퓨터가 스스로 패턴을 찾아 배우는 방식." }
  - { term: 딥러닝, en: Deep Learning, unit: 1, desc: "사람 뇌의 신경망을 본뜬 여러 층의 계산 구조로 배우는 머신러닝의 한 방법." }
  - { term: 생성형 AI, en: Generative AI, unit: 1, desc: "글·그림·소리·영상 같은 새로운 콘텐츠를 만들어 내는 AI." }
  - { term: 데이터, en: data, unit: 1, desc: "AI가 배우는 재료가 되는 글·사진·숫자 같은 자료." }
pages:
  - type: divider
    part: 1
    title: AI와 친해지기
    subtitle: AI가 무엇이고, 생성형 AI가 어떻게 답을 만드는지 알아봅니다.
    units: [[1, "AI, 이미 우리 곁에"], [2, 생성형 AI는 어떻게 말을 만들까]]

  - type: opener
    subtitle: 매일 쓰고 있지만 잘 몰랐던 AI 찾기
    goals:
      - 생활 속에서 AI가 쓰이는 곳을 **3가지 이상** 찾을 수 있다.
      - "**규칙을 정해 주는 프로그램**과 **예시로 배우는 AI**의 차이를 설명할 수 있다."
      - AI·머신러닝·딥러닝·생성형 AI의 **포함 관계**를 그림으로 나타낼 수 있다.
    why: |
      AI는 먼 미래의 로봇이 아닙니다. 여러분은 **오늘 아침에도 AI를 여러 번 썼습니다.** 이미 쓰고 있는 AI를 알아보는 것이 AI 리터러시의 첫걸음입니다.
    hook:
      q: 오늘 아침부터 지금까지, 휴대폰이 여러분 대신 "판단"하거나 "추천"해 준 일이 있었나요?
      figure:
        kind: chat
        input: null
        messages:
          - { who: user, name: 김정숙, text: "나는 AI 같은 거 안 써요. 어려워서요." }
          - { who: ai, name: 손주, text: "할머니, 아까 사진첩에서 '얼굴별 앨범' 보셨잖아요. 그것도 AI예요!" }
    keywords: [인공지능(AI), 규칙형 프로그램, 머신러닝, 딥러닝, 생성형 AI, 데이터]
    map: [생활 속 AI 찾기, 규칙형 vs 학습형, AI 가족 관계]

  - type: concept
    sec: 01-1
    title: AI는 이미 우리 하루 속에 있다
    blocks:
      - p: "**인공지능(AI)**은 사람이 하던 **인식·예측·추천·생성** 같은 지적인 일을 컴퓨터가 하도록 만든 기술입니다. 이름은 거창하지만, 우리는 이미 하루에도 여러 번 AI를 씁니다."
      - figure:
          kind: dayline
          label: 그림 1-1
          caption: 하루 일과 속 AI. 오른쪽 주황색 칸은 AI가 하는 일이다.
          events:
            - { time: 아침 7시, icon: "🔓", title: 얼굴로 휴대폰 잠금 풀기, ai: 얼굴 인식 }
            - { time: 아침 8시, icon: "🚗", title: 내비게이션 도착 시간, ai: 막히는 길 예측 }
            - { time: 낮 12시, icon: "📩", title: 스팸 문자 자동 분류, ai: 사기 문자 판단 }
            - { time: 저녁 7시, icon: "📺", title: 동영상·쇼핑 추천, ai: 좋아할 것 예측 }
            - { time: 밤 9시, icon: "🗣️", title: "\"내일 날씨 알려 줘\"", ai: 말소리 알아듣기 }
      - p: AI가 하는 일은 크게 네 가지로 나눌 수 있습니다. 얼굴·목소리를 **알아보고(인식)**, 앞으로 일어날 일을 **내다보고(예측)**, 좋아할 만한 것을 **골라 주고(추천)**, 글·그림을 새로 **만들어 냅니다(생성)**.
      - concept:
          title: 인공지능(AI)이란?
          body: 사람의 지적인 일(인식·예측·추천·생성)을 컴퓨터가 대신하도록 만든 기술. **이미 생활 곳곳에 들어와 있다.**
    side:
      - note:
          kind: term
          title: AI
          body: Artificial Intelligence의 줄임말. '인공(사람이 만든) 지능'이라는 뜻이다.
      - note:
          kind: tip
          body: 은행 앱이 "평소와 다른 해외 결제"를 막아 주는 것도 AI가 이상한 거래를 **예측**한 결과입니다.
      - note:
          kind: fact
          body: 이 책에서 주로 배우는 것은 네 가지 중 **'생성'**을 하는 AI와, 그 AI가 일을 직접 처리하는 **에이전트**입니다.

  - type: concept
    sec: 01-2
    title: 규칙을 정해 주는 프로그램 vs 예시로 배우는 AI
    blocks:
      - p: 컴퓨터에게 일을 시키는 방법은 두 가지가 있습니다. 하나는 사람이 **"만약 ~이면 ~해라"** 하는 규칙을 하나하나 써 주는 방법입니다. 엘리베이터는 버튼을 누르면 그 층으로 갑니다. 정해진 규칙대로만 움직입니다.
      - p: 그런데 "고양이 사진 알아보기"는 규칙으로 쓰기 어렵습니다. 고양이는 색도, 자세도, 크기도 제각각이기 때문입니다. 그래서 사람이 **고양이 사진을 수만 장 보여 주면** 컴퓨터가 스스로 특징을 찾게 합니다. 이것이 **머신러닝**, 곧 예시로 배우는 AI입니다.
      - figure:
          kind: compare
          label: 그림 1-2
          caption: 규칙형은 요리책대로 만드는 요리, 학습형은 수없이 맛보며 감을 익힌 요리사와 비슷하다.
          left:
            title: "📖 규칙형 프로그램"
            items: [사람이 규칙을 모두 써 준다, 늘 같은 결과 → 예측하기 쉽다, 규칙으로 못 쓰는 일은 못 한다, "예: 엘리베이터, 계산기, 알람"]
            verdict: 요리책 그대로 만드는 요리
          right:
            title: "👨‍🍳 예시로 배우는 AI (학습형)"
            items: [사람이 예시(데이터)를 많이 보여 준다, 스스로 패턴을 찾아 판단한다, 처음 보는 것도 어느 정도 알아본다, "예: 얼굴 인식, 스팸 걸러내기, 번역"]
            verdict: 수없이 맛보며 감을 익힌 요리사
      - concept:
          title: 학습형 AI의 특징
          body: 정답 규칙을 외운 것이 아니라 **예시에서 배운 패턴**으로 판단한다. 그래서 처음 보는 것도 다룰 수 있지만, **가끔 틀린다.**
    side:
      - note:
          kind: term
          title: 머신러닝 (기계 학습)
          body: 많은 예시를 보여 주면 컴퓨터가 스스로 패턴을 찾아 배우는 방식.
      - note:
          kind: term
          title: 데이터
          body: AI가 배우는 재료. 글, 사진, 숫자, 소리 모두 데이터가 될 수 있다.
      - note:
          kind: tip
          body: '구별하는 질문 하나: "정답이 미리 정해진 규칙인가, 예시로 배운 감인가?"'

  - type: concept
    sec: 01-3
    title: AI 가족 관계 한눈에 보기
    blocks:
      - p: AI라는 큰 울타리 안에 여러 기술이 들어 있습니다. 예시로 배우는 **머신러닝**, 그중에서도 뇌의 신경망을 본뜬 여러 층의 계산으로 배우는 **딥러닝**, 그리고 딥러닝으로 글·그림을 새로 만들어 내는 **생성형 AI**가 있습니다.
      - figure:
          kind: nested
          label: 그림 1-3
          caption: AI 가족 관계. 안쪽으로 갈수록 범위가 좁고 구체적이다.
          rings:
            - { label: 인공지능 (AI), desc: 사람의 지적인 일을 하는 기술 전체 }
            - { label: 머신러닝, desc: 예시(데이터)로 배우는 AI }
            - { label: 딥러닝, desc: 여러 층의 신경망으로 배움 }
            - { label: 생성형 AI, desc: 새 글·그림을 만듦 }
      - p: 대화형 AI 서비스는 맨 안쪽의 생성형 AI에 속합니다. 4부에서 배울 **에이전트**는 이 생성형 AI가 대화를 넘어 **직접 일을 처리하도록** 발전한 것입니다.
      - warn:
          title: "'AI 탑재' 광고에 주의하세요."
          body: 단순한 자동 기능에도 'AI'라는 이름을 붙여 비싸게 파는 경우가 있습니다. **"이 제품의 AI가 정확히 무엇을 알아보거나 예측하나요?"**라고 물어보고 사세요.
    side:
      - note:
          kind: term
          title: 딥러닝
          body: 뇌 신경망을 본뜬 여러 층(Deep)의 계산 구조로 배우는 머신러닝.
      - note:
          kind: term
          title: 생성형 AI
          body: 글·그림·소리 등 새로운 것을 만들어 내는(생성) AI.

  - type: example
    title: 어떤 것이 AI일까?
    blocks:
      - example:
          no: 1
          title: 학습형 AI 골라내기
          level: 1
          q: |
            다음 중 **예시로 배우는 AI(학습형)**를 모두 고르세요.
            ① 매일 아침 7시에 울리는 알람　② 얼굴 인식 잠금　③ 계산기의 곱셈　④ 사진 속 얼굴로 앨범을 나누는 기능
          steps:
            - "**기준 세우기**: 정답이 미리 정해진 규칙인지, 예시로 배운 패턴인지 따져 봅니다."
            - ① 알람과 ③ 곱셈은 사람이 정한 규칙(시각, 계산법)대로 움직입니다. → 규칙형
            - ② 얼굴 인식과 ④ 얼굴별 앨범은 수많은 얼굴 사진으로 배운 패턴으로 알아봅니다. → 학습형
          answer: ②, ④
          memo: 같은 휴대폰 안에도 규칙형 기능과 학습형 AI가 섞여 있습니다.
      - similar:
          no: 1
          level: 1
          q: |
            박영호 사장님 가게의 계산대(POS기) 기능입니다. 이 중 **학습형 AI**가 쓰였을 가능성이 가장 높은 것을 고르세요.
          choices: [바코드를 찍으면 가격이 나온다, 카드를 꽂으면 결제된다, 요일·날씨별 빵 판매량을 내다보고 생산량을 추천한다, 영수증을 출력한다]
          answer: ③
          explain: 판매 기록(데이터)에서 패턴을 배워 앞으로를 예측하는 것은 학습형 AI가 잘하는 일이다. 나머지는 정해진 규칙대로 움직인다.
      - similar:
          no: 2
          level: 2
          q: 이수진 주무관은 "민원 문자를 내용별로 자동 분류해 주는 AI"를 도입하려 합니다. 이 AI를 만들려면 무엇을 많이 준비해야 할까요? 한 문장으로 쓰세요.
          lines: 2
          answer: 이미 분류해 둔 민원 문자 예시(데이터)를 많이 준비해야 한다.
          explain: 학습형 AI는 규칙 대신 예시로 배우므로, '이 문자는 주차 민원', '이 문자는 쓰레기 민원'처럼 정답이 붙은 예시가 많이 필요하다.

  - type: exercises
    title: 1단원을 확인해 봅시다
    blocks:
      - exercises:
          items:
            - no: 1
              level: 1
              kind: ox
              q: 맞으면 O, 틀리면 X에 표시하세요.
              statements:
                - AI는 로봇 안에만 들어 있다.
                - 스팸 문자를 걸러 주는 기능에도 AI가 쓰인다.
                - 학습형 AI는 예시를 보고 배우기 때문에 가끔 틀릴 수 있다.
              answer: (ㄱ) X (ㄴ) O (ㄷ) O
              explain: AI는 휴대폰·은행·내비게이션 등 생활 곳곳에 있다. 예시에서 배운 패턴으로 판단하므로 틀릴 수 있다.
            - no: 2
              level: 1
              kind: match
              q: 생활 속 기능과 AI가 하는 일을 알맞게 이으세요.
              pairs: [[얼굴로 잠금 풀기, 생성], [동영상 추천, 인식], [도착 시간 알려 주기, 추천], [요청하면 안내문 써 주기, 예측]]
              answer: "ㄱ-② 인식, ㄴ-③ 추천, ㄷ-④ 예측, ㄹ-① 생성"
            - no: 3
              level: 2
              kind: short
              q: "그림 1-3을 보고 빈칸을 채우세요. 인공지능 → (( 머신러닝 )) → 딥러닝 → (( 생성형 AI ))"
              answer: 머신러닝, 생성형 AI
            - no: 4
              level: 2
              kind: mc
              q: 규칙형 프로그램과 학습형 AI를 비교한 설명으로 **옳지 않은** 것은?
              choices:
                - 규칙형은 사람이 규칙을 모두 써 준다.
                - 학습형은 예시(데이터)에서 패턴을 찾는다.
                - 학습형은 처음 보는 사진도 어느 정도 알아볼 수 있다.
                - 학습형은 규칙을 외웠기 때문에 절대 틀리지 않는다.
              answer: ④
              explain: 학습형 AI는 규칙이 아니라 배운 패턴으로 판단하므로 틀릴 수 있다.
            - no: 5
              level: 3
              kind: essay
              q: 오늘 하루 내가 쓴 AI를 **3가지** 적고, 각각 인식·예측·추천·생성 중 무엇을 했는지 쓰세요.
              lines: 2
              answer: (예시) 얼굴 잠금 – 인식 / 내비게이션 도착 시간 – 예측 / 동영상 추천 – 추천
              explain: "채점 포인트: ① 실제 생활 속 기능을 3가지 들었는가 ② AI가 하는 일을 알맞게 짝지었는가"

  - type: summary
    title: 1단원 정리
    blocks:
      - summary:
          items:
            - "**AI**는 사람의 지적인 일(인식·예측·추천·생성)을 컴퓨터가 하도록 만든 기술이며, 이미 생활 곳곳에 있다."
            - "**규칙형 프로그램**은 사람이 쓴 규칙대로, **학습형 AI(머신러닝)**는 예시에서 배운 패턴으로 판단한다."
            - AI 안에 머신러닝, 그 안에 딥러닝, 그 안에 **생성형 AI**가 있다. 대화형 AI와 에이전트는 생성형 AI에 속한다.
            - 학습형 AI는 처음 보는 것도 다룰 수 있지만 **가끔 틀린다.** 이 사실이 이 책 전체의 출발점이다.
      - myth:
          items:
            - { myth: AI는 먼 미래의 기술이고 나와는 상관없다., truth: 휴대폰 잠금·스팸 차단·추천처럼 하루에도 여러 번 쓰고 있다. }
            - { myth: "'AI'가 붙은 제품은 다 똑똑하다.", truth: 단순 자동 기능에 이름만 붙인 경우도 있다. 무엇을 알아보거나 예측하는지 물어보자. }
            - { myth: 나이가 많으면 AI를 배우기 어렵다., truth: 에이전트는 코딩 없이 말로 일을 시키는 도구다. 지금 시작해도 충분하다. }
      - checklist:
          items:
            - 생활 속 AI를 3가지 이상 찾을 수 있다.
            - 규칙형 프로그램과 학습형 AI의 차이를 예를 들어 말할 수 있다.
            - AI 가족 관계(AI › 머신러닝 › 딥러닝 › 생성형 AI)를 상자 그림으로 그릴 수 있다.

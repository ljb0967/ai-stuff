# 앞부분: 표지 · 이 책을 펴내며 · 이 책의 구성과 활용법 · 등장인물과 학습 지도 · 차례
title: 앞부분
pages:
  - type: cover
    kicker: AI LITERACY WORKBOOK · 개념부터 실전까지
    title: "처음 배우는<br>AI 리터러시"
    subtitle: 질문하기부터 에이전트에게 일 맡기기까지<br>— AI를 처음 만나는 어른을 위한 개념·예제·문제 —
    figure:
      kind: flow
      steps:
        - { no: 1부, title: AI와 친해지기, desc: 원리 이해 }
        - { no: 2부, title: AI와 대화하기, desc: 질문과 활용 }
        - { no: 3부, title: 믿을 수 있게 쓰기, desc: 확인과 안전 }
        - { no: 4부, title: AI에게 일 맡기기, desc: 에이전트 활용, hl: true }
    bottom: 4부 12단원 · 예제 · 따라 해 보기 · 확인 문제 · 정답 및 해설

  - type: front
    title: 이 책을 펴내며
    blocks:
      - lead: AI는 이제 "알아 두면 좋은 기술"이 아니라, 스마트폰처럼 **생활의 기본 도구**가 되었습니다.
      - p: 그런데 많은 분이 이렇게 말씀하십니다. "써 보긴 했는데 뭘 물어야 할지 모르겠다", "틀린 말을 할까 봐 못 믿겠다", "에이전트라는 말은 들어 봤는데 무슨 뜻인지 모르겠다."
      - p: 이 책은 바로 그런 분들을 위해 만들었습니다. AI에 대한 지식이 전혀 없어도 괜찮습니다. 고등학교 수학 문제집처럼 **개념을 익히고, 예제로 확인하고, 문제로 다지는** 순서를 따라가면 됩니다.
      - p: 이 책의 마지막 목표는 여러분이 **AI 에이전트에게 일을 맡기고, 그 결과를 스스로 검수할 수 있게** 되는 것입니다. 에이전트는 코딩 없이 **말로 일을 시키는 도구**입니다. 그래서 늦게 시작해도 충분히 따라잡을 수 있습니다.
      - concept:
          label: 이 책이 끝까지 강조하는 한 가지
          title: AI는 도구이고, 마지막 판단과 책임은 사람에게 있습니다.
          body: |
            AI는 빠르고 성실하지만 틀릴 수 있습니다. 그래서 이 책은 "잘 쓰는 법"과 함께 **"확인하는 법"**과 **"맡기지 말아야 할 일"**을 반드시 함께 가르칩니다.
      - info:
          label: 참고한 기준
          body: |
            - OECD·유럽연합집행위원회 「AI 리터러시 프레임워크」(2026) — AI와 관계 맺기 · AI로 만들기 · AI 관리하기 · AI 설계하기
            - UNESCO 「학생 AI 역량 프레임워크」(2024) — 이해 → 적용 → 창조의 3단계
            - 이 책은 이 기준을 성인·중장년 학습자에 맞게 다시 짰습니다. 특히 에이전트를 **관리하는 능력**(무엇을 맡기고, 어떻게 감독할지)에 4부 전체를 썼습니다.
      - p: 서비스 이름과 버튼 위치는 몇 달마다 바뀝니다. 그래서 이 책의 화면 그림은 특정 회사의 화면이 아니라 **어느 서비스에서나 비슷한 모양을 정리한 그림**입니다. 이 책에서 배우는 원리와 습관은 서비스가 바뀌어도 그대로 통합니다.

  - type: front
    title: 이 책의 구성과 활용법
    subtitle: 한 단원은 7~10쪽, 60~90분이면 공부할 수 있습니다.
    blocks:
      - table:
          widths: [24%, 76%]
          head: ['이렇게 생겼어요', '무엇을 하나요?']
          rows:
            - - '**단원 도입**'
              - '학습 목표 3가지와 "왜 배우나요?", 생활 속 질문으로 단원을 시작합니다.'
            - - '**개념 익히기** `02-1`'
              - '한 쪽에 한 가지 개념만 다룹니다. 줄글 설명 아래에 그림·표가 있고, 오른쪽 **곁단**에는 어려운 낱말 풀이(용어)와 TIP이 있습니다.'
            - - '**핵심 개념** 상자'
              - '그 쪽에서 꼭 기억할 내용을 한두 문장으로 정리합니다. 시간이 없으면 이 상자만 읽어도 됩니다.'
            - - '**⚠ 주의** 상자'
              - '돈·개인정보·건강처럼 조심해야 할 점입니다. 단원마다 하나 이상 있습니다.'
            - - '**예제**와 **풀이**'
              - '등장인물의 실제 생활 장면을 문제로 만들고, 풀이를 단계별로 보여 줍니다.'
            - - '**유제**'
              - '예제와 비슷한 문제를 직접 풀어 봅니다. 정답은 책 뒤 **정답 및 해설**에 있습니다.'
            - - '**따라 해 보기**'
              - '휴대폰이나 컴퓨터로 직접 해 보는 실습입니다. **"이렇게 입력해 보세요"** 상자의 글을 그대로 입력해도 됩니다.'
            - - '**확인 문제** ★★☆'
              - '단원을 마치고 푸는 문제입니다. 별이 많을수록 어렵습니다.'
            - - '**단원 마무리**'
              - '핵심 정리, 흔한 오해와 진실, 스스로 점검하기 표로 단원을 마칩니다.'
      - tip:
          title: 이렇게 공부하면 좋아요
          body: |
            1. 개념 쪽은 **소리 내어** 읽어 보세요. 낯선 낱말은 곁단을 먼저 봅니다.
            2. 예제는 풀이를 가리고 먼저 생각해 본 뒤 확인합니다.
            3. **따라 해 보기는 꼭 직접** 해 보세요. AI는 써 볼수록 빨리 익숙해집니다.
            4. 스스로 점검하기에서 "다시"에 표시한 단원은 일주일 뒤 한 번 더 봅니다.
      - warn:
          title: 실습 전에 꼭 지켜 주세요.
          body: 주민등록번호·계좌번호·카드번호·비밀번호는 **AI 대화창에 입력하지 않습니다.** (로그인은 서비스의 공식 화면에서만 합니다.) 자세한 내용은 3단원과 7단원에서 배웁니다.

  - type: front
    title: 함께 공부할 사람들
    subtitle: 이 책의 예제와 문제는 네 사람의 생활과 일에서 나옵니다.
    blocks:
      - persona:
          items:
            - { face: "👵", name: 김정숙, meta: 62세 · 은퇴한 초등교사, desc: 스마트폰 메신저와 동영상은 능숙하지만 AI는 뉴스로만 들었다. 동네 독서 모임 총무를 맡고 있다., want: "바라는 것: 독서 모임 운영, 손주와의 대화, 여행 계획" }
            - { face: "👨‍🍳", name: 박영호, meta: 55세 · 동네 빵집 사장, desc: 컴퓨터로 표 계산 정도는 한다. 안내문·리뷰 답글·장부 정리에 저녁 시간을 다 쓴다., want: "바라는 것: 가게 홍보, 서류 작업 줄이기, 부모님 건강 정보 정리" }
            - { face: "👩‍💼", name: 이수진, meta: 45세 · 구청 행정직, desc: 회사에서 AI 도구를 쓰라고 하는데 비전공자라 막막하다., want: "바라는 것: 보고서 초안, 회의록 요약, 반복 업무 맡기기" }
            - { face: "🧑‍🎓", name: 최민호, meta: 29세 · 인문계 취업 준비생, desc: 대화형 AI에 질문은 해 봤지만 '에이전트'는 잘 모른다., want: "바라는 것: 채용 정보 조사, 자기소개서 다듬기, 출처 확인" }
      - figure:
          kind: flow
          label: 학습 지도
          caption: 12단원은 네 단계로 나뉩니다. 앞 단계를 익혀야 다음 단계가 쉬워집니다.
          steps:
            - { no: "1부 · 01~02", title: AI와 친해지기, desc: "AI가 무엇이고<br>어떻게 답을 만드는지" }
            - { no: "2부 · 03~05", title: AI와 대화하기, desc: "잘 묻고, 다듬고,<br>생활과 일에 쓰기" }
            - { no: "3부 · 06~07", title: 믿을 수 있게 쓰기, desc: "답 확인하기,<br>개인정보·사기 피하기" }
            - { no: "4부 · 08~12", title: AI에게 일 맡기기, desc: "에이전트에게 맡기고<br>감독·검수하기", hl: true }
      - concept:
          label: 다 배우고 나면
          title: 이런 일을 스스로 할 수 있게 됩니다.
          body: |
            - 원하는 결과가 나오도록 AI에게 **구체적으로 요청**하고, 마음에 들 때까지 **고쳐 묻기**
            - AI의 답을 **3단계로 확인**하고, 개인정보·딥보이스 사기를 **피하기**
            - 에이전트에게 **"심부름 6문"**으로 일을 맡기고, **권한을 최소로** 정하고, 결과를 **검수**하기
            - 반복되는 일을 **나만의 AI 작업 루틴**으로 만들기

  - type: toc
    title: 차례

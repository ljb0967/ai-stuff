# 디자인 시안 비교용 견본 — 실제 2단원 원고 일부 (opener / concept / example / exercises)
unit: 2
part: 1
part_title: AI와 친해지기
title: 생성형 AI는 어떻게 말을 만들까
pages:
  - type: opener
    subtitle: 그럴듯한 다음 말을 고르는 기계, 그래서 생기는 장점과 한계
    goals:
      - 생성형 AI가 **"다음에 올 말을 예측"**해 문장을 만든다는 것을 설명할 수 있다.
      - 같은 질문에도 답이 **매번 조금씩 다른 이유**를 말할 수 있다.
      - 생성형 AI의 **한계 세 가지**(환각, 지식 시점, 대화 기억 한계)를 예를 들어 설명할 수 있다.
    why: |
      AI가 어떻게 답을 만드는지 알면, **언제 믿고 언제 확인해야 하는지**가 저절로 보입니다. 원리를 아는 사람이 도구를 가장 안전하게 씁니다.
    hook:
      q: "다음 빈칸에 들어갈 말은 무엇일까요?  “동해물과 백두산이 ____”"
      figure:
        kind: chat
        input: null
        messages:
          - { who: user, text: "동해물과 백두산이" }
          - { who: ai, text: "마르고 닳도록, 하느님이 보우하사 우리나라 만세…" }
    keywords: [대규모 언어 모델(LLM), 토큰, 확률, 환각, 지식 시점, 맥락 창]
    map: [다음 말 맞히기, 학습과 대화, 답이 달라지는 이유, 꼭 알아야 할 한계]

  - type: concept
    sec: 02-1
    title: 다음 말 맞히기 게임
    blocks:
      - p: 여러분은 "동해물과 백두산이" 다음에 어떤 말이 올지 바로 압니다. 그 노래를 **수없이 들었기 때문**입니다. 생성형 AI도 이와 비슷한 방식으로 말을 만듭니다.
      - p: 생성형 AI의 바탕에는 **대규모 언어 모델(LLM)**이 있습니다. 책·기사·웹 문서처럼 엄청난 양의 글을 읽고, 어떤 말 다음에 어떤 말이 자주 오는지를 익힌 프로그램입니다.
      - figure:
          kind: bar
          label: 그래프 2-1
          caption: "“오늘 날씨가 정말 ___” 다음에 올 말의 확률 (설명을 위한 가상의 값)"
          unit: "%"
          highlight: 좋네요
          items: [[좋네요, 52], [덥네요, 21], [춥네요, 15], [이상하네요, 7], [기타, 5]]
      - p: AI는 앞 문장을 보고 다음 말 후보마다 **확률**을 매깁니다. 그중 하나를 골라 붙이고, 다시 다음 말을 고르는 일을 수백 번 되풀이해 긴 답을 완성합니다.
      - concept:
          title: 생성형 AI가 글을 만드는 방법
          body: |
            앞의 글을 보고 → **다음에 올 말을 예측**하고 → 하나를 골라 붙이기를 **반복**한다.
            AI는 "사실인지"가 아니라 **"그럴듯한지"**를 기준으로 말을 고른다.
    side:
      - note:
          kind: term
          title: 대규모 언어 모델 (LLM)
          body: Large Language Model. 아주 많은(Large) 글로 배운 언어(Language) 모델(Model). 대화형 AI의 '두뇌'에 해당한다.
      - note:
          kind: term
          title: 토큰 (token)
          body: AI가 글을 나누어 처리하는 작은 조각. 한국어는 대략 글자 1~2개가 1토큰이다. 이용량을 토큰으로 세기도 한다.
      - note:
          kind: tip
          body: 휴대폰 자판의 **추천 단어** 기능을 떠올려 보세요. LLM은 그 기능을 엄청나게 키우고 다듬은 것과 비슷합니다.

  - type: example
    title: 답을 그대로 믿어도 될까?
    blocks:
      - example:
          no: 1
          title: 도서관 휴관일 묻기
          level: 1
          q: |
            김정숙 님이 AI에게 "우리 동네 ○○도서관 오늘 문 열어?"라고 물었더니, AI가 **"네, 매주 월요일만 휴관합니다"**라고 답했습니다. 이 답을 그대로 믿으면 안 되는 이유 두 가지를 쓰고, 확인 방법을 말해 보세요.
          steps:
            - "**지식 시점**: AI는 배운 시점 이후의 변화(임시 휴관, 운영 시간 변경)를 모를 수 있습니다."
            - "**환각 가능성**: 많은 도서관이 월요일에 쉰다는 '흔한 패턴'으로 그럴듯하게 답했을 수 있습니다."
            - "**확인**: 도서관 공식 홈페이지나 전화로 오늘 운영 여부를 직접 확인합니다."
          answer: 지식 시점과 환각 때문에 틀릴 수 있다. 공식 홈페이지·전화로 확인한다.
          memo: 지역 정보(영업시간·주소·전화번호)는 AI가 특히 자주 틀리는 영역!
      - figure:
          kind: tokens
          label: 그림 2-2
          caption: 낱말을 하나씩 붙여 가며 문장을 만드는 과정. 주황색이 새로 고른 말이다.
          rows:
            - [오늘]
            - [오늘, 날씨가]
            - [오늘, 날씨가, 정말]
          next: "좋네요?"
      - similar:
          no: 1
          level: 1
          q: 같은 질문을 두 번 했더니 AI의 답 표현이 조금 달랐습니다. AI가 고장 난 것일까요? 한 문장으로 답해 보세요.
          lines: 2
          answer: 고장이 아니다.
          explain: 확률에 따라 후보 중 하나를 고르도록 만들어져 있어, 할 때마다 표현이 조금씩 달라질 수 있다.

  - type: exercises
    title: 2단원을 확인해 봅시다
    blocks:
      - exercises:
          items:
            - no: 1
              level: 1
              kind: short
              q: 빈칸에 알맞은 말을 쓰세요. "대규모 언어 모델은 앞의 글을 보고 다음에 올 (( 말 ))을 예측하여 문장을 만든다."
              lines: 1
              answer: 말(낱말)
            - no: 2
              level: 1
              kind: mc
              q: '"환각(hallucination)"에 대한 설명으로 가장 알맞은 것은?'
              choices:
                - AI가 사람처럼 꿈을 꾸는 현상
                - 그럴듯하지만 사실이 아닌 내용을 자신 있게 말하는 현상
                - AI가 질문을 이해하지 못해 답을 거부하는 현상
                - 인터넷이 끊겨 답이 늦게 나오는 현상
              answer: ②
              explain: AI는 "그럴듯한" 말을 고르기 때문에, 사실이 아닌 내용도 자연스럽게 만들어 낼 수 있다.
            - no: 3
              level: 2
              kind: ox
              q: 다음 설명이 맞으면 O, 틀리면 X에 표시하세요.
              statements:
                - AI는 학습한 시점 이후에 생긴 일도 항상 정확히 알고 있다.
                - 같은 질문에도 AI의 답 표현은 매번 달라질 수 있다.
                - AI가 자신 있게 말하면 사실이라고 믿어도 된다.
              answer: (ㄱ) X (ㄴ) O (ㄷ) X
              explain: 지식 시점 이후의 일은 모를 수 있고, 자신감 있는 말투와 사실 여부는 관계가 없다.
            - no: 4
              level: 3
              kind: essay
              q: 그래프 2-1을 보고, AI가 "좋네요"를 고를 가능성이 가장 높은 이유를 **학습**이라는 낱말을 넣어 설명하세요.
              lines: 3
              answer: (예시) 학습한 글에서 "오늘 날씨가 정말" 다음에 "좋네요"가 가장 자주 나왔기 때문에 확률이 가장 높다.
